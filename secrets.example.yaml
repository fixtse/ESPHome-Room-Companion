# Copy to secrets.yaml; use real values only in the ignored copy.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
# Generate: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_GENERATED_BASE64_KEY"
ota_password: "REPLACE_WITH_UNIQUE_OTA_PASSWORD"
fallback_ap_password: "REPLACE_WITH_UNIQUE_AP_PASSWORD"
# Optional renderer: must match 'Bearer ' + RENDERER_TOKEN on the server.
renderer_authorization: "Bearer REPLACE_WITH_RENDERER_TOKEN"
