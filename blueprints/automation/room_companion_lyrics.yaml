blueprint:
  name: Room Companion synced lyrics
  description: >
    Shows synced lyrics on the Room Companion media screen. When the media
    player starts a new track, Home Assistant asks LRCLIB (https://lrclib.net)
    for timed lyrics once, then sends them to the panel. The panel keeps the
    current line in time with the track position on its own, so nothing else
    is sent while the song plays. Tracks without timed lyrics clear the panel's
    lyrics. Requires the `rest_command.room_companion_lrclib` snippet from
    docs/lyrics.md.
  domain: automation
  source_url: https://github.com/fixtse/OpenNextion-Room-Companion/blob/main/blueprints/automation/room_companion_lyrics.yaml
  input:
    media_player:
      name: Media player
      description: The player shown on the panel, for example your Spotify player.
      selector:
        entity:
          filter:
            - domain: media_player
    panels:
      name: Room Companion panels
      description: The panels that show this player's lyrics.
      selector:
        device:
          multiple: true
          filter:
            - integration: esphome

mode: restart
max_exceeded: silent

trigger_variables:
  player: !input media_player

triggers:
  - trigger: state
    entity_id: !input media_player
    attribute: media_title
  # Re-send after Home Assistant restarts (the panel may have restarted too).
  - trigger: homeassistant
    event: start

variables:
  panel_devices: !input panels
  # ESPHome names a device's actions after its node name, which Home Assistant
  # shows as the device name (e.g. "ONX3248G035 dbbc54" → esphome.onx3248g035_dbbc54_set_lyrics).
  # Renaming the device in Home Assistant does not change it.
  panel_actions: >-
    {% set ns = namespace(out=[]) %}{% for d in ([panel_devices] if panel_devices is string else panel_devices) %}{% set n = device_attr(d, 'name') %}{% if n %}{% set ns.out = ns.out + ['esphome.' ~ (n | slugify) ~ '_set_lyrics'] %}{% endif %}{% endfor %}{{ ns.out }}
  title: "{{ state_attr(player, 'media_title') or '' }}"
  artist: "{{ state_attr(player, 'media_artist') or '' }}"
  album: "{{ state_attr(player, 'media_album_name') or '' }}"
  duration: "{{ (state_attr(player, 'media_duration') or 0) | round(0) | int }}"

actions:
  - if:
      - condition: template
        value_template: "{{ title == '' or artist == '' or states(player) in ['off', 'idle', 'standby', 'unavailable'] }}"
    then:
      - repeat:
          for_each: "{{ panel_actions }}"
          sequence:
            - action: "{{ repeat.item }}"
              data: { entity_id: "{{ player }}", title: "", lrc: "" }
              continue_on_error: true
      - stop: Nothing playing
  # One request per track (LRCLIB asks clients not to send parallel requests).
  - action: rest_command.room_companion_lrclib
    data:
      path: >-
        get?track_name={{ title | urlencode }}&artist_name={{ artist | urlencode }}{% if album %}&album_name={{ album | urlencode }}{% endif %}{% if duration > 0 %}&duration={{ duration }}{% endif %}
    response_variable: found
    continue_on_error: true
  - variables:
      lrc: >-
        {% if found is defined and found.status == 200 and found.content is mapping %}{{ found.content.syncedLyrics or '' }}{% endif %}
  # The track may have changed while waiting; `mode: restart` usually catches it.
  - condition: template
    value_template: "{{ state_attr(player, 'media_title') == title }}"
  - repeat:
      for_each: "{{ panel_actions }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            entity_id: "{{ player }}"
            title: "{{ title }}"
            lrc: "{{ lrc }}"
          continue_on_error: true
