spi:
  id: bus_spi
  clk_pin: GPIO5
  mosi_pin: GPIO1

output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO6
    frequency: 10000Hz

light:
  - platform: monochromatic
    id: lcd_backlight
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    flash_transition_length: 0s
    internal: true

packages:
  fonts: !include fonts.yaml

display:
  - platform: ili9xxx
    id: lcd_display
    model: GC9A01A
    spi_id: bus_spi
    data_rate: ${lcd_spi_data_rate}
    color_order: BGR
    dc_pin: GPIO3
    cs_pin: GPIO2
    reset_pin: GPIO8
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false

lvgl:
  id: lvgl_ui
  displays:
    - lcd_display
  buffer_size: 100%
  default_font: fonts_MiSans_Medium_14
  log_level: WARN
