# Knob hardware: buffered button and rotary encoder. Behaviour is shared with
# the touch panels through input_actions.yaml.
packages:
  input_actions: !include input_actions.yaml

binary_sensor:
  - platform: onx_button
    id: key_btn
    internal: true
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - script.execute: onx_input_press

    on_release:
      then:
        - script.execute: onx_input_release

  - platform: gpio
    id: boot_btn
    internal: true
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_off: 5ms
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "BOOT press"
        - lambda: |-
            id(ui_presenter)->notify_user_activity();

sensor:
  - platform: rotary_encoder
    id: knob_enc
    internal: true
    pin_a:
      number: GPIO48
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO47
      mode:
        input: true
        pullup: true
    resolution: ${encoder_resolution}
    on_clockwise:
      then:
        - script.execute: onx_input_cw
    on_anticlockwise:
      then:
        - script.execute: onx_input_ccw

script:
  - id: onx_input_apply_sensitivity
    then:
      - sensor.rotary_encoder.set_value:
          id: knob_enc
          value: !lambda |-
            return id(normal_knob_applied_value);
