esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.2
  project:
    name: fixtse.room_companion
    version: ${firmware_version}
  # These are the ORIGINAL knob domain modules, shared without copying.
  includes:
    - ../../onx_control_state.h
    - ../../onx_config_rules.h
    - ../../onx_light_state.h
    - ../../onx_notification.h
    - ../../onx_memory.h
    - ../../onx_playlist.h
    - ../../onx_media_state.h
  on_boot:
    priority: -100
    then:
      - speaker.volume_set:
          id: panel_speaker
          volume: 35%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  # CH340 USB-to-UART uses GPIO43/44; GPIO19/20 belong to the PDM mic.
  hardware_uart: UART0
  baud_rate: 115200
  level: INFO

api:
  id: native_api
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

time:
  - platform: homeassistant
    id: home_time
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - lvgl.label.update:
              id: clock_label
              text: !lambda |-
                auto now = id(home_time).now();
                return now.is_valid() ? now.strftime("%H:%M") : "--:--";
