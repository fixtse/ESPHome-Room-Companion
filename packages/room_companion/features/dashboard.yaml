# Optional Home Assistant dashboard, rendered by a Remote WebView server and
# streamed as JPEG tiles (vendored strange-v/RemoteWebViewClient with a display
# handoff). Open it from a "[Local] Dashboard" control in the carousel or the
# Dashboard switch; swipe from the left edge to return.
substitutions:
  dashboard_notice_seconds: "8"
  default_dashboard_scale: "1"

external_components:
  - source:
      type: local
      path: ../../../my_components
    components:
      - remote_webview
      - room_companion

# JPEGDEC comes from ESPHome's runtime_image library (2026.11+); a separate
# IDF copy would shadow its newer API.

remote_webview:
  id: dashboard_stream
  display_id: lcd_display
  touchscreen_id: panel_touch
  tile_size: 32
  full_frame_tile_count: 1
  full_frame_area_threshold: 0.5
  full_frame_every: 50
  every_nth_frame: 1
  # Pacing floor for small updates. Frame acknowledgements also let the
  # server account for frames that take longer to decode and send to the LCD.
  min_frame_interval: ${stream_min_frame_interval}
  stats_interval: 5s
  jpeg_quality: 80
  max_bytes_per_msg: 61440
  current_url_sensor:
    name: Dashboard page
    entity_category: diagnostic

room_companion:
  id: room_panel
  lvgl_id: lvgl_ui
  stream_id: dashboard_stream
  touchscreen_id: panel_touch
  dashboard_switch: dashboard_open_switch
  default_server: ${default_dashboard_server}
  default_url: ${default_dashboard_url}
  default_scale: ${default_dashboard_scale}
  on_message:
    - lambda: |-
        const auto item = onx_notification::center.add("Dashboard", message, ${dashboard_notice_seconds}, "", millis());
        if (transient && item) id(dismiss_dashboard_notice).execute(item);

script:
  - id: dismiss_dashboard_notice
    mode: restart
    parameters:
      item: uint32_t
    then:
      - delay: ${dashboard_notice_seconds}s
      - lambda: 'onx_notification::center.dismiss(item);'

switch:
  - platform: template
    id: dashboard_open_switch
    name: Streamed page
    icon: mdi:monitor-dashboard
    # State is published by room_panel (corner hold closes it too).
    turn_on_action:
      - lambda: 'id(room_panel)->open_dashboard();'
    turn_off_action:
      - lambda: 'id(room_panel)->close_dashboard();'
