lvgl:
  id: room_ui
  displays: panel_display
  touchscreens: panel_touch
  buffer_size: 12%
  color_depth: 16
  bg_color: 0x101820
  text_color: 0xEDF2F4
  text_font: montserrat_16
  theme:
    button:
      bg_color: 0x263A49
      text_color: 0xEDF2F4
      radius: 10
      border_width: 0
      min_height: 44
    label:
      text_color: 0xEDF2F4
  top_layer:
    widgets:
      - label:
          text: ${room_name}
          text_font: ${title_font}
          align: TOP_LEFT
          x: 12
          y: 10
      - obj:
          align: BOTTOM_MID
          width: 100%
          height: 48
          pad_all: 2
          bg_color: 0x101820
          border_width: 0
          radius: 0
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_EVENLY
          widgets:
            - button:
                width: 24%
                height: 44
                on_click:
                  - lvgl.page.show: room_page
                widgets:
                  - label:
                      text: Room
                      text_font: montserrat_12
                      align: CENTER
            - button:
                width: 24%
                height: 44
                on_click:
                  - lvgl.page.show: music_page
                widgets:
                  - label:
                      text: Music
                      text_font: montserrat_12
                      align: CENTER
            - button:
                width: 24%
                height: 44
                on_click:
                  - lvgl.page.show: assist_page
                widgets:
                  - label:
                      text: Assist
                      text_font: montserrat_12
                      align: CENTER
            - button:
                width: 24%
                height: 44
                on_click:
                  - lvgl.page.show: glance_page
                  - script.execute: refresh_glance
                widgets:
                  - label:
                      text: Today
                      text_font: montserrat_12
                      align: CENTER
  pages:
    - id: room_page
      bg_color: 0x101820
      pad_top: 44
      pad_bottom: 54
      pad_left: 12
      pad_right: 12
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_cross: CENTER
      widgets:
        - label:
            id: clock_label
            text: "--:--"
            text_font: montserrat_36
        - label:
            id: connection_label
            text: Connect Home Assistant
            text_font: montserrat_12
        - label:
            id: temperature_label
            text: Temperature unavailable
        - label:
            id: light_state_label
            text: Light unavailable
        - button:
            width: 100%
            on_click:
              - script.execute: toggle_room_light
            widgets:
              - label:
                  text: Toggle light
                  align: CENTER
        - button:
            width: 100%
            on_click:
              - script.execute: activate_room_scene
            widgets:
              - label:
                  text: Relax scene
                  align: CENTER
    - id: music_page
      bg_color: 0x101820
      pad_top: 48
      pad_bottom: 54
      pad_left: 12
      pad_right: 12
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_cross: CENTER
      widgets:
        - label:
            id: media_title_label
            text: Nothing playing
            width: 100%
            long_mode: WRAP
            text_font: ${title_font}
        - label:
            id: media_artist_label
            text: Select your media player
            width: 100%
            long_mode: WRAP
        - button:
            width: 100%
            on_click:
              - homeassistant.action:
                  action: media_player.media_play_pause
                  data:
                    entity_id: ${media_entity}
            widgets:
              - label:
                  text: Play / Pause
                  align: CENTER
        - button:
            width: 100%
            on_click:
              - homeassistant.action:
                  action: media_player.media_next_track
                  data:
                    entity_id: ${media_entity}
            widgets:
              - label:
                  text: Next track
                  align: CENTER
        - slider:
            id: media_volume_slider
            width: 90%
            min_value: 0
            max_value: 100
            on_release:
              - homeassistant.action:
                  action: media_player.volume_set
                  data:
                    entity_id: ${media_entity}
                    volume_level: !lambda 'return x / 100.0f;'
        - label:
            id: media_volume_label
            text: "Volume: --"
    - id: assist_page
      bg_color: 0x101820
      pad_top: 48
      pad_bottom: 54
      pad_left: 12
      pad_right: 12
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_cross: CENTER
      widgets:
        - label:
            id: assist_status_label
            text: Connect Assist in Home Assistant
            width: 100%
            long_mode: WRAP
        - button:
            width: 100%
            on_click:
              - script.execute: toggle_assist
            widgets:
              - label:
                  text: Talk / Cancel
                  align: CENTER
        - label:
            id: transcript_label
            text: Tap Talk to ask your home
            width: 100%
            long_mode: WRAP
        - label:
            id: response_label
            text: ""
            width: 100%
            long_mode: WRAP
    - id: glance_page
      bg_color: 0x101820
      pad_top: 44
      pad_bottom: 54
      pad_left: 12
      pad_right: 12
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_cross: CENTER
      widgets:
        - label:
            id: glance_status_label
            text: Set up the optional renderer
            text_font: montserrat_12
            width: 100%
            long_mode: WRAP
        - image:
            id: glance_widget
            src: glance_image
        - button:
            width: 100%
            on_click:
              - script.execute: refresh_glance
            widgets:
              - label:
                  text: Refresh
                  align: CENTER
    - id: notification_page
      bg_color: 0x101820
      pad_top: 48
      pad_bottom: 54
      pad_left: 12
      pad_right: 12
      layout:
        type: FLEX
        flex_flow: COLUMN
      widgets:
        - label:
            id: notification_title
            text: Reminder
            text_font: ${title_font}
            width: 100%
            long_mode: WRAP
        - label:
            id: notification_body
            text: ""
            width: 100%
            long_mode: WRAP
        - button:
            width: 100%
            on_click:
              - script.execute: dismiss_notification
            widgets:
              - label:
                  text: Dismiss
                  align: CENTER
