# Notification centre for the touch panels (onx_notification_ui.h). The
# show_message / dismiss_message actions feed it instead of a round
# full-screen popup: a bell on the main carousel shows unread notifications,
# a banner announces new ones, and each can be opened and dismissed.
esphome:
  includes:
    - ../../../onx_notification_ui.h
  on_boot:
    # After the base boot handler (-100) has built its pages.
    - priority: -200
      then:
        - lambda: |-
            onx_notification_ui::Fonts fonts;
            fonts.title = id(fonts_MiSans_Bold_16)->get_lv_font();
            fonts.body = id(fonts_MiSans_Medium_14)->get_lv_font();
            fonts.small = id(fonts_MiSans_Medium_12)->get_lv_font();
            fonts.icon = id(fonts_MiSans_Medium_20)->get_lv_font();
            fonts.symbol = &lv_font_montserrat_28;
            onx_notification_ui::bell_image = id(panel_bell_icon)->get_lv_image_dsc();
            onx_notification_ui::Hooks hooks;
            hooks.load_image = [](const std::string &url) {
              id(entity_icon_downloader)->set_artwork_busy(true);
              id(center_image)->set_url(url);
              id(center_image)->update();
            };
            hooks.release_image = []() {
              lv_image_cache_drop(id(center_image)->get_lv_image_dsc());
              lv_image_header_cache_drop(id(center_image)->get_lv_image_dsc());
              id(center_image)->release();
              id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            };
            hooks.activity = []() { id(ui_presenter)->notify_user_activity(); };
            // Timer chip opens the shared timer screen (features/assist.yaml).
            onx_notification_ui::on_timer_chip = []() {
              if (id(touch_input)->suppress_click()) return;
              id(timer_show).execute();
            };
            onx_notification_ui::init(onx_panel_ui::width, onx_panel_ui::height, fonts, hooks);

image:
  # Bell on the main carousel and the idle clock (Material Design Icons).
  - platform: file
    file: "../../../assets/panel/bell-outline.svg"
    id: panel_bell_icon
    resize: ${ (20 * (ui_scale | float)) | round | int }x${ (20 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: online_image
    id: center_image
    url: http://homeassistant.local:8123/
    format: AUTO
    type: RGB565
    resize: ${ (44 * (ui_scale | float)) | round | int }x${ (44 * (ui_scale | float)) | round | int }
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            onx_notification_ui::image_ready(id(center_image)->get_lv_image_dsc());
    on_error:
      then:
        - lambda: |-
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            onx_notification_ui::image_failed();

interval:
  - interval: 500ms
    then:
      - lambda: |-
          static uint32_t seen = 0;
          auto &center = onx_notification::center;
          // A new notification wakes the panel (low-power sleep, standby, screen off).
          if (center.next_id != seen) {
            const bool arrived = seen != 0 || center.next_id > 1;
            seen = center.next_id;
            if (arrived && !center.items.empty()) {
              if (onx_power::sleeping && id(low_power_sleep).state) id(low_power_sleep).turn_off();
              if (id(screen_off_state)) id(ha_screen_off).turn_off();
              id(ui_presenter)->notify_user_activity();
            }
          }
          onx_notification_ui::tick();
          // The stream yields while the centre (or its banner) is on screen.
          id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_NOTICE, onx_notification_ui::owns_screen());
