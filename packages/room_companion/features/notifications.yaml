# Notification centre for the touch panels (onx_notification_ui.h). The
# show_message / dismiss_message actions feed it instead of a round
# full-screen popup: a bell on the main carousel shows unread notifications,
# a banner announces new ones, and each can be opened and dismissed.
esphome:
  includes:
    - ../../../onx_notification_ui.h
  on_boot:
    # After the base boot handler (-100) has built its pages.
    - priority: -200
      then:
        - lambda: |-
            onx_notification_ui::Fonts fonts;
            fonts.title = id(fonts_MiSans_Bold_16)->get_lv_font();
            fonts.body = id(fonts_MiSans_Medium_14)->get_lv_font();
            fonts.small = id(fonts_MiSans_Medium_12)->get_lv_font();
            fonts.icon = id(fonts_MiSans_Medium_20)->get_lv_font();
            fonts.symbol = &lv_font_${symbol_font};
            onx_notification_ui::bell_image = id(panel_bell_icon)->get_lv_image_dsc();
            onx_notification_ui::clock_tile_image = id(panel_standby_clock_icon)->get_lv_image_dsc();
            onx_notification_ui::preset_tile_image = id(panel_preset_layers_icon)->get_lv_image_dsc();
            onx_notification_ui::controls_blocked = []() { return id(touch_input)->suppress_click(); };
            // The centre follows a swipe up and decides on release.
            id(touch_input)->set_pull_up_drag(
                [](int dy) { onx_notification_ui::drag_panel(dy); },
                [](int dy, uint32_t ms) { return onx_notification_ui::release_panel_drag(dy, ms); });
            id(touch_input)->set_pull_down_drag(
                [](int dy) { onx_notification_ui::drag_open(dy); },
                [](int dy, uint32_t ms) { return onx_notification_ui::release_open(dy, ms); });
            id(touch_input)->set_pull_up_zone([](int x, int y) { return onx_notification_ui::close_zone(x, y); });
            onx_notification_ui::Hooks hooks;
            hooks.load_image = [](const std::string &url) {
              id(entity_icon_downloader)->set_artwork_busy(true);
              id(center_image)->set_url(url);
              id(center_image)->update();
            };
            hooks.release_image = []() {
              lv_image_cache_drop(id(center_image)->get_lv_image_dsc());
              lv_image_header_cache_drop(id(center_image)->get_lv_image_dsc());
              id(center_image)->release();
              id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            };
            hooks.activity = []() { id(ui_presenter)->notify_user_activity(); };
            // Orientation from the centre's quick toggles: saved like the web
            // setting; panel.yaml restarts once it differs from the running one.
            hooks.orientation = []() { return onx_display_settings::orientation.turns; };
            hooks.set_orientation = [](uint8_t turns) {
              if (turns > 3) return false;
              auto next = onx_display_settings::orientation;
              next.turns = turns;
              if (!onx_entity_config::orientation_preference.save(&next) || !esphome::global_preferences->sync()) return false;
              onx_display_settings::orientation = next;
              return true;
            };
            onx_notification_ui::toggle_standby_timeout = []() {
              if (!id(touch_input)->suppress_click()) id(panel_standby_timeout_enabled).toggle();
            };
            // Timer chip opens the shared timer screen (features/assist.yaml).
            onx_notification_ui::on_timer_chip = []() {
              if (id(touch_input)->suppress_click()) return;
              id(timer_show).execute();
            };
            onx_notification_ui::init(onx_panel_ui::width, onx_panel_ui::height, fonts, hooks);
            id(dashboard_stream)->enable_frame_snapshot();
            id(room_panel)->set_backdrop_changed(onx_notification_ui::set_dashboard_backdrop);

switch:
  - platform: template
    id: panel_standby_timeout_enabled
    name: "Standby clock timer"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: |-
          id(ui_presenter)->set_standby_timeout_enabled(x);
          onx_notification_ui::standby_timeout_enabled = x;
          onx_notification_ui::update_standby_button();

image:
  - platform: file
    file: "../../../assets/panel/screen-sleep.svg"
    id: panel_standby_clock_icon
    resize: ${ (24 * (ui_scale | float)) | round | int }x${ (24 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "../../../assets/panel/preset-layers.svg"
    id: panel_preset_layers_icon
    resize: ${ (24 * (ui_scale | float)) | round | int }x${ (24 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  # Bell on the main carousel and the idle clock (Material Design Icons).
  - platform: file
    file: "../../../assets/panel/bell-outline.svg"
    id: panel_bell_icon
    resize: ${ (20 * (ui_scale | float)) | round | int }x${ (20 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: online_image
    id: center_image
    url: http://homeassistant.local:8123/
    format: AUTO
    type: RGB565
    resize: ${ (64 * (ui_scale | float)) | round | int }x${ (64 * (ui_scale | float)) | round | int }
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            onx_notification_ui::image_ready(id(center_image)->get_lv_image_dsc());
    on_error:
      then:
        - lambda: |-
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            onx_notification_ui::image_failed();

interval:
  - interval: 500ms
    then:
      - lambda: |-
          static uint32_t seen = 0;
          auto &center = onx_notification::center;
          // A new notification wakes the panel (low-power sleep, standby, screen off).
          if (center.next_id != seen) {
            const bool arrived = seen != 0 || center.next_id > 1;
            seen = center.next_id;
            if (arrived && !center.items.empty()) {
              if (onx_power::sleeping && id(low_power_sleep).state) id(low_power_sleep).turn_off();
              if (id(screen_off_state)) id(ha_screen_off).turn_off();
              // Photo idle screens stay up: the banner and the bell show over the photo.
              const auto idle = id(panel_idle_screen).active_index().value_or(0);
              const bool photos = idle == onx_panel_ui::IDLE_IMMICHFRAME &&
                                  id(ui_presenter)->is_standby_active() && !onx_panel_ui::hidden(onx_panel_ui::slide_layer);
              if (!photos) id(ui_presenter)->notify_user_activity();
            }
          }
          onx_notification_ui::tick();
          // The stream yields while the centre (or its banner) is on screen.
          id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_NOTICE, onx_notification_ui::owns_screen());
