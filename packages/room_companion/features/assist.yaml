# Home Assistant Assist satellite. Start it from a "[Local] Assist" control in
# the carousel, the BOOT button, the Talk button entity, or the optional wake
# word (examples/room-companion/wake-word.yaml). A full-screen overlay shows
# what was heard and the reply; it takes the screen from the dashboard stream.
globals:
  - id: assist_ready
    type: bool
    initial_value: 'false'

switch:
  - platform: template
    id: microphone_muted
    name: Microphone muted
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - voice_assistant.stop:

button:
  - platform: template
    name: Talk
    icon: mdi:account-voice
    on_press:
      - script.execute: toggle_assist

binary_sensor:
  - id: !extend boot_btn
    on_click:
      max_length: 1s
      then:
        - if:
            condition:
              wifi.connected:
            then:
              - script.execute: toggle_assist

# Exposes the panel speaker and reply volume to Home Assistant.
media_player:
  - platform: speaker
    id: panel_media_player
    name: Speaker
    volume_initial: 60%
    announcement_pipeline:
      speaker: panel_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    on_announcement:
      - script.stop: assist_finished
      - lvgl.label.update:
          id: assist_status
          text: Speaking...
    on_idle:
      - script.execute: assist_finished

voice_assistant:
  id: assist
  microphone:
    microphone: panel_microphone
    channels: 0
    gain_factor: 2
  media_player: panel_media_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 15dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - globals.set:
        id: assist_ready
        value: 'true'
  on_client_disconnected:
    - globals.set:
        id: assist_ready
        value: 'false'
    - voice_assistant.stop:
    - script.execute:
        id: assist_show
        status: Assist disconnected
    - script.execute: assist_finished
  on_listening:
    - script.stop: assist_finished
    - script.execute:
        id: assist_show
        status: Listening...
  on_stt_end:
    - lvgl.label.update:
        id: assist_transcript
        text: !lambda 'return onx_notification::plain_text(x, 384);'
    - lvgl.label.update:
        id: assist_status
        text: Thinking...
  on_tts_start:
    - lvgl.label.update:
        id: assist_response
        text: !lambda 'return onx_notification::plain_text(x, 512);'
  on_idle:
    - script.execute: assist_finished
  on_error:
    - lvgl.label.update:
        id: assist_status
        text: !lambda 'return onx_notification::clipped(message, 128);'
    - script.execute: assist_finished

script:
  - id: toggle_assist
    then:
      - if:
          condition:
            or:
              - voice_assistant.is_running:
              - media_player.is_announcing: panel_media_player
          then:
            - voice_assistant.stop:
            - media_player.stop:
                id: panel_media_player
                announcement: true
          else:
            - if:
                condition:
                  lambda: 'return id(assist_ready) && !id(microphone_muted).state;'
                then:
                  - lvgl.label.update:
                      id: assist_transcript
                      text: ""
                  - lvgl.label.update:
                      id: assist_response
                      text: ""
                  - voice_assistant.start:
                else:
                  - script.execute:
                      id: assist_show
                      status: !lambda |-
                        return std::string(id(microphone_muted).state ? "Microphone muted"
                                           : "Select this panel as an Assist satellite in Home Assistant");
                  - script.execute: assist_finished

  # Shows the overlay, waking the panel and taking the screen from the stream.
  - id: assist_show
    parameters:
      status: string
    then:
      - lambda: |-
          if (onx_power::sleeping && id(low_power_sleep).state) id(low_power_sleep).turn_off();
          id(ui_presenter)->notify_user_activity();
          id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_ASSIST, true);
      - lvgl.label.update:
          id: assist_status
          text: !lambda 'return status;'
      - lvgl.widget.show: assist_overlay

  # Leave the reply on screen briefly, then return to the previous view.
  - id: assist_finished
    mode: restart
    then:
      - delay: 6s
      - if:
          condition:
            not:
              or:
                - voice_assistant.is_running:
                - media_player.is_announcing: panel_media_player
          then:
            - lvgl.widget.hide: assist_overlay
            - lambda: 'id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_ASSIST, false);'

lvgl:
  top_layer:
    widgets:
      - obj:
          id: assist_overlay
          hidden: true
          x: 0
          y: 0
          width: ${display_width}
          height: ${display_height}
          radius: 0
          bg_color: 0x101418
          bg_opa: COVER
          border_width: 0
          pad_all: ${ (16 * (ui_scale | float)) | round | int }
          scrollable: false
          layout:
            type: FLEX
            flex_flow: COLUMN
            flex_align_cross: CENTER
            pad_row: ${ (10 * (ui_scale | float)) | round | int }
          widgets:
            - label:
                text: "Assist"
                text_font: fonts_MiSans_Bold_14
                text_color: 0x62B0FF
            - obj:
                width: ${ (72 * (ui_scale | float)) | round | int }
                height: ${ (72 * (ui_scale | float)) | round | int }
                radius: ${ (36 * (ui_scale | float)) | round | int }
                bg_color: 0x1F6FEB
                border_width: 0
                scrollable: false
                clickable: false
                widgets:
                  - label:
                      align: center
                      text: "🎤"
                      text_font: fonts_MiSans_Medium_32
                      text_color: 0xFFFFFF
            - label:
                id: assist_status
                text: ""
                width: 100%
                long_mode: WRAP
                text_align: CENTER
                text_font: fonts_MiSans_Medium_18
                text_color: 0xFFFFFF
            - label:
                id: assist_transcript
                text: ""
                width: 100%
                long_mode: WRAP
                text_align: CENTER
                text_font: fonts_MiSans_Medium_14
                text_color: 0xB8B8B8
            - label:
                id: assist_response
                text: ""
                width: 100%
                flex_grow: 1
                long_mode: WRAP
                text_align: CENTER
                text_font: fonts_MiSans_Medium_16
                text_color: 0xFFFFFF
            - button:
                width: 60%
                height: ${ (40 * (ui_scale | float)) | round | int }
                radius: ${ (20 * (ui_scale | float)) | round | int }
                bg_color: 0x2A2F35
                on_click:
                  - if:
                      condition:
                        or:
                          - voice_assistant.is_running:
                          - media_player.is_announcing: panel_media_player
                      then:
                        - voice_assistant.stop:
                        - media_player.stop:
                            id: panel_media_player
                            announcement: true
                  - script.stop: assist_finished
                  - lvgl.widget.hide: assist_overlay
                  - lambda: 'id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_ASSIST, false);'
                widgets:
                  - label:
                      align: center
                      text: "Close"
                      text_font: fonts_MiSans_Medium_16
                      text_color: 0xFFFFFF
