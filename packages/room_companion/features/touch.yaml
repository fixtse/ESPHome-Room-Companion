# Touch drives the knob's input scripts (packages/base/input_actions.yaml).
external_components:
  - source:
      type: local
      path: ../../../my_components
    components:
      - onx_touch_input

binary_sensor:
  # Virtual knob button: no pin, pressed/released by onx_touch_input. The knob's
  # press/release logic and hold timing run unchanged.
  - platform: onx_button
    id: key_btn
    internal: true
    on_press:
      then:
        - script.execute: onx_input_press
    on_release:
      then:
        - script.execute: onx_input_release

onx_touch_input:
  id: touch_input
  touchscreen_id: panel_touch
  button_id: key_btn
  width: ${display_width}
  # Everything below the scaled 240x240 knob layout is the icon strip.
  strip_top: ${ (display_height | int) - 44 }
  strip_spacing: ${strip_spacing}
  step: ${ (22 * (ui_scale | float)) | round | int }
  passthrough:
    # Top-right corner: notification bell (LVGL).
    - x0: ${ (display_width | int) - 56 }
      y0: 0
      x1: ${display_width}
      y1: 56
    # Top-left corner: dashboard button (LVGL, shown when a server is set).
    - x0: 0
      y0: 0
      x1: 56
      y1: 56
  enabled: |-
    return id(room_panel)->knob_ui_has_touch();
  page_swipe: |-
    return !id(normal_device_detail_active) && id(room_panel)->knob_ui_has_touch();
  back_enabled: |-
    return id(normal_device_detail_active) || id(room_panel)->dashboard_open() || !id(room_panel)->knob_ui_has_touch();
  native_touch: |-
    return !id(room_panel)->knob_ui_has_touch() ||
           (id(normal_device_detail_active) && id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS);
  # Media closes with either horizontal swipe; other details use edge-back.
  edge_back: |-
    const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
    return id(normal_device_detail_active) && entity.rfind("media_player.", 0) != 0 && id(room_panel)->knob_ui_has_touch();
  pull_down_enabled: |-
    return id(room_panel)->knob_ui_has_touch() && !onx_notification_ui::owns_screen();
  on_pull_down:
    - lambda: |-
        id(ui_presenter)->notify_user_activity();
        onx_notification_ui::open_panel();
  on_back:
    - script.execute: panel_back
  on_turn:
    - lambda: |-
        int detents = id(normal_knob_applied_value);
        if (detents != 1 && detents != 2 && detents != 4) detents = 1;
        for (int i = 0; i < detents; ++i) {
          if (direction > 0) id(onx_input_cw).execute();
          else id(onx_input_ccw).execute();
        }
  on_strip_tap:
    # Each carousel position needs the configured number of detents.
    - lambda: |-
        int detents = id(normal_knob_applied_value);
        if (detents != 1 && detents != 2 && detents != 4) detents = 1;
        for (int i = 0; i < std::abs(offset) * detents; ++i) {
          if (offset > 0) id(onx_input_cw).execute();
          else id(onx_input_ccw).execute();
        }

script:
  - id: panel_back
    then:
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
          if (onx_notification_ui::detail_id != 0) { onx_notification_ui::close_detail(); return; }
          if (onx_notification_ui::panel_open) { onx_notification_ui::close_panel(); return; }
          if (!lv_obj_has_flag(id(assist_overlay), LV_OBJ_FLAG_HIDDEN)) {
            id(assist).request_stop();
            auto call = id(panel_media_player).make_call();
            call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_STOP).set_announcement(true).perform();
            id(assist_finished).stop();
            lv_obj_add_flag(id(assist_overlay), LV_OBJ_FLAG_HIDDEN);
            id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_ASSIST, false);
            return;
          }
          if (id(room_panel)->dashboard_open()) { id(room_panel)->close_dashboard(); return; }
          if (!id(normal_device_detail_active)) return;
          switch (id(normal_device_detail_kind)) {
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI: id(exit_normal_settings_wifi_detail).execute(); break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS: id(exit_normal_settings_brightness_detail).execute(); break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_KNOB: id(exit_normal_settings_knob_detail).execute(); break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_CONNECTION: id(exit_normal_settings_connection).execute(); break;
            default: id(exit_normal_switch_detail).execute(); break;
          }
  # Sensitivity is applied by the detent accumulator in onx_input_cw/ccw.
  - id: onx_input_apply_sensitivity
    then:
      - logger.log:
          level: DEBUG
          format: "Touch swipe sensitivity follows the dial setting"
