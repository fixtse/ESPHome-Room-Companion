# Touch drives the shared input scripts (packages/base/input_actions.yaml).
external_components:
  - source:
      type: local
      path: ../../../my_components
    components:
      - onx_touch_input

binary_sensor:
  # Virtual button: no pin, pressed/released by onx_touch_input. The shared
  # press/release logic and hold timing run unchanged.
  - platform: onx_button
    id: key_btn
    internal: true
    on_press:
      then:
        - script.execute: onx_input_press
    on_release:
      then:
        - script.execute: onx_input_release

onx_touch_input:
  id: touch_input
  touchscreen_id: panel_touch
  button_id: key_btn
  # Placeholders: panel_ui_setup sets the runtime geometry for the configured
  # orientation (landscape swaps width and height).
  width: ${display_width}
  strip_top: ${ (display_height | int) - 44 }
  strip_spacing: ${strip_spacing}
  step: ${ (22 * (ui_scale | float)) | round | int }
  # On-screen buttons (bell, media transport) are dynamic passthrough regions.
  enabled: |-
    return id(room_panel)->native_ui_has_touch();
  page_swipe: |-
    return !id(normal_device_detail_active) && id(room_panel)->native_ui_has_touch();
  back_enabled: |-
    return id(normal_device_detail_active) || id(room_panel)->dashboard_open() || !id(room_panel)->native_ui_has_touch();
  native_touch: |-
    return !id(room_panel)->native_ui_has_touch() ||
           (id(normal_device_detail_active) && id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS);
  # Media closes with either horizontal swipe; other details use edge-back.
  edge_back: |-
    const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
    return id(normal_device_detail_active) && entity.rfind("media_player.", 0) != 0 && id(room_panel)->native_ui_has_touch();
  pull_down_enabled: |-
    return id(room_panel)->native_ui_has_touch() && !onx_notification_ui::owns_screen();
  on_pull_down:
    - lambda: |-
        id(ui_presenter)->notify_user_activity();
        onx_notification_ui::open_panel();
  on_back:
    - script.execute: panel_back
  on_turn:
    - lambda: |-
        int detents = id(normal_input_applied_value);
        if (detents != 1 && detents != 2 && detents != 4) detents = 1;
        for (int i = 0; i < detents; ++i) {
          if (direction > 0) id(onx_input_cw).execute();
          else id(onx_input_ccw).execute();
        }
  on_strip_tap:
    # Each carousel position needs the configured number of detents.
    - lambda: |-
        int detents = id(normal_input_applied_value);
        if (detents != 1 && detents != 2 && detents != 4) detents = 1;
        for (int i = 0; i < std::abs(offset) * detents; ++i) {
          if (offset > 0) id(onx_input_cw).execute();
          else id(onx_input_ccw).execute();
        }

script:
  - id: panel_back
    then:
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
          if (onx_notification_ui::detail_id != 0) { onx_notification_ui::close_detail(); return; }
          if (onx_notification_ui::panel_open) { onx_notification_ui::close_panel(); return; }
          if (onx_panel_detail::timers.overlay) { id(timer_close).execute(); return; }
          if (!lv_obj_has_flag(id(assist_overlay), LV_OBJ_FLAG_HIDDEN)) { id(assist_stop).execute(); return; }
          if (id(room_panel)->dashboard_open()) { id(room_panel)->close_dashboard(); return; }
          if (!id(normal_device_detail_active)) return;
          // A timer popup returns to the control that was selected before it.
          if (onx_timer::popup.visible) {
            onx_timer::popup.visible = false;
            onx_timer::popup.dismissed = true;
            id(normal_device_selected_index) = onx_timer::popup.previous_index;
          }
          switch (id(normal_device_detail_kind)) {
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI: id(exit_normal_settings_wifi_detail).execute(); break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS: id(exit_normal_settings_brightness_detail).execute(); break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_INPUT: id(exit_normal_settings_input_detail).execute(); break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_CONNECTION: id(exit_normal_settings_connection).execute(); break;
            default: id(exit_normal_switch_detail).execute(); break;
          }
  # Sensitivity is applied by the detent accumulator in onx_input_cw/ccw.
  - id: onx_input_apply_sensitivity
    then:
      - logger.log:
          level: DEBUG
          format: "Touch swipe sensitivity follows the dial setting"
