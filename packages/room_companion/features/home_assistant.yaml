sensor:
  - platform: homeassistant
    id: room_temperature
    entity_id: ${temperature_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temperature_label
          text: !lambda |-
            if (!std::isfinite(x)) return std::string("Temperature unavailable");
            char text[32];
            snprintf(text, sizeof(text), "Temperature: %.1f", x);
            return std::string(text);

text_sensor:
  - platform: homeassistant
    id: room_light_state
    entity_id: ${light_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: light_state_label
          text: !lambda 'return "Light: " + onx_notification::clipped(x, 32);'
  - platform: homeassistant
    id: media_title
    entity_id: ${media_entity}
    attribute: media_title
    internal: true
    on_value:
      - lvgl.label.update:
          id: media_title_label
          text: !lambda 'return onx_notification::plain_text(x, 160);'
  - platform: homeassistant
    id: media_artist
    entity_id: ${media_entity}
    attribute: media_artist
    internal: true
    on_value:
      - lvgl.label.update:
          id: media_artist_label
          text: !lambda 'return onx_notification::plain_text(x, 96);'

  - platform: homeassistant
    id: media_volume_state
    entity_id: ${media_entity}
    attribute: volume_level
    internal: true
    on_value:
      - lvgl.label.update:
          id: media_volume_label
          text: !lambda 'return "Volume: " + onx_media::volume_percent(onx_control::number(x));'
      - if:
          condition:
            lambda: 'return std::isfinite(onx_control::number(x));'
          then:
            - lvgl.slider.update:
                id: media_volume_slider
                value: !lambda 'return onx_control::number(x) * 100.0f;'

script:
  - id: toggle_room_light
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: ${light_entity}
  - id: activate_room_scene
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: scene.turn_on
                data:
                  entity_id: ${scene_entity}
