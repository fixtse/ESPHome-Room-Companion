# Rectangular OpenNextion panel hardware, exposed under the IDs the shared
# application uses (lcd_display, lcd_backlight, lvgl_ui).
# Pin map verified against the official examples for both models.
# PCF8574 pin numbers here are ZERO-based (vendor examples use one-based enums).
external_components:
  - source:
      type: local
      path: ../../../my_components
    components: [onx_touch_bus]

onx_touch_bus:
  id: fast_touch_bus
  i2c_id: board_i2c

i2c:
  id: board_i2c
  sda: GPIO8
  scl: GPIO7
  frequency: 100kHz  # PCF8574 is rated for 100 kHz
  scan: true

pcf8574:
  - id: board_expander
    i2c_id: board_i2c
    address: 0x38

output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO6
    frequency: 10000Hz

light:
  - platform: monochromatic
    id: lcd_backlight
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    flash_transition_length: 0s
    internal: true

# The amplifier is NS4168, enabled by EXIO0, not an I2C audio codec.
# Keep it shut down until the I2S speaker has started its clocks. Leaving it
# enabled from cold boot amplifies undefined input until the first playback.
switch:
  - platform: gpio
    id: speaker_amplifier
    internal: true
    pin:
      pcf8574: board_expander
      number: 0
      mode: OUTPUT
    restore_mode: ALWAYS_OFF

# The panel's ili9xxx fork (orientation and panel-sleep commands).
display:
  - platform: ili9xxx
    id: lcd_display
    model: ${display_model}
    queued_spi:
      clk_pin: GPIO5
      mosi_pin: GPIO1
      cs_pin: GPIO2
      data_rate: ${lcd_spi_data_rate}
    color_order: BGR
    dc_pin: GPIO3
    reset_pin:
      pcf8574: board_expander
      number: 5
      mode: OUTPUT
    dimensions:
      width: ${display_width}
      height: ${display_height}
    invert_colors: ${display_invert_colors}
    update_interval: never
    auto_clear_enabled: false

# CST826 is supported by ESPHome's cst816 family driver. Polling avoids using
# an expander input as an interrupt (touch INT is EXIO4).
touchscreen:
  - platform: cst816
    id: panel_touch
    i2c_id: fast_touch_bus
    display: lcd_display
    address: 0x15
    update_interval: 12ms
    calibration:
      x_min: 0
      x_max: ${display_width}
      y_min: 0
      y_max: ${display_height}

# PDM RX must get I2S0 on ESP32-S3. Keep this bus FIRST; speaker uses I2S1.
i2s_audio:
  - id: microphone_bus
    i2s_lrclk_pin: GPIO19
  - id: speaker_bus
    i2s_bclk_pin: GPIO14
    i2s_lrclk_pin: GPIO16

microphone:
  - platform: i2s_audio
    id: panel_microphone
    i2s_audio_id: microphone_bus
    adc_type: external
    i2s_din_pin: GPIO20
    pdm: true
    sample_rate: 16000
    bits_per_sample: 32bit
    # Both microphones of the dual-mic board (4 cm apart) share the PDM line:
    # left = channel 0, right = channel 1. Assist and the wake word use the
    # right one (channel 1), as before; SoundSense reports both.
    channel: stereo
    correct_dc_offset: true

speaker:
  - platform: i2s_audio
    id: panel_speaker
    i2s_audio_id: speaker_bus
    dac_type: external
    i2s_dout_pin: GPIO15
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    i2s_comm_fmt: stand_msb
    buffer_duration: 100ms

# Gate the physical amplifier from the actual speaker state, covering Assist,
# media and timer sounds alike. Avoid I2C writes when the state is unchanged.
interval:
  - interval: 10ms
    then:
      - lambda: |-
          const bool playing = id(panel_speaker).is_running();
          if (id(speaker_amplifier).state != playing) {
            if (playing) id(speaker_amplifier).turn_on();
            else id(speaker_amplifier).turn_off();
          }

# BOOT: Improv BLE authorization during setup, Assist afterwards (assist.yaml).
binary_sensor:
  - platform: gpio
    id: boot_btn
    internal: true
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 5ms
