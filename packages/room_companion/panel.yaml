substitutions:
  # Private builds can override this with a full Bearer header from secrets.yaml.
  immichframe_authorization: ""
  # Internal RAM (total / largest contiguous block, bytes) that must be free
  # before Bluetooth may start; see the esp32_ble comment below.
  ble_min_free: "56000"
  ble_min_block: "36000"

# Panel layer: display/input integration and connectivity for these boards.
# Everything else comes from the shared packages.
logger:
  # CH340 USB-to-UART on GPIO43/44 carries logs and Improv Serial; GPIO19/20
  # (USB-Serial-JTAG) belong to the PDM microphone.
  hardware_uart: UART0
  baud_rate: 115200

# The base auxiliary UART would use GPIO43/44, which are the console here.
uart: !remove

# Public firmware uses an unencrypted API; provisioning stays in device NVS.
api:
  encryption: !remove
  # Optional synced lyrics, sent once per track by the Room Companion lyrics
  # blueprint (blueprints/automation/room_companion_lyrics.yaml).
  actions:
    - action: set_lyrics
      description: Synced LRC lyrics for a media player's current track; an empty lrc clears them.
      variables:
        entity_id: string
        title: string
        lrc: string
      then:
        - lambda: |-
            if (lrc.empty()) onx_lyrics::clear();
            else if (!onx_lyrics::set(entity_id, title, lrc)) ESP_LOGW("lyrics", "No timed lines for %s", title.c_str());
            else ESP_LOGI("lyrics", "%d lines for %s", onx_lyrics::count(), title.c_str());

lvgl:
  id: lvgl_ui
  # Referencing the symbol font compiles it in for the media control symbols.
  top_layer:
    widgets:
      - label:
          id: panel_symbol_font_ref
          hidden: true
          text_font: ${symbol_font}
          text: ""
      # ESPHome compiles only the LVGL widget types the YAML uses. The redesigned
      # screens create arcs in C++ (timers, rings), and no YAML arc remains.
      - arc:
          id: panel_arc_ref
          hidden: true
  displays:
    - lcd_display
  # Touch reaches LVGL only for overlays (notification centre); the base pages
  # are driven through onx_touch_input.
  touchscreens:
    - touchscreen_id: panel_touch
  resume_on_input: false
  byte_order: big_endian
  update_interval: 16ms
  # Keep partial-refresh mode, but let a carousel-sized invalidation fit in
  # one PSRAM buffer. A 12.5% internal-RAM buffer was measured on 2026-11-20:
  # LVGL time doubled (13.1 s vs 6.2 s per minute), frame times did not
  # improve and the wake-word audio ring buffer overflowed
  # (docs/room-companion/touch-latency.md).
  buffer_size: 100%
  default_font: fonts_MiSans_Medium_14
  log_level: WARN

# Larger idle clock digits, used when the chosen clock content leaves room.
font:
  - file: "../../fonts/MiSans-Bold.ttf"
    id: panel_clock_big_font
    size: ${ (88 * (font_scale | float)) | round | int }
    bpp: ${font_bpp}
    glyphs: "0123456789:-. "

select:
  - platform: template
    id: panel_idle_screen
    name: Idle screen
    icon: mdi:sleep
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Clock
      - Dashboard
      - ImmichFrame
    initial_option: Clock
  # How ImmichFrame fits each photo (the server draws it; see panel-ui.md).
  - platform: template
    id: panel_immichframe_fit
    name: ImmichFrame photo fit
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_value: true
    options:
      - Blurred background
      - Fill screen
      - Whole photo
    initial_option: Blurred background
  # The clock over photos: large (time, date, weather, media), small (a thinner
  # band) or photo only (the time in a corner pill).
  - platform: template
    id: panel_photo_overlay
    name: Clock on photos
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_value: true
    options:
      - Large clock
      - Small clock
      - Photo only
    initial_option: Large clock

switch:
  # Two photos side by side (or stacked) when one alone would not suit the screen.
  - platform: template
    id: panel_immichframe_split
    name: ImmichFrame photo pairs
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Photo details drawn by ImmichFrame in the top-left corner (at most three).
  - platform: template
    id: panel_immichframe_info_date
    name: ImmichFrame show date
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: panel_immichframe_info_location
    name: ImmichFrame show place
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: panel_immichframe_info_album
    name: ImmichFrame show album
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: panel_immichframe_info_people
    name: ImmichFrame show people
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: panel_immichframe_info_description
    name: ImmichFrame show description
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: panel_slideshow_fade
    name: Slideshow fade
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

text:
  - platform: template
    id: panel_immichframe_url
    name: ImmichFrame server
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    mode: text
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""

number:
  - platform: template
    id: panel_slideshow_seconds
    name: Slideshow interval
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    unit_of_measurement: s
    min_value: 5
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 20

# Bluetooth is not started at boot: with the saved configuration the internal RAM
# left after setup (about 45 KB with nine controls) is less than the Bluedroid
# stack needs, and its failure aborts the boot. It is only used for Improv Wi-Fi
# provisioning, so it starts when the panel has no saved network (after 10 s) or
# the network has been unavailable for 30 s, when memory allows (onx_ble_guard.h).
esp32_ble:
  enable_on_boot: false

interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              auto *wifi_component = wifi::global_wifi_component;
              static uint32_t warned = 0;
              if (wifi_component == nullptr || wifi_component->is_connected()) return false;
              if (esphome::esp32_ble::global_ble != nullptr && esphome::esp32_ble::global_ble->is_active()) {
                onx_ble_guard::done();
                return false;
              }
              const bool saved = wifi_component->has_sta() && !wifi_component->get_sta().get_ssid().empty();
              // A provisioned panel never automatically reopens Bluetooth,
              // including slow Wi-Fi reconnects after a reboot. USB Improv and
              // the setup AP remain available for network recovery.
              if (saved || millis() < 10000) return false;
              if (onx_ble_guard::blocked()) return false;
              if (!onx_ble_guard::enough_memory(${ble_min_free}, ${ble_min_block})) {
                if (millis() - warned > 60000) {
                  warned = millis();
                  ESP_LOGW("ble", "Not starting Bluetooth: internal RAM %u B free, largest block %u B",
                           (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                           (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));
                }
                return false;
              }
              onx_ble_guard::begin();
              return true;
          then:
            - ble.enable:
  # Rectangular-panel UI (onx_panel_ui.h): bell, media layout, idle screen.
  # Runs every 100 ms, or on the next 16 ms check after a tap requested it.
  - interval: 16ms
    then:
      - lambda: |-
          static uint32_t last_pass = 0;
          if (!onx_panel_ui::render_requested && millis() - last_pass < 100) return;
          const bool requested = onx_panel_ui::render_requested;
          onx_panel_ui::render_requested = false;
          last_pass = millis();
          if (onx_panel_pages::layer == nullptr) return;
          onx_notification_ui::cover_root = onx_panel_pages::layer;  // Hidden while the centre covers it.
          // Fully covered native content keeps its last frame without rebuilding.
          if (onx_notification_ui::panel_open || onx_notification_ui::detail_id != 0) return;
          // The panel's own Assist timers (features/assist.yaml) cover the
          // screen, except while Assist itself is on screen.
          if (onx_panel_detail::timers.overlay && lv_obj_has_flag(id(assist_overlay), LV_OBJ_FLAG_HIDDEN)) {
            onx_notification_ui::set_bell_visible(false);
            // The shared Wi-Fi/HA status icons (top layer) belong to the carousel and idle clock.
            for (auto *icon : {id(normal_device_wifi_online_widget), id(normal_device_wifi_offline_widget),
                               id(normal_device_homeassistant_online_widget), id(normal_device_homeassistant_offline_widget)})
              lv_obj_add_flag(icon, LV_OBJ_FLAG_HIDDEN);
            onx_panel_pages::show_timers(onx_panel_ui::width, onx_panel_ui::height);
            return;
          }
          // Native rectangular pages reuse the existing HA state and actions.
          const bool detail = id(normal_device_detail_active);
          if (!detail && !onx_panel_pages::parent_entity.empty()) {
            const int config = onx_panel_pages::configured(onx_panel_pages::parent_entity);
            onx_panel_pages::parent_entity.clear();
            if (config >= 0) {
              id(normal_device_selected_index) = custom_logic::normal_ui_slot_for_device_config_slot(config);
              id(show_normal_device_entry_page).execute(0);
            }
          }
          const bool entity_detail = detail && (id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_AUTOMATION ||
              id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_LIGHT || id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_SWITCH ||
              id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_PLUG || id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_CURTAIN);
          const bool standby = id(ui_presenter)->is_standby_active();
          static bool was_standby = false;
          const bool entered = standby && !was_standby;
          const bool exited = !standby && was_standby;
          was_standby = standby;
          // Load a fully populated clock before hiding the opaque card layer.
          // The periodic standby refresh remains responsible for later updates.
          if (standby && !id(screen_off_state) && !id(sleep_mode_state) &&
              id(panel_idle_screen).active_index().value_or(0) == onx_panel_ui::IDLE_CLOCK &&
              lv_scr_act() != id(standby_page)->obj)
            id(refresh_normal_standby_page).execute();
          const bool normal = id(ui_presenter)->is_normal_mode_active() && !standby &&
              !id(screen_off_state) && !id(sleep_mode_state) && id(room_panel)->native_ui_can_render() &&
              // Timer popups open the timer detail, drawn here like any other.
              !onx_notification::current.visible;
          // Restore the dock and status icons in the same pass as the cards.
          // The normal periodic refresh only runs once a second.
          if (exited && normal && !detail && id(normal_page_index) == 0)
            id(refresh_normal_device_page).execute();
          const int index = detail ? id(normal_device_detail_index) : id(normal_device_selected_index);
          const auto entity = index >= 0 && index < id(normal_device_count) ?
              id(ui_presenter)->get_normal_device_entity_id(index) : std::string();
          if (entity_detail && normal && id(normal_ha_api_connected)) {
            const int sensor = onx_sensor_view::index(entity);
            if (sensor >= 0 && onx_sensor_view::configs[sensor].graph &&
                onx_sensor_view::states[sensor].request_due(millis()))
              id(request_normal_sensor_history).execute(entity);
            const auto *weather = entity.rfind("weather.", 0) == 0 ? custom_logic_entity_sub::entity_detail(entity) : nullptr;
            if (weather && weather->available && weather->forecast_due(millis()))
              id(request_normal_weather_forecast).execute(entity);
          }
          // Media keeps its specialised artwork/transport view. Main pages and
          // generic details use the entire rectangle, without the round ring.
          if (normal && !entity.empty() && ((!detail && id(normal_page_index)==0) || entity_detail)) {
            // Rebuilding a view and its signature costs ~6-16 ms on the 3.5-inch
            // panel, so the carousel and details redraw only after a tap, a Home
            // Assistant state change, a screen switch, or once a second for slower
            // sources (icon and artwork downloads, history, settings, the clock).
            // Media progress, lyrics and timer countdowns still move every pass.
            static uint32_t seen_revision = 0, last_full_ms = 0;
            static std::string last_carousel;
            const std::string key = (detail ? "d:" : "c:") + entity;
            // Main pages (up to 12 cards) cost ~50 ms to re-check, so the
            // once-a-second refresh first compares a cheap key of what they can
            // show; a full check still runs every 10 s for anything it misses.
            static uint32_t last_inputs = 0;
            uint32_t inputs = 2166136261u;
            auto mix = [&inputs](uint32_t v) { inputs = (inputs ^ v) * 16777619u; };
            mix(custom_logic::entity_revision); mix(onx_panel_pages::seen_revision);
            mix(onx_display_settings::accent()); mix(onx_display_settings::background());
            mix(uint32_t(std::time(nullptr) / 60)); mix(onx_lyrics::store().version);
            for (char c : onx_media::ready_url) mix(uint8_t(c));
            // Timer cards count down locally: they change every second.
            for (int i = 0; i < onx_panel_pages::count; ++i)
              if (onx_panel_pages::entities[i].rfind("timer.", 0) == 0 || custom_logic_entity_sub::is_timer_detail(onx_panel_pages::entities[i])) {
                mix(uint32_t(std::time(nullptr))); break;
              }
            static uint32_t last_tick_ms = 0;
            const bool timer_due = millis() - last_tick_ms >= 1000;
            const bool main_quiet = !detail && inputs == last_inputs && millis() - last_full_ms < 10000;
            const bool full = requested || onx_subs::state_revision != seen_revision ||
                              key != last_carousel || (timer_due && !main_quiet);
            if (timer_due) last_tick_ms = millis();
            if (!full && timer_due) onx_panel_detail::refresh_icons();  // Downloaded icons (~0.1 ms).
            if (full) {
              seen_revision = onx_subs::state_revision; last_full_ms = millis();
              last_carousel = key; last_inputs = inputs;
              onx_panel_pages::render(entity, onx_panel_ui::width, onx_panel_ui::height, detail, [](lv_obj_t *icon, const std::string &target) {
                id(apply_normal_entity_icon).execute(icon,target,"",false);
              });
            } else {
              onx_panel_detail::tick_media_progress();
              if (detail) onx_panel_detail::tick_timers();
            }
          } else if (normal && !detail && id(normal_page_index)==0 && lv_scr_act() == id(normal_panel_page)->obj) {
            onx_panel_pages::render_settings(onx_panel_ui::width, onx_panel_ui::height);
          } else onx_panel_pages::hide();
          static uint32_t last_main_artwork = 0;
          if ((!detail || onx_panel_detail::active) && normal && !onx_media::main_entity.empty() && millis() - last_main_artwork >= 1000) {
            last_main_artwork = millis();
            id(refresh_normal_media_cover).execute();
          }
          // The bell (with its unread count) belongs to the main carousel; other
          // screens open the centre by pulling down from the top edge. The
          // dashboard also has an automatic shortcut when a URL is configured.
          onx_notification_ui::set_bell_visible(normal && !detail && onx_navigation::visible);
          // The shared Wi-Fi/HA status icons (top layer) show only on the carousel
          // and the idle clock; hide them in this pass so they never linger for
          // the 1 s carousel refresh when another screen opens.
          if (!standby && !(normal && !detail && id(normal_page_index) == 0)) {
            for (auto *icon : {id(normal_device_wifi_online_widget), id(normal_device_wifi_offline_widget),
                               id(normal_device_homeassistant_online_widget), id(normal_device_homeassistant_offline_widget)})
              lv_obj_add_flag(icon, LV_OBJ_FLAG_HIDDEN);
          }
          // Timer chip: Assist's local timers and every HA timer entry (paged or
          // registered), so timers without a page stay one tap away.
          static uint32_t last_chip = 0;
          if (millis() - last_chip >= 1000) {
            last_chip = millis();
            // Only active (or ringing) timers; paused ones stay on the timer screen.
            int count = 0; double soonest = -1;
            for (const auto &t : onx_panel_detail::all_timers()) {
              if (t.state != "active" && t.state != "ringing") continue;
              ++count;
              if (soonest < 0 || t.left < soonest) soonest = t.left;
            }
            onx_notification_ui::set_timer_chip(count == 0 ? std::string() :
                onx_timer::countdown(soonest) + (count > 1 ? " +" + std::to_string(count - 1) : std::string()));
          }
          // Media detail rearranged for the tall screen.
          // Idle screen.
          const auto mode = id(panel_idle_screen).active_index().value_or(0);
          const bool idle_clock = standby && mode == onx_panel_ui::IDLE_CLOCK && !id(screen_off_state) && !id(sleep_mode_state);
          const bool idle_photos = standby && mode == onx_panel_ui::IDLE_IMMICHFRAME &&
                                   !id(screen_off_state) && !id(sleep_mode_state);
          onx_panel_ui::update_idle_badge(onx_notification::center.items.size(), idle_clock || idle_photos);
          if (idle_clock) {
            static bool laid_out = false;
            const bool on_page = lv_scr_act() == id(standby_page)->obj;
            std::string today;
            if (id(ha_time_ready)) { auto now = id(ha_time).now(); if (now.is_valid()) today = now.strftime("%Y-%m-%d"); }
            if (on_page)
              onx_idle_clock::update(id(standby_page)->obj, onx_panel_ui::width, onx_panel_ui::height,
                                     id(standby_weather_state), today, entered || !laid_out);
            laid_out = on_page;
            if (id(normal_ha_api_connected) && onx_idle_clock::forecast_due(id(standby_weather_entity_id), millis()))
              id(request_idle_forecast).execute(id(standby_weather_entity_id));
          }
          if (entered && mode == onx_panel_ui::IDLE_DASHBOARD && id(room_panel)->stream_status() != "not configured")
            id(room_panel)->open_dashboard();
          const bool immichframe = mode == onx_panel_ui::IDLE_IMMICHFRAME;
          const bool slideshow = standby && immichframe;
          auto *layer = onx_panel_ui::slide_layer;
          if (!slideshow) {
            if (!onx_panel_ui::hidden(layer)) {
              onx_panel_ui::show(layer, false);
              onx_panel_ui::slide_error_show(nullptr, "");
              lv_image_set_src(onx_panel_ui::slide_image, static_cast<const void *>(nullptr));
              if (!onx_panel_ui::slide_loading) {
                id(immichframe_image)->release();
              }
            }
            return;
          }
          if (onx_panel_ui::hidden(layer)) {
            onx_panel_ui::show(layer, true);
            lv_obj_move_foreground(layer);
            // The notification bell stays above the photo.
            if (onx_panel_ui::idle_badge != nullptr) lv_obj_move_foreground(onx_panel_ui::idle_badge);
            onx_panel_ui::slide_due = millis();
          }
          if (id(ha_time_ready)) {
            auto now = id(ha_time).now();
            if (now.is_valid()) onx_render::label(onx_panel_ui::slide_time, now.strftime(onx_display_settings::time_pattern()).c_str());
          }
          onx_idle_clock::photo_overlay = id(panel_photo_overlay).active_index().value_or(0);
          onx_idle_clock::update_photo_overlay(onx_panel_ui::width, onx_panel_ui::height, id(standby_weather_state));
          const bool due = !onx_panel_ui::slide_loading &&
                           static_cast<int32_t>(millis() - onx_panel_ui::slide_due) >= 0;
          const std::string url = onx_panel_ui::immichframe_photo_url(id(panel_immichframe_url).state,
                                                   onx_panel_ui::width, onx_panel_ui::height,
                                                   id(panel_immichframe_fit).active_index().value_or(0),
                                                   id(panel_immichframe_split).state, [&]() {
                                                     std::string f;
                                                     auto add = [&](bool on, const char *name) { if (on) f += (f.empty() ? "" : ",") + std::string(name); };
                                                     add(id(panel_immichframe_info_date).state, "date");
                                                     add(id(panel_immichframe_info_location).state, "location");
                                                     add(id(panel_immichframe_info_album).state, "album");
                                                     add(id(panel_immichframe_info_people).state, "people");
                                                     add(id(panel_immichframe_info_description).state, "description");
                                                     return f;
                                                   }(),
                                                   due && onx_panel_ui::slide_step < 0);
          if (url.empty()) {
            onx_render::label(onx_panel_ui::slide_hint,
                "Set the ImmichFrame address on the panel's\nweb setup (Idle screen page).");
          }
          onx_panel_ui::show(onx_panel_ui::slide_hint, url.empty());
          if (url.empty()) onx_panel_ui::slide_error_show(nullptr, "");
          if (url.empty() || !due) return;
          auto *image = id(immichframe_image);
          onx_panel_ui::slide_step = 0;
          onx_panel_ui::slide_loading = true;
          onx_panel_ui::slide_due = millis() + static_cast<uint32_t>(id(panel_slideshow_seconds).state * 1000.0f);
          id(entity_icon_downloader)->set_artwork_busy(true);
          image->set_url(url);
          image->update();
  # A new orientation changes the screen size: restart once it is saved.
  - interval: 1s
    then:
      # Recent binary-sensor changes for the redesigned detail screen.
      - lambda: |-
          if (id(ha_time_ready)) onx_panel_detail::track(id(ha_time).now().timestamp);
      - lambda: |-
          static uint32_t due = 0;
          if (onx_display_settings::orientation.turns == onx_panel_ui::turns) { due = 0; return; }
          if (due == 0) {
            due = millis() + 2000;  // Let the settings response reach the browser.
            ESP_LOGI("panel", "Orientation changed to %u deg; restarting", onx_display_settings::orientation.turns * 90);
            return;
          }
          if (millis() >= due) App.safe_reboot();
  - interval: 50ms
    then:
      - lambda: |-
          // Keep legacy widgets and overlays on the same saved background
          // palette as the rectangular cards. Runtime setters use this mapper
          // too, so periodic refreshes cannot restore a different palette.
          using Pair = onx_render::PalettePair;
          const auto &surfaces = onx_render::DARK_SURFACES;
          const auto &texts = onx_render::DARK_TEXTS;
          static const lv_style_prop_t surface_props[] = {
            LV_STYLE_BG_COLOR, LV_STYLE_BG_GRAD_COLOR, LV_STYLE_BORDER_COLOR,
            LV_STYLE_ARC_COLOR, LV_STYLE_LINE_COLOR, LV_STYLE_OUTLINE_COLOR,
          };
          static const lv_style_selector_t parts[] = {
            LV_PART_MAIN, LV_PART_INDICATOR, LV_PART_KNOB, LV_PART_ITEMS,
          };
          static lv_obj_t *previous = nullptr;
          static int8_t previous_mode = -1;
          static uint8_t ticks = 0;
          // Accent colour (formerly "ring color"): the shared packages still
          // declare the default blue (and its darker button variant) on many
          // widgets. Map those, and any accent applied earlier, to the current one.
          static std::vector<uint32_t> accents{onx_display_settings::DEFAULT_ACCENT};
          static std::vector<uint32_t> strongs{0x1F6FEB};
          static uint32_t applied_accent = onx_display_settings::DEFAULT_ACCENT;
          const uint32_t accent = onx_display_settings::accent();
          const uint32_t strong = onx_display_settings::accent_strong();
          auto *page = lv_scr_act();
          const bool enabled = true;
          onx_render::dark_palette = false;
          onx_render::panel_palette = true;
          static uint32_t applied_background = 0xFFFFFFFF;
          const bool background_changed = applied_background != onx_display_settings::background();
          if(background_changed){onx_render::remember_panel_colors();applied_background=onx_display_settings::background();}
          const bool accent_changed = accent != applied_accent;
          const bool changed = page != previous || enabled != (previous_mode == 1) || accent_changed || background_changed;
          // Re-sweep once a second to catch raw runtime style changes.
          if (!changed && !(enabled && ++ticks >= 20)) return;
          ticks = 0;
          // Never treat a palette surface/text colour as a former accent.
          auto palette = [&](uint32_t c) {
            for (const auto &p : surfaces) if (c == p.normal || c == p.dark) return true;
            for (const auto &p : texts) if (c == p.normal || c == p.dark) return true;
            return false;
          };
          auto remember = [&](std::vector<uint32_t> &list, uint32_t c) {
            if (palette(c) || std::find(list.begin(), list.end(), c) != list.end()) return;
            if (list.size() >= 8) list.erase(list.begin() + 1);  // Keep the default.
            list.push_back(c);
          };
          remember(accents, accent);
          remember(strongs, strong);
          applied_accent = accent;
          if (changed || enabled) {
            auto recolor = [&](lv_obj_t *obj, lv_style_prop_t prop, lv_style_selector_t sel) {
              lv_style_value_t v;
              if (lv_obj_get_local_style_prop(obj, prop, &v, sel) != LV_STYLE_RES_FOUND) return;
              const uint32_t c = lv_color_to_u32(v.color) & 0xFFFFFF;
              uint32_t to;
              if (c != accent && std::find(accents.begin(), accents.end(), c) != accents.end()) to = accent;
              else if (c != strong && std::find(strongs.begin(), strongs.end(), c) != strongs.end()) to = strong;
              else return;
              v.color = lv_color_hex(to);
              lv_obj_set_local_style_prop(obj, prop, v, sel);
            };
            auto remap = [&](lv_obj_t *obj, lv_style_prop_t prop, lv_style_selector_t sel,
                             const Pair *table, size_t n, bool to_dark) {
              lv_style_value_t v;
              if (lv_obj_get_local_style_prop(obj, prop, &v, sel) != LV_STYLE_RES_FOUND) {
                if(prop!=LV_STYLE_TEXT_COLOR||sel!=LV_PART_MAIN||!lv_obj_check_type(obj,&lv_label_class))return;
                v.color=lv_obj_get_style_text_color(obj,LV_PART_MAIN);
              }
              const uint32_t c = lv_color_to_u32(v.color) & 0xFFFFFF;
              const auto to=onx_render::panel_property_color(obj,prop,c);
              if(to!=c){v.color=lv_color_hex(to);lv_obj_set_local_style_prop(obj,prop,v,sel);}
            };
            std::function<void(lv_obj_t *)> walk = [&](lv_obj_t *obj) {
              for (auto part : parts) {
                for (auto prop : surface_props)
                  remap(obj, prop, part, surfaces, sizeof(surfaces) / sizeof(*surfaces), enabled);
                remap(obj, LV_STYLE_TEXT_COLOR, part, texts, sizeof(texts) / sizeof(*texts), enabled);
                remap(obj, LV_STYLE_IMAGE_RECOLOR, part, texts, sizeof(texts) / sizeof(*texts), enabled);
                for (auto prop : surface_props) recolor(obj, prop, part);
                recolor(obj, LV_STYLE_TEXT_COLOR, part);
                recolor(obj, LV_STYLE_IMAGE_RECOLOR, part);
              }
              const uint32_t n = lv_obj_get_child_count(obj);
              for (uint32_t i = 0; i < n; ++i) walk(lv_obj_get_child(obj, i));
            };
            // Pages left dark are restored when they are next shown. The
            // rectangular main and detail screens keep their own palette: they
            // are rebuilt on every change, so remapping them flashed on touch.
            walk(page);
            onx_render::style_bg_color(page,lv_color_hex(onx_display_settings::background()),0);
            onx_render::style_text_color(page,lv_color_hex(onx_display_settings::foreground()),0);
            auto *top = lv_layer_top();
            for (uint32_t i = 0; i < lv_obj_get_child_count(top); ++i) {
              auto *child = lv_obj_get_child(top, i);
              if (child != onx_panel_pages::layer) walk(child);
            }
          }
          if (!changed) return;
          previous = page; previous_mode = enabled ? 1 : 0;
          // The base layout's round shells show as discs on a rectangle.
          onx_panel_ui::flatten(page);
          for (uint32_t i = 0; i < lv_obj_get_child_count(page); ++i) {
            auto *shell = lv_obj_get_child(page, i);
            if (lv_obj_check_type(shell, &lv_obj_class)) {
              // Main carousel pages use the space above the compact icon bar.
              if (onx_navigation::visible && page != id(standby_page)->obj) {
                lv_obj_set_height(shell, onx_panel_ui::height - 44);
                lv_obj_set_style_radius(shell, 0, 0);
              }
            }
          }

esphome:
  includes:
    - ../../onx_panel_ui.h
    - ../../onx_ble_guard.h
    - ../../onx_panel_layout.h
    - ../../onx_panel_artwork.h
    - ../../onx_panel_detail.h
    - ../../onx_panel_pages.h
    - ../../onx_idle_clock.h
  on_boot:
    # Orientation (Device settings → Display orientation; no accelerometer):
    # before the SPI display (HARDWARE), touchscreen and LVGL read the
    # dimensions, so landscape is a native 480x320 (or 320x240) screen.
    - priority: 1100
      then:
        - lambda: |-
            onx_render::panel_palette = true;
            onx_display_settings::BackgroundSettings background{};
            auto bg_preference=global_preferences->make_preference<onx_display_settings::BackgroundSettings>(fnv1_hash("onx.background.v1"));
            if(bg_preference.load(&background) && background.magic==0x4F4E5842 && background.color<=0xFFFFFF)
              onx_display_settings::background_settings=background;
            onx_render::remember_panel_colors();
            onx_display_settings::Orientation saved{};
            auto preference = global_preferences->make_preference<onx_display_settings::Orientation>(
                fnv1_hash("onx.orientation.v1"));
            const uint8_t turns = preference.load(&saved) && saved.magic == 0x4F4E584F && saved.turns <= 3 ? saved.turns : 0;
            onx_panel_ui::configure_screen(${display_width}, ${display_height}, turns);
            id(lcd_display)->set_boot_orientation(turns);
            // Touch reports native portrait coordinates; map them to the turned screen.
            const bool swap = turns & 1;
            id(panel_touch)->set_swap_xy(swap);
            id(panel_touch)->set_mirror_x(turns == 2 || turns == 3);
            id(panel_touch)->set_mirror_y(turns == 1 || turns == 2);
            id(panel_touch)->set_calibration(0, swap ? ${display_height} : ${display_width},
                                             0, swap ? ${display_width} : ${display_height});
            ESP_LOGI("panel", "Orientation %u deg: %dx%d", turns * 90, onx_panel_ui::width, onx_panel_ui::height);
    # After the base UI (-100) and the notification centre (-200) are built.
    - priority: -250
      then:
        - script.execute: panel_ui_setup
    # Before the base boot handler (-100) renders any page.
    - priority: 800
      then:
        - lambda: |-
            onx_geom::scale = ${ui_scale};
            onx_navigation::shortcut_action = []() {
              if (id(touch_input)->suppress_click() || onx_notification_ui::owns_screen()) return;
              id(ui_presenter)->notify_user_activity();
              id(room_panel)->open_dashboard();
            };
            onx_navigation::local_action = [](const std::string &entity) {
              if (entity == "[Local] Dashboard") { id(room_panel)->open_dashboard(); return true; }
              if (entity == "[Local] Assist") { id(toggle_assist).execute(); return true; }
              return false;
            };
            onx_navigation::local_state = [](int io) {
              if (io == custom_logic::PANEL_LOCAL_DASHBOARD) return id(room_panel)->dashboard_open();
              if (io == custom_logic::PANEL_LOCAL_ASSIST) return id(assist).is_running();
              return false;
            };
            onx_navigation::local_icon = [](const std::string &entity) -> esphome::image::Image * {
              if (entity == "[Local] Dashboard") return id(panel_dashboard_icon);
              if (entity == "[Local] Assist") return id(panel_assist_icon);
              return nullptr;
            };
            // The strip keeps its distance from the bottom edge in either orientation.
            const int h = onx_panel_ui::height;
            onx_navigation::configure_strip(onx_panel_ui::width, h, h - (${display_height} - ${strip_center_y}),
                                            ${strip_spacing}, ${strip_marker}, ${strip_icon},
                                            ${strip_label_y} < 0 ? -1 : h - (${display_height} - ${strip_label_y}),
                                            id(${strip_label_font})->get_lv_font());

# Icons for the panel-local controls (Material Design Icons, as the panel's fallbacks).
image:
  - platform: online_image
    id: immichframe_image
    url: http://homeassistant.local:8123/
    format: JPEG
    type: RGB565
    update_interval: never
    request_headers:
      Authorization: "${immichframe_authorization}"
    on_download_finished:
      then:
        - lambda: |-
            onx_panel_ui::slide_loading = false;
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            auto *image = id(immichframe_image);
            if (onx_panel_ui::hidden(onx_panel_ui::slide_layer)) { image->release(); return; }
            lv_image_set_src(onx_panel_ui::slide_image, image->get_lv_image_dsc());
            lv_obj_center(onx_panel_ui::slide_image);
            onx_panel_ui::slide_error_show(nullptr, "");
            onx_panel_ui::slide_fade_in(id(panel_slideshow_fade).state);
    on_error:
      then:
        - lambda: |-
            onx_panel_ui::slide_loading = false;
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            auto *image = id(immichframe_image);
            if (onx_panel_ui::hidden(onx_panel_ui::slide_layer)) image->release();
            onx_panel_ui::slide_waiting(false);
            lv_obj_set_style_image_opa(onx_panel_ui::slide_image, LV_OPA_COVER, 0);
            if (image->get_width() == 0) lv_image_set_src(onx_panel_ui::slide_image, static_cast<const void *>(nullptr));
            {
              // Tell the user why photos stopped; the card clears on the next photo.
              const auto &err = image->last_error();
              std::string reason = "Can't get a photo from the ImmichFrame server. Retrying in 15 s.";
              if (err.find("401") != std::string::npos || err.find("403") != std::string::npos)
                reason = "The server refused the request. Check the ImmichFrame authorization.";
              if (!err.empty()) reason += "\n" + err.substr(0, 80);
              onx_panel_ui::slide_error_show("ImmichFrame", reason);
            }
            onx_panel_ui::slide_due = millis() + 15000;
  - platform: file
    file: "../../assets/entity_icons/monitor-dashboard.svg"
    id: panel_dashboard_icon
    resize: ${ (80 * (ui_scale | float)) | round | int }x${ (80 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "../../assets/panel/cog-outline.svg"
    id: panel_settings_icon
    resize: ${ (72 * (ui_scale | float)) | round | int }x${ (72 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "../../assets/panel/action-grid.svg"
    id: panel_action_grid_icon
    resize: 80x80
    type: RGB565
    transparency: alpha_channel
  # Light detail colour wheel (hue around, saturation outwards), from
  # OpenHAPanel (Apache-2.0, see THIRD_PARTY_NOTICES.md).
  - platform: file
    file: "../../assets/panel/color-wheel-openhapanel.png"
    id: panel_color_wheel
    resize: ${ (220 * (ui_scale | float)) | round | int }x${ (220 * (ui_scale | float)) | round | int }
