# Panel layer: display/input integration and connectivity for these boards.
# Everything else comes from the shared packages.
logger:
  # CH340 USB-to-UART on GPIO43/44 carries logs and Improv Serial; GPIO19/20
  # (USB-Serial-JTAG) belong to the PDM microphone.
  hardware_uart: UART0
  baud_rate: 115200

# The base auxiliary UART would use GPIO43/44, which are the console here.
uart: !remove

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

lvgl:
  id: lvgl_ui
  # Referencing Montserrat 28 compiles it in for the media control symbols.
  top_layer:
    widgets:
      - label:
          id: panel_symbol_font_ref
          hidden: true
          text_font: montserrat_28
          text: ""
  displays:
    - lcd_display
  # Touch reaches LVGL only for overlays (notification centre); the base pages
  # are driven through onx_touch_input.
  touchscreens:
    - touchscreen_id: panel_touch
  resume_on_input: false
  update_interval: 16ms
  # Keep 25%: smaller buffers are placed in internal RAM and starve Wi-Fi
  # (8% aborted at boot). At this size it lives in PSRAM.
  buffer_size: 25%
  default_font: fonts_MiSans_Medium_14
  log_level: WARN

select:
  - platform: template
    id: panel_idle_screen
    name: Idle screen
    icon: mdi:sleep
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Clock
      - Photo slideshow
      - Dashboard
    initial_option: Clock

text:
  - platform: template
    id: panel_slideshow_urls
    name: Slideshow pictures
    icon: mdi:image-multiple
    entity_category: config
    mode: text
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""

number:
  - platform: template
    id: panel_slideshow_seconds
    name: Slideshow interval
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 20

switch:
  - platform: template
    id: panel_dark_mode
    name: Dark mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

interval:
  # Rectangular-panel UI (onx_panel_ui.h): bell, media layout, idle screen.
  - interval: 100ms
    then:
      - lambda: |-
          if (onx_panel_pages::layer == nullptr) return;
          // Native rectangular pages reuse the existing HA state and actions.
          const bool detail = id(normal_device_detail_active);
          if (!detail && !onx_panel_pages::parent_entity.empty()) {
            const int config = onx_panel_pages::configured(onx_panel_pages::parent_entity);
            onx_panel_pages::parent_entity.clear();
            if (config >= 0) {
              id(normal_device_selected_index) = custom_logic::normal_ui_slot_for_device_config_slot(config);
              id(show_normal_device_entry_page).execute(0);
            }
          }
          const int index = detail ? id(normal_device_detail_index) : id(normal_device_selected_index);
          const auto entity = index >= 0 && index < id(normal_device_count) ?
              id(ui_presenter)->get_normal_device_entity_id(index) : std::string();
          const bool media = entity.rfind("media_player.",0)==0;
          const bool entity_detail = detail && (id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_AUTOMATION ||
              id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_LIGHT || id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_SWITCH ||
              id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_PLUG || id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_CURTAIN);
          const bool normal = id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
              !id(screen_off_state) && !id(sleep_mode_state) && id(room_panel)->native_ui_has_touch() &&
              !onx_notification::current.visible && !onx_timer::popup.visible && !onx_playlist::browser.open &&
              !onx_notification_ui::owns_screen();
          // Media keeps its specialised artwork/transport view. Main pages and
          // generic details use the entire rectangle, without the round ring.
          if (normal && !entity.empty() && ((!detail && id(normal_page_index)==0) || (entity_detail && !media))) {
            onx_panel_pages::render(entity, onx_panel_ui::width, onx_panel_ui::height, detail, [](lv_obj_t *icon, const std::string &target) {
              id(apply_normal_entity_icon).execute(icon,target,"",false);
            });
          } else onx_panel_pages::hide();
          const bool standby = id(ui_presenter)->is_standby_active();
          // The bell (with its unread count) belongs to the main carousel; other
          // screens open the centre by pulling down from the top edge. The
          // dashboard is a "[Local] Dashboard" item in the bottom bar.
          onx_notification_ui::set_bell_visible(normal && !detail && onx_navigation::visible);
          // Media detail rearranged for the tall screen.
          if (lv_scr_act() == id(normal_automation_page)->obj) {
            onx_panel_ui::sync_media({id(normal_automation_detail_shell), id(normal_media_cover), id(normal_media_title),
                                      id(normal_media_artist), id(normal_media_progress_arc),
                                      id(normal_media_transport_overlay), id(normal_automation_detail_icon),
                                      id(normal_playlist_overlay), id(normal_automation_detail_action), id(normal_automation_detail_title)}, &lv_font_montserrat_28);
          }
          // Idle screen.
          static bool was_standby = false;
          const auto mode = id(panel_idle_screen).active_index().value_or(0);
          const bool entered = standby && !was_standby;
          was_standby = standby;
          if (entered && mode == onx_panel_ui::IDLE_DASHBOARD && id(room_panel)->stream_status() != "not configured")
            id(room_panel)->open_dashboard();
          const bool slideshow = standby && mode == onx_panel_ui::IDLE_SLIDESHOW;
          auto *layer = onx_panel_ui::slide_layer;
          if (!slideshow) {
            if (!onx_panel_ui::hidden(layer)) {
              onx_panel_ui::show(layer, false);
              lv_image_set_src(onx_panel_ui::slide_image, static_cast<const void *>(nullptr));
              if (!onx_panel_ui::slide_loading) id(slideshow_image)->release();
            }
            return;
          }
          if (onx_panel_ui::hidden(layer)) {
            onx_panel_ui::show(layer, true);
            lv_obj_move_foreground(layer);
            onx_panel_ui::slide_due = 0;
          }
          if (id(ha_time_ready)) {
            auto now = id(ha_time).now();
            if (now.is_valid()) onx_render::label(onx_panel_ui::slide_time, now.strftime(onx_display_settings::time_pattern()).c_str());
          }
          onx_panel_ui::slides = onx_panel_ui::split_urls(id(panel_slideshow_urls).state);
          onx_panel_ui::show(onx_panel_ui::slide_hint, onx_panel_ui::slides.empty());
          if (onx_panel_ui::slides.empty() || onx_panel_ui::slide_loading || millis() < onx_panel_ui::slide_due) return;
          onx_panel_ui::slide_index = (onx_panel_ui::slide_index + 1) % onx_panel_ui::slides.size();
          onx_panel_ui::slide_loading = true;
          onx_panel_ui::slide_due = millis() + static_cast<uint32_t>(id(panel_slideshow_seconds).state * 1000.0f);
          id(entity_icon_downloader)->set_artwork_busy(true);
          id(slideshow_image)->set_url(onx_panel_ui::slides[onx_panel_ui::slide_index]);
          id(slideshow_image)->update();
  # A new orientation changes the screen size: restart once it is saved.
  - interval: 1s
    then:
      # Recent binary-sensor changes for the redesigned detail screen.
      - lambda: |-
          if (id(ha_time_ready)) onx_panel_detail::track(id(ha_time).now().timestamp);
      - lambda: |-
          static uint32_t due = 0;
          if (onx_display_settings::orientation.turns == onx_panel_ui::turns) { due = 0; return; }
          if (due == 0) {
            due = millis() + 2000;  // Let the settings response reach the browser.
            ESP_LOGI("panel", "Orientation changed to %u deg; restarting", onx_display_settings::orientation.turns * 90);
            return;
          }
          if (millis() >= due) App.safe_reboot();
  - interval: 50ms
    then:
      - lambda: |-
          // Dark mode remaps the base palette (grey surfaces, white text) to
          // near-black on every widget, including overlays. Each dark colour is
          // unique, so turning it off maps back to the original exactly, and
          // re-applying is harmless for widgets that repaint themselves.
          struct Pair { uint32_t normal, dark; };
          static const Pair surfaces[] = {
            {0x1A1A1A, 0x010101}, {0x272727, 0x121213}, {0x232323, 0x0E0E0F},
            {0x2D2D2D, 0x151516}, {0x3D3D3D, 0x1F1F21}, {0x101418, 0x020304},
            {0x2A2F35, 0x111417}, {0x24323A, 0x0D161B}, {0x414850, 0x22272C},
            {0x5A5A5A, 0x333335}, {0x404040, 0x252527},
          };
          static const Pair texts[] = {
            {0xFFFFFF, 0xE4E4E6}, {0xD2D2D2, 0x9C9C9E}, {0xD8D8D8, 0xA2A2A4},
            {0xB8B8B8, 0x858587}, {0xAAAAAA, 0x7A7A7C},
          };
          static const lv_style_prop_t surface_props[] = {
            LV_STYLE_BG_COLOR, LV_STYLE_BG_GRAD_COLOR, LV_STYLE_BORDER_COLOR,
            LV_STYLE_ARC_COLOR, LV_STYLE_LINE_COLOR, LV_STYLE_OUTLINE_COLOR,
          };
          static const lv_style_selector_t parts[] = {
            LV_PART_MAIN, LV_PART_INDICATOR, LV_PART_KNOB, LV_PART_ITEMS,
          };
          static lv_obj_t *previous = nullptr;
          static int8_t previous_mode = -1;
          static uint8_t ticks = 0;
          // Accent colour (formerly "ring color"): the shared packages still
          // declare the default blue (and its darker button variant) on many
          // widgets. Map those, and any accent applied earlier, to the current one.
          static std::vector<uint32_t> accents{onx_display_settings::DEFAULT_ACCENT};
          static std::vector<uint32_t> strongs{0x1F6FEB};
          static uint32_t applied_accent = onx_display_settings::DEFAULT_ACCENT;
          const uint32_t accent = onx_display_settings::accent();
          const uint32_t strong = onx_display_settings::accent_strong();
          auto *page = lv_scr_act();
          const bool enabled = id(panel_dark_mode).state;
          const bool accent_changed = accent != applied_accent;
          const bool changed = page != previous || enabled != (previous_mode == 1) || accent_changed;
          // While dark, re-sweep once a second to catch colours set at runtime.
          if (!changed && !(enabled && ++ticks >= 20)) return;
          ticks = 0;
          // Never treat a palette surface/text colour as a former accent.
          auto palette = [&](uint32_t c) {
            for (const auto &p : surfaces) if (c == p.normal || c == p.dark) return true;
            for (const auto &p : texts) if (c == p.normal || c == p.dark) return true;
            return false;
          };
          auto remember = [&](std::vector<uint32_t> &list, uint32_t c) {
            if (palette(c) || std::find(list.begin(), list.end(), c) != list.end()) return;
            if (list.size() >= 8) list.erase(list.begin() + 1);  // Keep the default.
            list.push_back(c);
          };
          remember(accents, accent);
          remember(strongs, strong);
          applied_accent = accent;
          if (changed || enabled) {
            auto recolor = [&](lv_obj_t *obj, lv_style_prop_t prop, lv_style_selector_t sel) {
              lv_style_value_t v;
              if (lv_obj_get_local_style_prop(obj, prop, &v, sel) != LV_STYLE_RES_FOUND) return;
              const uint32_t c = lv_color_to_u32(v.color) & 0xFFFFFF;
              uint32_t to;
              if (c != accent && std::find(accents.begin(), accents.end(), c) != accents.end()) to = accent;
              else if (c != strong && std::find(strongs.begin(), strongs.end(), c) != strongs.end()) to = strong;
              else return;
              v.color = lv_color_hex(to);
              lv_obj_set_local_style_prop(obj, prop, v, sel);
            };
            auto remap = [&](lv_obj_t *obj, lv_style_prop_t prop, lv_style_selector_t sel,
                             const Pair *table, size_t n, bool to_dark) {
              lv_style_value_t v;
              if (lv_obj_get_local_style_prop(obj, prop, &v, sel) != LV_STYLE_RES_FOUND) return;
              const uint32_t c = lv_color_to_u32(v.color) & 0xFFFFFF;
              for (size_t i = 0; i < n; ++i) {
                const uint32_t from = to_dark ? table[i].normal : table[i].dark;
                if (c != from) continue;
                v.color = lv_color_hex(to_dark ? table[i].dark : table[i].normal);
                lv_obj_set_local_style_prop(obj, prop, v, sel);
                return;
              }
            };
            std::function<void(lv_obj_t *)> walk = [&](lv_obj_t *obj) {
              for (auto part : parts) {
                for (auto prop : surface_props)
                  remap(obj, prop, part, surfaces, sizeof(surfaces) / sizeof(*surfaces), enabled);
                remap(obj, LV_STYLE_TEXT_COLOR, part, texts, sizeof(texts) / sizeof(*texts), enabled);
                remap(obj, LV_STYLE_IMAGE_RECOLOR, part, texts, sizeof(texts) / sizeof(*texts), enabled);
                for (auto prop : surface_props) recolor(obj, prop, part);
                recolor(obj, LV_STYLE_TEXT_COLOR, part);
                recolor(obj, LV_STYLE_IMAGE_RECOLOR, part);
              }
              const uint32_t n = lv_obj_get_child_count(obj);
              for (uint32_t i = 0; i < n; ++i) walk(lv_obj_get_child(obj, i));
            };
            // Pages left dark are restored when they are next shown.
            walk(page);
            walk(lv_layer_top());
          }
          if (!changed) return;
          previous = page; previous_mode = enabled ? 1 : 0;
          // The base layout's round shells show as discs on a rectangle.
          onx_panel_ui::flatten(page);
          for (uint32_t i = 0; i < lv_obj_get_child_count(page); ++i) {
            auto *shell = lv_obj_get_child(page, i);
            if (lv_obj_check_type(shell, &lv_obj_class)) {
              // Main carousel pages use the space above the compact icon bar.
              if (onx_navigation::visible) {
                lv_obj_set_height(shell, onx_panel_ui::height - 44);
                lv_obj_set_style_radius(shell, 0, 0);
              }
            }
          }

esphome:
  includes:
    - ../../onx_panel_ui.h
    - ../../onx_panel_layout.h
    - ../../onx_panel_detail.h
    - ../../onx_panel_pages.h
  on_boot:
    # Orientation (Device settings → Display orientation; no accelerometer):
    # before the SPI display (HARDWARE), touchscreen and LVGL read the
    # dimensions, so landscape is a native 480x320 (or 320x240) screen.
    - priority: 1100
      then:
        - lambda: |-
            onx_display_settings::Orientation saved{};
            auto preference = global_preferences->make_preference<onx_display_settings::Orientation>(
                fnv1_hash("onx.orientation.v1"));
            const uint8_t turns = preference.load(&saved) && saved.magic == 0x4F4E584F && saved.turns <= 3 ? saved.turns : 0;
            onx_panel_ui::configure_screen(${display_width}, ${display_height}, turns);
            id(lcd_display)->set_boot_orientation(turns);
            // Touch reports native portrait coordinates; map them to the turned screen.
            const bool swap = turns & 1;
            id(panel_touch)->set_swap_xy(swap);
            id(panel_touch)->set_mirror_x(turns == 2 || turns == 3);
            id(panel_touch)->set_mirror_y(turns == 1 || turns == 2);
            id(panel_touch)->set_calibration(0, swap ? ${display_height} : ${display_width},
                                             0, swap ? ${display_width} : ${display_height});
            ESP_LOGI("panel", "Orientation %u deg: %dx%d", turns * 90, onx_panel_ui::width, onx_panel_ui::height);
    # After the base UI (-100) and the notification centre (-200) are built.
    - priority: -250
      then:
        - script.execute: panel_ui_setup
    # Before the base boot handler (-100) renders any page.
    - priority: 800
      then:
        - lambda: |-
            onx_geom::scale = ${ui_scale};
            // "[Local] Dashboard" and "[Local] Assist" become valid slot entities.
            custom_logic::panel_local_entries = true;
            onx_navigation::local_action = [](const std::string &entity) {
              if (entity == "[Local] Dashboard") { id(room_panel)->open_dashboard(); return true; }
              if (entity == "[Local] Assist") { id(toggle_assist).execute(); return true; }
              return false;
            };
            onx_navigation::local_state = [](int io) {
              if (io == custom_logic::PANEL_LOCAL_DASHBOARD) return id(room_panel)->dashboard_open();
              if (io == custom_logic::PANEL_LOCAL_ASSIST) return id(assist).is_running();
              return false;
            };
            onx_navigation::local_icon = [](const std::string &entity) -> esphome::image::Image * {
              if (entity == "[Local] Dashboard") return id(panel_dashboard_icon);
              if (entity == "[Local] Assist") return id(panel_assist_icon);
              return nullptr;
            };
            // The strip keeps its distance from the bottom edge in either orientation.
            const int h = onx_panel_ui::height;
            onx_navigation::configure_strip(onx_panel_ui::width, h, h - (${display_height} - ${strip_center_y}),
                                            ${strip_spacing}, ${strip_marker}, ${strip_icon},
                                            ${strip_label_y} < 0 ? -1 : h - (${display_height} - ${strip_label_y}),
                                            id(${strip_label_font})->get_lv_font());

# Icons for the panel-local controls (Material Design Icons, as the panel's fallbacks).
image:
  - platform: online_image
    id: slideshow_image
    url: http://homeassistant.local:8123/
    format: AUTO
    type: RGB565
    resize: ${display_width}x${display_height}
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            onx_panel_ui::slide_loading = false;
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            if (onx_panel_ui::hidden(onx_panel_ui::slide_layer)) { id(slideshow_image)->release(); return; }
            lv_image_set_src(onx_panel_ui::slide_image, id(slideshow_image)->get_lv_image_dsc());
            lv_obj_center(onx_panel_ui::slide_image);
    on_error:
      then:
        - lambda: |-
            onx_panel_ui::slide_loading = false;
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            onx_panel_ui::slide_due = millis() + 3000;  // Skip a broken picture quickly.
  - platform: file
    file: "../../assets/entity_icons/monitor-dashboard.svg"
    id: panel_dashboard_icon
    resize: ${ (80 * (ui_scale | float)) | round | int }x${ (80 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "../../assets/entity_icons/microphone.svg"
    id: panel_assist_icon
    resize: ${ (80 * (ui_scale | float)) | round | int }x${ (80 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel

script:
  - id: panel_ui_setup
    then:
      - lambda: |-
          onx_panel_pages::setup(id(fonts_MiSans_Medium_14)->get_lv_font(),
              id(fonts_MiSans_Medium_24)->get_lv_font(), id(fonts_MiSans_Medium_32)->get_lv_font());
          onx_panel_pages::view_for = [](const std::string &entity,bool detail) {
            auto title = custom_logic::ha_entity_title_from_registry_cache(entity);
            auto view = detail ? onx_detail_view::build(entity,title) : onx_detail_view::carousel(entity,title);
            const int config = onx_panel_pages::configured(entity);
            const int ui = custom_logic::normal_ui_slot_for_device_config_slot(config);
            if (detail && config >= 0) {
              if (entity.rfind("light.",0)==0)
                view = onx_detail_view::light_view(entity,title,id(app_storage)->normal_device_slot(ui).light(),id(normal_detail_light_mode));
              else onx_entity_config::customize_control_view(ui,entity,view);
            }
            if (detail && custom_logic_entity_sub::is_timer_detail(entity)) view=onx_panel_pages::timer_view(entity,title);
            return view;
          };
          // Redesigned detail screens (onx_panel_detail.h).
          onx_panel_detail::fonts = {id(fonts_MiSans_Medium_14)->get_lv_font(), id(fonts_MiSans_Medium_20)->get_lv_font(),
              id(fonts_MiSans_Bold_18)->get_lv_font(), id(fonts_MiSans_Medium_32)->get_lv_font(), &lv_font_montserrat_28};
          onx_panel_detail::blocked = []() { return id(touch_input)->suppress_click() || onx_notification_ui::owns_screen(); };
          onx_panel_detail::activity = []() { id(ui_presenter)->notify_user_activity(); };
          onx_panel_detail::light_state = [](const std::string &entity) {
            const int config = onx_panel_pages::configured(entity);
            if (config < 0) return esphome::onx_storage::NormalLightState{};
            return id(app_storage)->normal_device_slot(custom_logic::normal_ui_slot_for_device_config_slot(config)).light();
          };
          onx_panel_detail::light_mode = []() { return int(id(normal_detail_light_mode)); };
          onx_panel_detail::set_light_mode = [](int mode) { id(normal_detail_light_mode) = mode; };
          onx_panel_pages::draw_graph = [](lv_obj_t *parent,const std::string &entity,int y) {
            static std::string previous;
            static uint32_t refreshed = 0;
            if (previous != entity || millis() - refreshed >= 1000 || !onx_sensor_graph::canvas) {
              onx_sensor_graph::render(parent,entity,id(ha_time).now().timestamp,
                  onx_display_settings::current.media_color,id(fonts_MiSans_Medium_12)->get_lv_font());
              previous = entity; refreshed = millis();
            }
            if (onx_sensor_graph::canvas) {
              lv_obj_remove_flag(onx_sensor_graph::canvas,LV_OBJ_FLAG_HIDDEN);
              if (lv_obj_get_parent(onx_sensor_graph::canvas)!=parent) lv_obj_set_parent(onx_sensor_graph::canvas,parent);
              onx_render::align(onx_sensor_graph::canvas,LV_ALIGN_TOP_MID,0,y);
            }
          };
          onx_panel_detail::draw_graph = onx_panel_pages::draw_graph;
          onx_panel_detail::shortcut = [](const std::string &entity) {
            const int config = onx_panel_pages::configured(entity);
            return config < 0 ? std::string() : onx_entity_config::action_for_slot(config);
          };
          onx_panel_detail::shortcut_title = [](const std::string &action) {
            return onx_media::display_text(custom_logic::ha_entity_title_from_registry_cache(action));
          };
          onx_panel_detail::run_shortcut = []() { id(emit_configured_press_action).execute(id(normal_device_detail_index)); };
          onx_panel_pages::open = [](const std::string &entity) {
            if (id(touch_input)->suppress_click() || onx_notification::current.visible ||
                onx_timer::popup.visible || onx_notification_ui::owns_screen() ||
                id(ui_presenter)->is_standby_active()) return;
            const int config = onx_panel_pages::configured(entity);
            if (config < 0) return;
            id(normal_device_selected_index) = custom_logic::normal_ui_slot_for_device_config_slot(config);
            id(ui_presenter)->notify_user_activity();
            id(enter_normal_switch_detail).execute();
          };
          id(touch_input)->set_tap_fn([](int x,int y) { return onx_panel_pages::tap(x,y); });
          // Runtime geometry (orientation chosen at boot).
          id(touch_input)->set_geometry(onx_panel_ui::width, onx_panel_ui::height - 44, ${strip_spacing},
                                        onx_geom::S(22));
          lv_obj_set_size(id(assist_overlay), onx_panel_ui::width, onx_panel_ui::height);
          onx_panel_ui::on_track = [](bool previous) {
            if (id(touch_input)->suppress_click()) return;
            id(ui_presenter)->notify_user_activity();
            id(emit_normal_media_track).execute(id(normal_device_detail_index), previous);
          };
          // Play/pause is the shared press action on the media detail.
          onx_panel_ui::on_play_pause = []() {
            if (id(touch_input)->suppress_click()) return;
            id(ui_presenter)->notify_user_activity();
            id(key_btn)->set_virtual_pressed(true);
            id(key_btn)->set_virtual_pressed(false);
          };
          onx_panel_ui::is_playing = []() {
            const auto *d = custom_logic_entity_sub::entity_detail(
                id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index)));
            return d != nullptr && d->state == "playing";
          };
          onx_panel_ui::create_slideshow(id(standby_page)->obj, id(fonts_MiSans_Bold_24)->get_lv_font(),
                                         id(fonts_MiSans_Medium_14)->get_lv_font());
          id(touch_input)->set_passthrough_fn([](int x, int y) {
            return onx_panel_ui::hit(x, y) || onx_notification_ui::bell_hit(x, y);
          });
