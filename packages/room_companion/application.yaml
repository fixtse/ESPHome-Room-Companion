# Room Companion with audio: the shared application plus the Dual MIC board,
# the speaker, Assist (with the media player and voice timers) and SoundSense.
substitutions:
  # OTA manifest suffix: <model>${firmware_variant}_manifest.yml.
  firmware_variant: ""
  # Shown as the device model in Home Assistant.
  firmware_variant_label: ""

packages:
  base: !include application_base.yaml
  audio_hardware: !include boards/audio.yaml
  assist: !include features/assist.yaml
  sound_sense: !include features/sound_sense.yaml
