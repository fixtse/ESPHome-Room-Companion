  # Detail state for the redesigned automation/media/sensor screens
  # (onx_panel_detail draws them); the legacy round page was removed.
  - id: refresh_normal_automation_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!onx_sensor_graph::panel_owned) onx_sensor_graph::hide();
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
            return;
          }
          const int detail_index = std::clamp(id(normal_device_detail_index), 0, (int) custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT - 1);
          const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          id(normal_device_detail_online) = custom_logic::is_normal_ui_device_online(detail_index);
          auto *media_state=custom_logic_entity_sub::entity_detail(entity_id);
          const bool media_stopped = entity_id.rfind("media_player.", 0) == 0 && media_state &&
              media_state->media_player_off_transition_pending && media_state->received &&
              (!media_state->available || !onx_media::has_playback(media_state->state)) &&
              id(normal_ha_api_connected) &&
              ((media_state->available && id(normal_device_detail_online) && media_state->state == "off") ||
               (millis() - media_state->media_player_stop_ms >= 2500 &&
                !onx_media::transport.remaining_ms(entity_id, millis())));
          if (media_stopped) {
            // Only a new stop/off transition closes an already-open player view.
            media_state->media_player_off_transition_pending = false;
            media_state->media_player_stop_ms = 0;
            onx_playlist::browser.clear();
            id(exit_normal_switch_detail).execute();
            return;
          }
          if (onx_playlist::browser.open) { id(refresh_normal_playlist).execute(); return; }
          id(refresh_normal_media_cover).execute();

  # Detail state for the redesigned light screen (onx_panel_detail draws
  # it); the legacy round page and its widgets were removed.
  - id: refresh_normal_light_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
            return;
          }
          const int detail_index = std::clamp(id(normal_device_detail_index), 0, (int) custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT - 1);
          auto detail_slot = id(app_storage)->normal_device_slot(detail_index);
          auto light_state = detail_slot.light();
          const bool is_on = light_state.is_on;
          int brightness = std::clamp((int) light_state.brightness_pct, 0, 100);
          const int displayed_brightness = is_on ? brightness : 0;
          int last_nonzero = (int) light_state.last_nonzero_brightness_pct;
          if (last_nonzero < 1 || last_nonzero > 100) last_nonzero = 100;
          if (light_state.custom_supports_brightness()) {
            if (is_on && brightness <= 0) {
              brightness = last_nonzero;
              esphome::onx_storage::NormalLightStatePatch patch{};
              patch.has_brightness_pct = true;
              patch.brightness_pct = static_cast<uint8_t>(brightness);
              detail_slot.update_light(patch);
            }
            if (brightness > 0) {
              last_nonzero = brightness;
              esphome::onx_storage::NormalLightStatePatch patch{};
              patch.has_brightness_pct = true;
              patch.brightness_pct = static_cast<uint8_t>(last_nonzero);
              detail_slot.update_light(patch);
            }
          }
          id(normal_device_detail_light_brightness) = displayed_brightness;
          id(normal_device_detail_light_last_nonzero_brightness) = last_nonzero;
          id(normal_device_detail_is_on) = is_on;
          // Adjustable modes: brightness, colour temperature, colour.
          const bool enabled[3] = {light_state.custom_supports_brightness(),
                                   light_state.custom_supports_color_temperature(),
                                   light_state.custom_supports_rgb()};
          int mode_count = 0;
          for (bool e : enabled) mode_count += e;
          id(normal_detail_light_mode_count) = mode_count;
          const int mode = id(normal_detail_light_mode);
          if (mode < 0 || mode > 2 || !enabled[mode])
            for (int m = 0; m < 3; ++m) if (enabled[m]) { id(normal_detail_light_mode) = m; break; }
          if (enabled[1] && id(normal_detail_light_mode) == 1)
            id(normal_light_cct_value_pct) = std::clamp<int>(light_state.color_temperature_step(), 0, 100);
          if (enabled[2] && id(normal_detail_light_mode) == 2)
            id(normal_light_rgb_value_pct) = std::clamp((int) light_state.rgb_tick, 0, esphome::onx_storage::RGB_TICKS - 1);
          id(normal_device_detail_online) = custom_logic::is_normal_ui_device_online(detail_index);

  - id: update_normal_detail_exit_ready_flags
    mode: restart
    then:
      - lambda: |-
          const uint32_t held_ms = millis() - id(key_press_started_ms);
          const int kind = id(normal_device_detail_kind);
          // With quick actions, a medium hold opens the list, so exit needs longer.
          const auto exit_entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          // An offline entity cannot open its list, so it closes at the normal time.
          const uint32_t exit_ms = id(normal_device_detail_online) && id(normal_ha_api_connected) &&
              onx_entity_config::playlists_for_ui(id(normal_device_detail_index), exit_entity) != nullptr ?
              onx_playlist::BACK_MS : 688u;
          if (kind == NORMAL_DEVICE_DETAIL_KIND_SWITCH || kind == NORMAL_DEVICE_DETAIL_KIND_PLUG || kind == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
            id(normal_detail_exit_switch_ready) = held_ms >= exit_ms;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_CURTAIN) {
            id(normal_detail_exit_switch_ready) = held_ms >= exit_ms;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = held_ms >= exit_ms;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_DIMMING_LIGHT) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = held_ms >= exit_ms;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_INPUT || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_CONNECTION) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = held_ms >= 688;
          } else {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          }

  - id: can_exit_normal_detail
    mode: restart
    then:
      - lambda: |-
          if (!id(normal_device_detail_active)) {
            id(normal_detail_exit_allowed) = false;
            return;
          }
          switch (id(normal_device_detail_kind)) {
            case NORMAL_DEVICE_DETAIL_KIND_SWITCH:
            case NORMAL_DEVICE_DETAIL_KIND_PLUG:
            case NORMAL_DEVICE_DETAIL_KIND_CURTAIN:
            case NORMAL_DEVICE_DETAIL_KIND_AUTOMATION:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_switch_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_LIGHT:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_light_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_DIMMING_LIGHT:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_light_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_INPUT:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_CONNECTION:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_settings_ready);
              break;
            default:
              id(normal_detail_exit_allowed) = false;
              break;
          }

