              const auto key = detail == nullptr ? std::string("") : onx_controls::setting(*detail);
              if (key == "volume_level") {
                // Preserve artwork and metadata on the primary volume screen.
                const auto split = last_trigger_text.find('\n');
                const auto value_end = last_trigger_text.find('\n', split + 1);
                last_trigger_text = "Volume: " + last_trigger_text.substr(split + 1, value_end - split - 1);
                lv_obj_set_y(id(normal_automation_detail_action), onx_geom::S(166));
