          lv_label_set_text(id(normal_settings_connection_status),
              id(normal_ha_api_connected) ? "Connected to Home Assistant" : "Waiting for Home Assistant");
          std::string url = "Open the device's Visit link";
          if (wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected()) {
            for (const auto &ip : wifi::global_wifi_component->get_ip_addresses()) {
              if (!ip.is_set()) continue;
              char address[network::IP_ADDRESS_BUFFER_SIZE] = {0};
              ip.str_to(address); url = std::string("Configure in browser:\nhttp://") + address + "/"; break;
            }
