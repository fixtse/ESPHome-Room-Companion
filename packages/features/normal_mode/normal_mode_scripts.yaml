script:
  - id: refresh_normal_standby_page
    mode: restart
    then:
      - lambda: |-
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };
          const bool wifi_connected = id(normal_wifi_connected);
          const bool ha_connected = id(api_server)->is_connected_with_state_subscription();
          set_hidden(id(standby_wifi_online_widget), !wifi_connected);
          set_hidden(id(standby_wifi_offline_widget), wifi_connected);
          set_hidden(id(standby_homeassistant_online_widget), !ha_connected);
          set_hidden(id(standby_homeassistant_offline_widget), ha_connected);
          const std::string &state = id(standby_weather_state);
          const bool known =
              state == "clear-night" ||
              state == "cloudy" ||
              state == "exceptional" ||
              state == "fog" ||
              state == "hail" ||
              state == "lightning" ||
              state == "lightning-rainy" ||
              state == "partlycloudy" ||
              state == "pouring" ||
              state == "rainy" ||
              state == "snowy" ||
              state == "snowy-rainy" ||
              state == "sunny" ||
              state == "windy" ||
              state == "windy-variant";
          set_hidden(id(standby_weather_unknown_widget), known);
          set_hidden(id(standby_weather_clear_night_widget), state != "clear-night");
          set_hidden(id(standby_weather_cloudy_widget), state != "cloudy");
          set_hidden(id(standby_weather_exceptional_widget), state != "exceptional");
          set_hidden(id(standby_weather_fog_widget), state != "fog");
          set_hidden(id(standby_weather_hail_widget), state != "hail");
          set_hidden(id(standby_weather_lightning_widget), state != "lightning");
          set_hidden(id(standby_weather_lightning_rainy_widget), state != "lightning-rainy");
          set_hidden(id(standby_weather_partlycloudy_widget), state != "partlycloudy");
          set_hidden(id(standby_weather_pouring_widget), state != "pouring");
          set_hidden(id(standby_weather_rainy_widget), state != "rainy");
          set_hidden(id(standby_weather_snowy_widget), state != "snowy");
          set_hidden(id(standby_weather_snowy_rainy_widget), state != "snowy-rainy");
          set_hidden(id(standby_weather_sunny_widget), state != "sunny");
          set_hidden(id(standby_weather_windy_widget), state != "windy");
          set_hidden(id(standby_weather_windy_variant_widget), state != "windy-variant");
      - lambda: |-
          onx_render::label(id(standby_temperature_widget), onx_clock_sensors::temperature_text(
              id(standby_weather_temperature), id(standby_weather_temperature_unit)).c_str());
          onx_render::label(id(standby_humidity_widget), onx_clock_sensors::humidity_text(
              id(standby_weather_humidity)).c_str());
      - lambda: |-
          // Sensor icons replace the defaults once downloaded; both fit 16 px.
          for (auto *w : {id(standby_temperature_icon_widget), id(standby_humidity_icon_widget)}) {
            if (lv_obj_get_width(w) != 16) {
              lv_obj_set_size(w, onx_geom::S(16), onx_geom::S(16));
              lv_image_set_inner_align(w, LV_IMAGE_ALIGN_CONTAIN);
            }
          }
          id(entity_icon_downloader)->bind(id(standby_temperature_icon_widget), onx_clock_sensors::first_icon(), id(standby_weather_temp_icon_img), false);
          id(entity_icon_downloader)->bind(id(standby_humidity_icon_widget), onx_clock_sensors::second_icon(), id(standby_weather_humidity_icon_img), false);
      - lambda: |-
          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
      - lambda: |-
          #ifndef USE_ROOM_COMPANION
          // The rectangular panels size the clock in onx_idle_clock.h.
          onx_render::style_text_font(id(standby_time_widget), onx_display_settings::datetime.hour_format == 1 && onx_display_settings::datetime.show_ampm ?
              id(fonts_MiSans_Medium_32)->get_lv_font() : id(fonts_MiSans_Bold_64)->get_lv_font(), 0);
          #endif
      - lambda: |-
          auto now = id(ha_time).now();
          const bool ready = id(ha_time_ready) && now.is_valid();
          onx_render::label(id(standby_time_widget), ready ? now.strftime(onx_display_settings::time_pattern()).c_str() : "--:--");
          onx_render::label(id(standby_date_widget), ready ? now.strftime(onx_display_settings::date_pattern()).c_str() : "----");
      - lambda: |-
          #ifdef USE_ROOM_COMPANION
          onx_render::apply_panel_palette(id(standby_page)->obj);
          onx_render::style_bg_color(id(standby_page)->obj,lv_color_hex(onx_display_settings::background()),0);
          #endif
      - lvgl.page.show: standby_page

  - id: request_normal_sensor_history
    mode: parallel
    max_runs: 2
    parameters:
      entity: string
    then:
      - if:
          condition:
            lambda: |-
              const int i=onx_sensor_view::index(entity);
              if(i<0 || !onx_sensor_view::configs[i].graph || !id(normal_ha_api_connected)) {
                ESP_LOGI("sensor_history","%s: not requested (index=%d graph=%d api=%d)",entity.c_str(),i,
                         i>=0?int(onx_sensor_view::configs[i].graph):-1,int(id(normal_ha_api_connected)));
                return false;
              }
              auto &s=onx_sensor_view::states[i];
              if(s.requested && millis()-s.requested_ms<300000)return false;
              ESP_LOGI("sensor_history","%s: requesting %s",entity.c_str(),onx_sensor_view::history_entity(entity).c_str());
              s.requested=s.pending=true;s.requested_ms=millis();return true;
          then:
            - homeassistant.action:
                action: recorder.get_statistics
                variables:
                  sensor_entity: !lambda return onx_sensor_view::history_entity(entity);
                  history_hours: !lambda return std::to_string(onx_sensor_view::states[onx_sensor_view::index(entity)].range_seconds / 3600);
                  history_period: !lambda |-
                    return onx_sensor_view::states[onx_sensor_view::index(entity)].range_seconds <= 43200 ? std::string("5minute") : std::string("hour");
                data_template:
                  statistic_ids: "{{ [sensor_entity] }}"
                  start_time: "{{ (now() - timedelta(hours=history_hours | int)).isoformat() }}"
                  period: "{{ history_period }}"
                  types: "{{ ['mean', 'state'] }}"
                capture_response: true
                response_template: !lambda |-
                  const auto history_entity=onx_sensor_view::history_entity(entity);
                  const auto range=onx_sensor_view::states[onx_sensor_view::index(entity)].range_seconds;
                  const std::string stride=range==604800 ? "3" : range==43200 ? "2" : "1";
                  return "{% set ns = namespace(points=[]) %}{% for p in response.get('statistics', response).get('"+history_entity+"', [])[::"+stride+"][:73] %}{% set y = p.get('mean') if p.get('mean') is not none else p.get('state') %}{% if y is number %}{% set ns.points = ns.points + [dict(t=as_timestamp(p['start']), y=y)] %}{% endif %}{% endfor %}{{ dict(points=ns.points) | to_json }}";
                on_success:
                  - lambda: |-
                      const int i=onx_sensor_view::index(entity);if(i<0)return;
                      auto &s=onx_sensor_view::states[i];s.pending=false;
                      for(JsonObjectConst p:response["response"]["points"].as<JsonArrayConst>())
                        if(p["t"].is<double>()&&p["y"].is<float>())s.sample(p["t"].as<uint32_t>(),p["y"].as<float>());
                      ESP_LOGI("sensor_history","%s (%s): %u points from statistics",entity.c_str(),
                               onx_sensor_view::history_entity(entity).c_str(),
                               unsigned(response["response"]["points"].as<JsonArrayConst>().size()));
                      id(refresh_normal_automation_detail_page).execute();
                on_error:
                  - lambda: |-
                      const int i=onx_sensor_view::index(entity);if(i>=0)onx_sensor_view::states[i].pending=false;
                      ESP_LOGW("sensor_history","%s: statistics request failed: %s",entity.c_str(),error.c_str());

  - id: request_normal_weather_forecast
    mode: parallel
    max_runs: 2
    parameters:
      entity: string
      force: bool
    then:
      - if:
          condition:
            lambda: |-
              auto *d = custom_logic_entity_sub::entity_detail(entity);
              if (!d || entity.rfind("weather.", 0) != 0 || !d->available || !id(normal_ha_api_connected)) return false;
              const uint32_t age = millis() - d->forecast_requested_ms;
              if (d->forecast_requested && (age < 20000 || (!force && age < 900000))) return false;
              d->forecast_requested = d->forecast_pending = true;
              d->forecast_requested_ms = millis();
              return true;
          then:
            - homeassistant.action:
                action: weather.get_forecasts
                data:
                  entity_id: !lambda return entity;
                  type: daily
                capture_response: true
                response_template: !lambda |-
                  // Keep a native mapping: JSON null/true/false prevent HA's native
                  // template parser from recognizing an object and produce a string.
                  return "{% set ns = namespace(days=[]) %}{% for f in response.get('" + entity + "', {}).get('forecast', [])[:5] %}{% set ns.days = ns.days + [dict(date=f.get('datetime',''), condition=f.get('condition',''), high=f.get('temperature'), low=f.get('templow'), rain=f.get('precipitation_probability'))] %}{% endfor %}{{ dict(days=ns.days) }}";
                on_success:
                  - lambda: |-
                      auto *d = custom_logic_entity_sub::entity_detail(entity);
                      if (!d) return;
                      d->forecast_pending = false;
                      d->forecast_count = 0;
                      for (JsonObjectConst day : response["response"]["days"].as<JsonArrayConst>()) {
                        if (d->forecast_count >= 5) break;
                        auto &f = d->forecast[d->forecast_count++];
                        f.date = std::string(day["date"] | "").substr(0, 32);
                        f.condition = std::string(day["condition"] | "").substr(0, 40);
                        auto number = [](JsonVariantConst v) -> std::string {
                          if (v.isNull() || (!v.is<float>() && !v.is<int>())) return "";
                          return onx_detail_view::compact(std::to_string(v.as<float>()));
                        };
                        f.high = number(day["high"]); f.low = number(day["low"]); f.rain = number(day["rain"]);
                      }
                      d->forecast_failed = d->forecast_count == 0;
                      d->weather_page = std::min(d->weather_page, 2 + d->forecast_count);
                      id(refresh_normal_automation_detail_page).execute();
                on_error:
                  - lambda: |-
                      auto *d = custom_logic_entity_sub::entity_detail(entity);
                      if (d) { d->forecast_pending = false; d->forecast_failed = true; }
                      id(refresh_normal_automation_detail_page).execute();

  - id: enter_sleep_mode
    mode: restart
    then:
      - lambda: |-
          if (id(sleep_mode_state)) {
            return;
          }
          id(sleep_mode_state) = true;
          id(sleep_wakeup_pending) = false;
      - switch.turn_on: ha_screen_off
  - id: exit_sleep_mode
    mode: restart
    then:
      - lambda: |-
          if (!id(sleep_mode_state)) {
            return;
          }
          id(sleep_mode_state) = false;
          id(sleep_wakeup_pending) = false;
      - switch.turn_off: ha_screen_off
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
  - id: exit_standby_mode
    mode: restart
    then:
      - lambda: |-
          id(standby_wakeup_pending) = false;
      - switch.turn_off: ha_screen_off
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
  - id: refresh_normal_ha_connection_state
    mode: restart
    then:
      - lambda: |-
          const bool ha_connected =
              id(api_server)->is_connected_with_state_subscription();
          if (id(normal_ha_api_connected) == ha_connected) {
            return;
          }

          id(normal_ha_api_connected) = ha_connected;
          if (!ha_connected) {
            custom_logic_entity_sub::cancel_controls();
            for(auto &secondary:onx_sensor_view::states){secondary.received=false;secondary.available=false;}
            for (auto &detail : custom_logic_entity_sub::entity_details) {
              detail.received = false;
              detail.available = false;
            }
          }
          if (ha_connected) {
            id(normal_ha_added) = true;
          }

          if (ha_connected) {
            lv_obj_clear_flag(id(standby_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(standby_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(standby_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(standby_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          }

          if (id(ui_presenter)->is_normal_mode_active() &&
              !id(ui_presenter)->is_standby_active() &&
              id(normal_page_index) == 0 &&
              !id(normal_device_detail_active)) {
            id(show_normal_device_entry_page).execute(0);
          }
          id(refresh_normal_device_page).execute();
          id(refresh_normal_switch_detail_page).execute();
          id(refresh_normal_automation_detail_page).execute();
          id(refresh_normal_light_detail_page).execute();
          id(refresh_normal_curtain_detail_page).execute();
  - id: refresh_normal_device_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              id(normal_page_index) != 0 || id(normal_device_detail_active) ||
              id(screen_off_state) || id(sleep_mode_state) || onx_notification::current.visible) {
            onx_navigation::hide();
            lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          #ifdef USE_ROOM_COMPANION
          if (onx_panel_detail::timers.overlay) { onx_navigation::hide(); return; }
          #endif
          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT) total = 20;
          const int last_selectable = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;

          int selected = id(normal_device_selected_index);
          if (selected < 0) selected = 0;
          if (selected > last_selectable) selected = last_selectable;
          if (!onx_timer::popup.visible) selected = onx_entity_config::carousel_selection(selected,total);
          id(normal_device_selected_index) = selected;

          // Shared selection/state stays here; only the native panel draws cards.
          if (onx_notification_ui::panel_open || onx_notification_ui::detail_id != 0) return;
          const bool empty = total == 0 && selected == 0;
          auto show = [](lv_obj_t *obj, bool visible) {
            if (visible) lv_obj_remove_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          show(id(normal_device_wifi_online_widget), !empty && id(normal_wifi_connected));
          show(id(normal_device_wifi_offline_widget), !empty && !id(normal_wifi_connected));
          show(id(normal_device_homeassistant_online_widget), !empty && id(normal_ha_api_connected));
          show(id(normal_device_homeassistant_offline_widget), !empty && !id(normal_ha_api_connected));
          if (empty) { onx_navigation::hide(); return; }
          const bool settings = selected >= total;
          const auto entity = settings ? std::string() : id(ui_presenter)->get_normal_device_entity_id(selected);
          auto title = settings ? std::string("Settings") : ha_entity_title_from_registry_cache(entity);
          if (title.empty()) title = entity;
          #ifdef USE_ROOM_COMPANION
          if (const auto *page = settings ? nullptr : onx_panel_pages::info(entity); page != nullptr && page->name[0]) title = page->name;
          #endif
          auto dock_entries=onx_entity_config::carousel_entries(total);
          #ifdef USE_ROOM_COMPANION
          if (esphome::room_companion::global_panel) {
            const auto &dash=esphome::room_companion::global_panel->stream_settings();
            onx_navigation::pin_right=dash.toolbar_side=="right";
            onx_navigation::pinned_target=onx_navigation::NO_TARGET;
            if(!dash.url.empty()) {
              dock_entries.push_back(onx_navigation::DASHBOARD);
              if(dash.dock_pin=="dashboard")onx_navigation::pinned_target=onx_navigation::DASHBOARD;
            }
            for(const int entry:dock_entries)
              if(entry>=0 && entry<total && id(ui_presenter)->get_normal_device_entity_id(entry)==dash.dock_pin)
                onx_navigation::pinned_target=entry;
          }
          #endif
          onx_navigation::render(std::move(dock_entries), selected,
              [&](lv_obj_t *icon, int index, bool active) {
                #ifdef USE_ROOM_COMPANION
                if(index==onx_navigation::DASHBOARD) {
                  lv_image_set_src(icon,id(panel_dashboard_icon)->get_lv_image_dsc());
                  lv_image_set_scale(icon,onx_navigation::icon_size()*256/id(panel_dashboard_icon)->get_width());
                  lv_obj_set_style_image_recolor(icon,lv_color_hex(onx_display_settings::foreground()),0);
                  lv_obj_set_style_image_recolor_opa(icon,LV_OPA_COVER,0);
                  return;
                }
                #endif
                if (index == total) {
                  onx_render::image(icon, id(normal_device_icon_settings_img)->get_lv_image_dsc());
                  lv_image_set_scale(icon, onx_geom::S(onx_navigation::icon_size()) * 256 / id(normal_device_icon_settings_img)->get_width());
                  onx_render::style_image_recolor(icon, lv_color_hex(active ? onx_display_settings::accent() : 0xFFFFFF), 0);
                  onx_render::style_image_recolor_opa(icon, LV_OPA_COVER, 0);
                } else {
                  #ifdef USE_ROOM_COMPANION
                  // Pages carry their own carousel icon.
                  const auto *page = onx_panel_pages::info(id(ui_presenter)->get_normal_device_entity_id(index));
                  if (page && onx_panel_pages::bind_carousel_artwork(icon,*page)) return;
                  if (page && std::strcmp(page->icon,onx_panel_pages::ENTITY_ICON)!=0 && (page->icon[0] || onx_panel_pages::Kind(page->kind)==onx_panel_pages::Kind::ACTION_GRID)) {
                    const bool grid=onx_panel_pages::Kind(page->kind)==onx_panel_pages::Kind::ACTION_GRID;
                    auto *fallback=grid?id(panel_action_grid_icon):id(fallback_toggle_switch_img);
                    if(page->icon[0]) {
                      id(entity_icon_downloader)->bind(icon,page->icon,fallback,active);
                    } else {
                      lv_image_set_src(icon,fallback->get_lv_image_dsc());
                      lv_obj_set_style_image_recolor(icon,lv_color_hex(active?onx_display_settings::accent():onx_display_settings::foreground()),0);
                    }
                    onx_render::style_image_recolor(icon,lv_color_hex(active?onx_display_settings::accent():onx_display_settings::foreground()),0);
                    onx_render::style_image_recolor_opa(icon, LV_OPA_COVER, 0);
                    lv_image_set_scale(icon, onx_navigation::icon_size() * 256 / 80);
                    return;
                  }
                  #endif
                  onx_render::style_image_recolor_opa(icon, LV_OPA_COVER, 0);
                  id(apply_normal_entity_icon).execute(icon, id(ui_presenter)->get_normal_device_entity_id(index),
                      id(ui_presenter)->get_normal_device_type(index), active);
                  onx_render::style_image_recolor(icon,lv_color_hex(active?onx_display_settings::accent():onx_display_settings::foreground()),0);
                  lv_image_set_scale(icon, onx_navigation::icon_size() * 256 / 80);
                }
              });
          onx_navigation::set_label(title.c_str());

  - id: show_normal_device_entry_page
    mode: restart
    parameters:
      direction: int
    then:
      - script.execute: refresh_normal_device_page
      - lambda: |-
          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT) total = 20;
          const int last_selectable = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;
          int selected = id(normal_device_selected_index);
          if (selected < 0) selected = 0;
          if (selected > last_selectable) selected = last_selectable;
          if (!onx_timer::popup.visible) selected = onx_entity_config::carousel_selection(selected,total);
          id(normal_device_selected_index) = selected;

          lv_obj_t *target = id(normal_panel_page)->obj;
          if (total == 0 && selected == 0) {
            target = id(normal_ha_added) ? id(device_empty)->obj : id(normal_add_hmi_page)->obj;
          } else if (total == 0 && !id(normal_ha_added) && selected == 1) {
            target = id(normal_setup_help_page)->obj;
          }

          // One screen owns the native carousel; selecting an entity never loads
          // or refreshes an older entity body underneath it.
          onx_render::apply_panel_palette(target);
          onx_render::style_bg_color(target, lv_color_hex(onx_display_settings::background()), 0);
          if (lv_scr_act() != target) lv_scr_load(target);
          if (target == id(normal_panel_page)->obj) {
            if (selected < total) {
              onx_panel_pages::render(id(ui_presenter)->get_normal_device_entity_id(selected),
                  onx_panel_ui::width, onx_panel_ui::height, false,
                  [](lv_obj_t *icon, const std::string &entity) { id(apply_normal_entity_icon).execute(icon, entity, "", false); });
            } else onx_panel_pages::render_settings(onx_panel_ui::width, onx_panel_ui::height);
          } else onx_panel_pages::hide();


  - id: refresh_normal_switch_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              (id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_SWITCH &&
               id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_PLUG)) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);


          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 19) {
            detail_index = 19;
          }

          const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
          if (device_title.empty()) {
            device_title = device_entity_id;
          }

          auto local_hmi_gpio_switch_state = [&](const std::string &entity_id, bool *state) -> bool {
            switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
              case custom_logic::PANEL_LOCAL_DASHBOARD:
              case custom_logic::PANEL_LOCAL_ASSIST:
                *state = onx_navigation::local_state && onx_navigation::local_state(local_hmi_gpio_switch_io_from_entity_id(entity_id));
                return true;
              default:
                return false;
            }
          };

          bool is_on = id(app_storage)->get_normal_ui_device_state(detail_index);
          const bool is_local_gpio_switch = local_hmi_gpio_switch_state(device_entity_id, &is_on);
          if (is_local_gpio_switch) {
            id(app_storage)->set_normal_ui_device_state(detail_index, is_on);
          }
          id(normal_device_detail_is_on) = is_on;
          std::string state_text = is_on ? "ON" : "OFF";

          lv_obj_t *page = id(normal_switch_page)->obj;
          lv_obj_t *shell = id(normal_switch_detail_shell);
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          if (is_on) {
            onx_render::style_bg_color(page, lv_color_hex(0x54524F), 0);
            onx_render::style_bg_color(shell, lv_color_hex(0x54524F), 0);
            onx_render::style_border_width(shell, 0, 0);
            onx_render::style_text_color(id(normal_switch_detail_state), lv_color_hex(0xFFFFFF), 0);
            onx_render::style_text_color(id(normal_switch_detail_title), lv_color_hex(0xFFFFFF), 0);
          } else {
            onx_render::style_bg_color(page, lv_color_hex(0x272727), 0);
            onx_render::style_bg_color(shell, lv_color_hex(0x272727), 0);
            onx_render::style_border_width(shell, 0, 0);
            onx_render::style_text_color(id(normal_switch_detail_state), lv_color_hex(0xFFFFFF), 0);
            onx_render::style_text_color(id(normal_switch_detail_title), lv_color_hex(0xD2D2D2), 0);
          }
          if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SWITCH) {
            set_hidden(id(normal_device_detail_plug_on), true);
            set_hidden(id(normal_device_detail_plug_off), true);
            set_hidden(id(normal_device_detail_light_on), true);
            set_hidden(id(normal_device_detail_light_off), true);
            set_hidden(id(normal_device_detail_switch_on), !is_on);
            set_hidden(id(normal_device_detail_switch_off), is_on);
          } else if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_PLUG) {
            set_hidden(id(normal_device_detail_plug_on), !is_on);
            set_hidden(id(normal_device_detail_plug_off), is_on);
            set_hidden(id(normal_device_detail_light_on), true);
            set_hidden(id(normal_device_detail_light_off), true);
            set_hidden(id(normal_device_detail_switch_on), true);
            set_hidden(id(normal_device_detail_switch_off), true);
          }

          lv_label_set_text(id(normal_switch_detail_state), state_text.c_str());
          onx_render::label(id(normal_switch_detail_title), device_title.c_str());
          lv_obj_t *sw = id(hmi_gui_switch);
          if (is_on) {
            lv_obj_add_state(sw, LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(sw, LV_STATE_CHECKED);
          }
          const bool is_online = is_local_gpio_switch ||
                                 ((detail_index >= 0 && detail_index < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT)
                                      ? ((id(normal_device_online_mask) & (1ull << detail_index)) != 0)
                                      : true);
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay = !is_local_gpio_switch &&
                                               (!id(normal_wifi_connected) ||
                                               !id(normal_ha_api_connected) ||
                                               !is_online);
          set_hidden(id(normal_switch_detail_offline_overlay), !show_connection_overlay);
          const char *offline_text = !id(normal_wifi_connected)
                                         ? "WiFi disconnected"
                                         : (!id(normal_ha_api_connected) ? "Home Assistant\ndisconnected" : custom_logic_entity_sub::entity_offline_text(device_entity_id));
          lv_label_set_text(id(normal_switch_detail_offline_text), offline_text);

      - lambda: |-
          if (!id(normal_device_detail_active) || (id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_SWITCH && id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_PLUG)) return;
          lv_obj_add_flag(id(normal_device_detail_switch_on), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_detail_switch_off), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_detail_plug_on), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_detail_plug_off), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_detail_light_on), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_detail_light_off), LV_OBJ_FLAG_HIDDEN);
          const int slot = std::clamp(id(normal_device_detail_index), 0, 19);
          id(apply_normal_entity_icon).execute(id(normal_switch_entity_icon),
              id(ui_presenter)->get_normal_device_entity_id(slot),
              id(ui_presenter)->get_normal_device_type(slot), id(normal_device_detail_is_on));

  - id: refresh_normal_automation_detail_page
