                if (id(touch_input)->suppress_click()) return;
                const auto index = reinterpret_cast<intptr_t>(lv_event_get_user_data(event));
                id(normal_settings_selected_index) = index;
                id(ui_presenter)->notify_user_activity();
                switch (index) {
                  case 0: id(enter_normal_settings_connection).execute(); break;
                  case 1: id(enter_normal_settings_wifi_detail).execute(); break;
                  case 2: id(enter_normal_settings_brightness_detail).execute(); break;
                  case 3: id(enter_normal_settings_input_detail).execute(); break;
                  case 4:
                    {
                      static const uint32_t colors[]={0x101418,0x000000,0x232323,0x14283D,0x23372C,0xF4F4F4};
                      const auto current=onx_display_settings::background();size_t next=0;
                      for(size_t i=0;i<std::size(colors);++i)if(colors[i]==current)next=(i+1)%std::size(colors);
                      if(onx_entity_config::save_background_color(onx_display_settings::color_text(colors[next]))) {
                        onx_render::remember_panel_colors();
                        onx_render::apply_panel_palette(id(normal_settings_page)->obj);
                      }
                      const auto label=std::string("Background ")+onx_display_settings::color_text(onx_display_settings::background());
                      lv_label_set_text(lv_obj_get_child(static_cast<lv_obj_t *>(lv_event_get_target(event)), 0),label.c_str());
                    }
                    break;
                }
              }, LV_EVENT_CLICKED, reinterpret_cast<void *>(static_cast<intptr_t>(i)));
            }
          }
          const auto background_label=std::string("Background ")+onx_display_settings::color_text(onx_display_settings::background());
          lv_label_set_text(lv_obj_get_child(lv_obj_get_child(menu, 4), 0),background_label.c_str());
          return;
          #endif

          onx_render::settings_roller(roller,id(fonts_MiSans_Medium_16)->get_lv_font(),
              id(fonts_MiSans_Medium_18)->get_lv_font());

          lv_roller_set_selected(roller, selected, LV_ANIM_OFF);
          lv_obj_align_to(arrow, roller, LV_ALIGN_CENTER, onx_geom::S(85), 0);

