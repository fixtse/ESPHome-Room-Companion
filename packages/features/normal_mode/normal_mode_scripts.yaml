          if (entity_id.rfind("media_player.", 0) == 0)
            onx_render::style_text_font(id(normal_automation_detail_action), id(fonts_MiSans_Medium_18)->get_lv_font(), 0);
          // The same presentation model supplies the browser's live preview.
