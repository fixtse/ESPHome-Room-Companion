  - id: enter_normal_switch_detail
    mode: restart
    then:
      - lambda: |-
          int raw_selected_index = id(normal_device_selected_index);
          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT) total = (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT;
          const int settings_index = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;
          if (total == 0 && raw_selected_index == 0) {
            ESP_LOGI("normal_mode", "detail entry ignored: empty list page has no detail");
            return;
          }
          // Panel-local controls act on press instead of opening a detail page.
          if (onx_navigation::local_action && raw_selected_index >= 0 && raw_selected_index < total &&
              onx_navigation::local_action(id(ui_presenter)->get_normal_device_entity_id(raw_selected_index))) {
            return;
          }
          int detail_index = raw_selected_index;
          if (detail_index < 0) {
            detail_index = 0;
          }

          std::string device_type = id(ui_presenter)->get_normal_device_type(detail_index);

          auto lower = [](std::string s) {
            for (char &c : s) {
              if (c >= 'A' && c <= 'Z') c = c - 'A' + 'a';
            }
            return s;
          };
          if (device_type.empty()) {
            device_type = "switch";
          }
          device_type = lower(device_type);
          int detail_kind = NORMAL_DEVICE_DETAIL_KIND_NONE;
          if (raw_selected_index == settings_index) {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_SETTINGS;
          } else if (device_type == "switch") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_SWITCH;
          } else if (device_type == "plug" || device_type == "chazuo") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_PLUG;
          } else if (device_type == "light" || device_type == "liang" ||
                     device_type == "dimming_light" || device_type == "dimmable_light" || device_type == "dimming") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_LIGHT;
          } else if (device_type == "curtain" || device_type == "cover") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_CURTAIN;
          } else if (device_type == "automation" || device_type == "sensor" || device_type == "binary_sensor" || device_type == "climate" || device_type == "script" || device_type == "weather" || device_type == "timer" || device_type == "media_player" || device_type == "fan" || device_type == "number" || device_type == "input_number" || device_type == "select" || device_type == "input_select" || device_type == "scene" || device_type == "button" || device_type == "input_button") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_AUTOMATION;
          }
          const auto graph_entity=id(ui_presenter)->get_normal_device_entity_id(detail_index);
          // Newer domains have no stored type option; their detail screens follow the entity.
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_NONE && raw_selected_index != settings_index) {
            for (const char *pre : {"camera.", "vacuum.", "lock.", "alarm_control_panel.", "siren.", "event."})
              if (graph_entity.rfind(pre, 0) == 0) { detail_kind = NORMAL_DEVICE_DETAIL_KIND_AUTOMATION; break; }
          }
          const int graph_index=onx_sensor_view::index(graph_entity);
          if(graph_entity.rfind("switch.",0)==0 && graph_index>=0 && onx_sensor_view::configs[graph_index].secondary[0] && onx_sensor_view::configs[graph_index].graph)
            detail_kind=NORMAL_DEVICE_DETAIL_KIND_AUTOMATION;
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_NONE) {
            ESP_LOGI("normal_mode",
                     "detail entry ignored: selected item is not a switch, plug, light, curtain or automation");
            return;
          }

          if (detail_index > 19) {
            detail_index = 19;
          }

          id(normal_device_detail_index) = (detail_kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS) ? -1 : detail_index;
          onx_navigation::hide();
          id(normal_device_detail_active) = true;
          id(normal_device_detail_kind) = detail_kind;
          id(normal_page_index) = 1;
          // Automatic media/timer entry has no button press to clear the old
          // exit latch. A new detail view must accept wheel input immediately.
          id(detail_long_press_exit_fired) = false;
          id(key_long_press_handled) = true;
          id(normal_detail_exit_switch_ready) = false;
          id(normal_detail_exit_light_ready) = false;
          id(normal_detail_exit_settings_ready) = false;
          id(normal_detail_exit_allowed) = false;
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS) {
            id(normal_settings_selected_index) = 0;
            ESP_LOGI("normal_mode", "settings detail opened");
            lv_scr_load(id(normal_settings_page)->obj);
            id(refresh_normal_settings_detail_page).execute();
            return;
          }
          std::string detail_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          if (detail_entity_id.rfind("media_player.", 0) == 0) {
            // A stop/off transition on the main page must not prevent opening this
            // player's detail page. Only transitions after entry may close it.
            if (auto *media = custom_logic_entity_sub::entity_detail(detail_entity_id)) {
              media->media_player_off_transition_pending = false;
              media->media_player_stop_ms = 0;
            }
          }
          auto local_hmi_gpio_switch_state = [&](const std::string &entity_id, bool *state) -> bool {
            switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
              case custom_logic::PANEL_LOCAL_DASHBOARD:
              case custom_logic::PANEL_LOCAL_ASSIST:
                *state = onx_navigation::local_state && onx_navigation::local_state(local_hmi_gpio_switch_io_from_entity_id(entity_id));
                return true;
              default:
                return false;
            }
          };
          bool detail_is_on = id(app_storage)->get_normal_ui_device_state(detail_index);
          const bool is_local_gpio_switch = detail_kind == NORMAL_DEVICE_DETAIL_KIND_SWITCH && local_hmi_gpio_switch_state(detail_entity_id, &detail_is_on);
          if (is_local_gpio_switch) {
            id(app_storage)->set_normal_ui_device_state(detail_index, detail_is_on);
          }
          id(normal_device_detail_is_on) = detail_is_on;
          id(hmi_switch_state) = id(normal_device_detail_is_on);
          id(normal_device_detail_online) = (detail_kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS)
                                                 ? true
                                                 : (is_local_gpio_switch ||
                                                    ((detail_index >= 0 && detail_index < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT)
                                                        ? (custom_logic::is_normal_ui_device_online(detail_index))
                                                        : true));
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_CURTAIN) {
            const int feedback_position = std::clamp((int) id(app_storage)->get_normal_ui_device_position(detail_index), 0, 100);
            id(normal_device_detail_curtain_feedback_position) = feedback_position;
            id(normal_device_detail_curtain_target_position) = feedback_position;
            id(normal_device_detail_curtain_adjust_active) = false;
            lv_scr_load(id(normal_detail_page)->obj);
            id(refresh_normal_curtain_detail_page).execute();
            return;
          }
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
            id(normal_detail_light_mode) = 0;
            auto detail_slot = id(app_storage)->normal_device_slot(detail_index);
            auto light_state = detail_slot.light();
            int mode_count = 0;
            if (light_state.custom_supports_brightness()) mode_count++;
            if (light_state.custom_supports_color_temperature()) mode_count++;
            if (light_state.custom_supports_rgb()) mode_count++;
            id(normal_detail_light_mode_count) = mode_count;
            int cct_value_pct = (int) light_state.color_temperature_step();
            id(normal_light_cct_value_pct) = std::clamp(cct_value_pct, 0, 100);
            int rgb_value_pct = (int) light_state.rgb_tick;
            id(normal_light_rgb_value_pct) = std::clamp(rgb_value_pct, 0, esphome::onx_storage::RGB_TICKS - 1);
            id(normal_clear_wifi_allowed) = true;
            ESP_LOGI("normal_mode", "light detail opened for index=%d", detail_index);
            lv_scr_load(id(normal_detail_page)->obj);
            id(refresh_normal_light_detail_page).execute();
            return;
          }
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
            const auto weather_entity = id(ui_presenter)->get_normal_device_entity_id(detail_index);
            const int sensor_index=onx_sensor_view::index(weather_entity);
            if(sensor_index>=0 && onx_sensor_view::configs[sensor_index].graph) id(request_normal_sensor_history).execute(weather_entity);
            if (weather_entity.rfind("weather.", 0) == 0) {
              auto *d = custom_logic_entity_sub::entity_detail(weather_entity);
              if (d) d->weather_page = 0;
              id(request_normal_weather_forecast).execute(weather_entity);
            }
            id(normal_automation_press_feedback_active) = false;
            ESP_LOGI("normal_mode", "automation detail opened for index=%d", detail_index);
            lv_scr_load(id(normal_detail_page)->obj);
            id(refresh_normal_automation_detail_page).execute();
            return;
          }
          ESP_LOGI("normal_mode", "switch detail opened for index=%d", detail_index);
          lv_scr_load(id(normal_detail_page)->obj);
          id(refresh_normal_switch_detail_page).execute();

  - id: enter_normal_light_detail_mode_switching
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: |-
              return !id(screen_off_state) &&
                     id(key_btn).state &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     !id(ui_presenter)->is_standby_active() &&
                     !id(detail_long_press_exit_fired) &&
                     !id(key_long_press_handled) &&
                     id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT &&
                     id(normal_detail_light_mode_count) > 0 &&
                     !id(normal_detail_light_mode_adjusting);
          then:
            - lambda: |-
                id(normal_detail_light_mode_adjusting) = true;
                id(normal_clear_wifi_allowed) = false;
                ESP_LOGI("normal_mode", "light detail mode switching entered");
            - script.execute: refresh_normal_light_detail_page
            - lambda: |-
                id(ui_presenter)->notify_user_activity();

  - id: emit_normal_dimming_light_event
    mode: restart
    parameters:
      detail_index: int
      brightness_pct: int
      is_on: bool
    then:
      - lambda: |-
          int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::begin_normal_light_feedback_window(
              index, custom_logic::NORMAL_LIGHT_FEEDBACK_BRIGHTNESS, is_on, brightness_pct);
      - delay: 178ms
      - lambda: |-
          int index = detail_index;
          if (index < 0) index = 0;
          if (index > 19) index = 19;
          int brightness = std::clamp(brightness_pct, 0, 100);
          ESP_LOGI("normal_mode", "dimming light direct control: index=%d brightness=%d state=%s",
                   index, brightness, is_on ? "ON" : "OFF");
      - if:
          condition:
            lambda: |-
              int index = detail_index;
              if (index < 0) index = 0;
              if (index > 19) index = 19;
              return !id(ui_presenter)->get_normal_device_entity_id(index).empty();
          then:
            - if:
                condition:
                  lambda: |-
                    return !is_on;
                then:
                  - homeassistant.service:
                      service: light.turn_off
                      data_template:
                        entity_id: "{{ target_entity_id }}"
                      variables:
                        target_entity_id: !lambda |-
                          int index = detail_index;
                          if (index < 0) index = 0;
                          if (index > 19) index = 19;
                          return id(ui_presenter)->get_normal_device_entity_id(index);
                else:
                  - homeassistant.service:
                      service: light.turn_on
                      data_template:
                        entity_id: "{{ target_entity_id }}"
                        brightness_pct: "{{ target_brightness }}"
                      variables:
                        target_entity_id: !lambda |-
                          int index = detail_index;
                          if (index < 0) index = 0;
                          if (index > 19) index = 19;
                          return id(ui_presenter)->get_normal_device_entity_id(index);
                        target_brightness: !lambda |-
                          int brightness = std::clamp(brightness_pct, 0, 100);
                          return brightness;
      - delay: 935ms
      - lambda: |-
          const int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::flush_normal_light_feedback_window(
              index, id(ui_presenter)->get_normal_device_entity_id(index));
      - script.execute: refresh_normal_light_detail_page

  - id: emit_normal_cct_light_event
    mode: restart
    parameters:
      detail_index: int
      color_temperature: int
    then:
      - lambda: |-
          int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::begin_normal_light_feedback_window(
              index, custom_logic::NORMAL_LIGHT_FEEDBACK_COLOR_TEMPERATURE, true, color_temperature);
      - delay: 178ms
      - lambda: |-
          int index = detail_index;
          if (index < 0) index = 0;
          if (index > 19) index = 19;
          auto light_state = id(app_storage)->normal_device_slot(index).light();
          int cct_min_kelvin = (int) light_state.min_color_temperature_kelvin;
          int cct_max_kelvin = (int) light_state.max_color_temperature_kelvin;
          int cct_kelvin = color_temperature;
          if (cct_min_kelvin > 0 && cct_max_kelvin > 0) {
            if (cct_min_kelvin > cct_max_kelvin) {
              const int tmp = cct_min_kelvin;
              cct_min_kelvin = cct_max_kelvin;
              cct_max_kelvin = tmp;
            }
            cct_kelvin = std::clamp(cct_kelvin, cct_min_kelvin, cct_max_kelvin);
          }
          ESP_LOGI("normal_mode", "light direct control cct: index=%d color_temperature_kelvin=%d",
                   index, cct_kelvin);
      - if:
          condition:
            lambda: |-
              int index = detail_index;
              if (index < 0) index = 0;
              if (index > 19) index = 19;
              return !id(ui_presenter)->get_normal_device_entity_id(index).empty();
          then:
            - homeassistant.service:
                service: light.turn_on
                data_template:
                  entity_id: "{{ target_entity_id }}"
                  color_temp_kelvin: "{{ target_color_temperature_kelvin }}"
                variables:
                  target_entity_id: !lambda |-
                    int index = detail_index;
                    if (index < 0) index = 0;
                    if (index > 19) index = 19;
                    return id(ui_presenter)->get_normal_device_entity_id(index);
                  target_color_temperature_kelvin: !lambda |-
                    int index = detail_index;
                    if (index < 0) index = 0;
                    if (index > 19) index = 19;
                    auto light_state = id(app_storage)->normal_device_slot(index).light();
                    int cct_min_kelvin = (int) light_state.min_color_temperature_kelvin;
                    int cct_max_kelvin = (int) light_state.max_color_temperature_kelvin;
                    int cct_kelvin = color_temperature;
                    if (cct_min_kelvin > 0 && cct_max_kelvin > 0) {
                      if (cct_min_kelvin > cct_max_kelvin) {
                        const int tmp = cct_min_kelvin;
                        cct_min_kelvin = cct_max_kelvin;
                        cct_max_kelvin = tmp;
                      }
                      cct_kelvin = std::clamp(cct_kelvin, cct_min_kelvin, cct_max_kelvin);
                    }
                    return cct_kelvin;
      - delay: 935ms
      - lambda: |-
          const int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::flush_normal_light_feedback_window(
              index, id(ui_presenter)->get_normal_device_entity_id(index));
      - script.execute: refresh_normal_light_detail_page

  - id: emit_normal_rgb_light_event
    mode: restart
    parameters:
      detail_index: int
      rgb_value_pct: int
    then:
      - lambda: |-
          int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::begin_normal_light_feedback_window(
              index, custom_logic::NORMAL_LIGHT_FEEDBACK_RGB, true, rgb_value_pct);
      - delay: 178ms
      - lambda: |-
          int index = detail_index;
          if (index < 0) index = 0;
          if (index > 19) index = 19;
          int rgb_tick = std::clamp(rgb_value_pct, 0, esphome::onx_storage::RGB_TICKS - 1);
          int hue = (rgb_tick * esphome::onx_storage::RGB_TICK_DEGREES) % 360;
          int saturation = 100;
          ESP_LOGI("normal_mode", "light direct control rgb: index=%d hue=%d saturation=%d",
                   index, hue, saturation);
      - if:
          condition:
            lambda: |-
              int index = detail_index;
              if (index < 0) index = 0;
              if (index > 19) index = 19;
              return !id(ui_presenter)->get_normal_device_entity_id(index).empty();
          then:
            - homeassistant.service:
                service: light.turn_on
                data_template:
                  entity_id: "{{ target_entity_id }}"
                  hs_color: !lambda |-
                    static char hs_buf[32];
                    int rgb_tick = std::clamp(rgb_value_pct, 0, esphome::onx_storage::RGB_TICKS - 1);
                    int hue = (rgb_tick * esphome::onx_storage::RGB_TICK_DEGREES) % 360;
                    int saturation = 100;
                    sprintf(hs_buf, "[%d,%d]", hue, saturation);
                    return hs_buf;
                variables:
                  target_entity_id: !lambda |-
                    int index = detail_index;
                    if (index < 0) index = 0;
                    if (index > 19) index = 19;
                    return id(ui_presenter)->get_normal_device_entity_id(index);
      - delay: 935ms
      - lambda: |-
          const int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::flush_normal_light_feedback_window(
              index, id(ui_presenter)->get_normal_device_entity_id(index));
      - script.execute: refresh_normal_light_detail_page

  - id: toggle_normal_switch_detail
    mode: restart
    then:
      - lambda: |-
          if (!id(normal_device_detail_active)) {
            return;
          }
          const bool new_state = !id(app_storage)->get_normal_ui_device_state(id(normal_device_detail_index));
          if (!id(app_storage)->set_normal_ui_device_state(id(normal_device_detail_index), new_state)) {
            ESP_LOGW("normal_mode", "detail toggled failed: unable to persist state for index=%d", id(normal_device_detail_index));
            return;
          }
          id(normal_device_detail_is_on) = new_state;
          id(hmi_switch_state) = new_state;
          ESP_LOGI("normal_mode", "detail toggled: %s", new_state ? "ON" : "OFF");
      - script.execute: refresh_normal_switch_detail_page

  - id: exit_normal_switch_detail
    mode: restart
    then:
      - lambda: |-
          if (onx_media::idle_popup.previous_index >= 0) {
            id(normal_device_selected_index) = onx_media::idle_popup.previous_index;
            onx_media::idle_popup.previous_index = -1;
          }
          onx_media::idle_popup.visible = false;
          if (onx_timer::popup.visible) {onx_timer::popup.visible=false;onx_timer::popup.dismissed=true;}
          if (!id(normal_device_detail_active)) {
            return;
          }
          custom_logic_entity_sub::cancel_controls();
          id(normal_device_detail_active) = false;
          id(normal_device_detail_kind) = NORMAL_DEVICE_DETAIL_KIND_NONE;
          id(normal_page_index) = 0;
          id(normal_detail_exit_switch_ready) = false;
          id(normal_detail_exit_light_ready) = false;
          id(normal_device_detail_curtain_adjust_active) = false;
          id(normal_device_detail_curtain_adjust_pending) = false;
          id(normal_detail_light_mode_adjusting) = false;
          id(normal_detail_light_mode_rotated) = false;
          id(normal_detail_light_mode) = 0;
          id(normal_detail_light_mode_count) = 0;
          id(normal_automation_press_feedback_active) = false;
          id(normal_detail_exit_settings_ready) = false;
          id(normal_detail_exit_allowed) = false;
          id(key_long_press_handled) = true;
          id(normal_clear_wifi_allowed) = true;
          id(normal_device_detail_online) = true;
          // Return to the page the detail was opened from before the carousel is
          // drawn; selecting it on a later pass briefly showed the first page.
          if (!onx_panel_pages::parent_entity.empty()) {
            const int config = onx_panel_pages::configured(onx_panel_pages::parent_entity);
            onx_panel_pages::parent_entity.clear();
            if (config >= 0) id(normal_device_selected_index) = custom_logic::normal_ui_slot_for_device_config_slot(config);
          }
          ESP_LOGI("normal_mode", "detail closed");
          if (id(ui_presenter)->is_standby_active()) {
            #ifdef USE_ROOM_COMPANION
            if (!onx_panel_detail::timers.overlay) {
              onx_panel_pages::hide();
              onx_panel_ui::request_render();
            }
            #endif
            return;
          }
          #ifdef USE_ROOM_COMPANION
          if (onx_panel_detail::timers.overlay) return;
          #endif
      - if:
          condition:
            lambda: |-
              if (id(ui_presenter)->is_standby_active()) return false;
              #ifdef USE_ROOM_COMPANION
              if (onx_panel_detail::timers.overlay) return false;
              #endif
              return true;
          then:
            - script.execute:
                id: show_normal_device_entry_page
                direction: 0

  - id: adjust_normal_entity_control
    parameters:
      direction: int
    then:
      - lambda: |-
          if (!id(normal_input_event_pass) || id(screen_off_state) ||
              !id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active() ||
              id(standby_wakeup_pending) || id(sleep_wakeup_pending) ||
              !id(normal_device_detail_active) || !id(normal_device_detail_online) ||
              !id(normal_ha_api_connected) || id(detail_long_press_exit_fired)) return;
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          if (onx_playlist::browser.open && onx_playlist::browser.entity == entity) {
            const auto *list = onx_entity_config::playlists_for_ui(id(normal_device_detail_index), entity);
            if (list != nullptr) {
              if (id(key_btn).state) {
                id(key_long_press_handled) = true; id(normal_clear_wifi_allowed) = false;
              } else onx_playlist::browser.rotate(direction, list->count);
              id(ui_presenter)->notify_user_activity();
              id(refresh_normal_playlist).execute();
              return;
            }
          }
          if (id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) return;
          if (entity.rfind("weather.", 0) == 0) {
            auto *d = custom_logic_entity_sub::entity_detail(entity);
            if (!d) return;
            const int count = 3 + d->forecast_count;
            d->weather_page = (d->weather_page + (direction < 0 ? -1 : 1) + count) % count;
            if (id(key_btn).state) { id(key_long_press_handled) = true; id(normal_clear_wifi_allowed) = false; }
            id(ui_presenter)->notify_user_activity();
            id(refresh_normal_automation_detail_page).execute();
            return;
          }
          if (!onx_controls::handles(entity)) return;
          if (id(key_btn).state) {
            id(normal_clear_wifi_allowed) = false;
            if (entity.rfind("media_player.", 0) == 0) {
              id(emit_normal_media_track).execute(id(normal_device_detail_index), direction < 0);
            } else onx_controls::cycle(entity, direction);
            id(key_long_press_handled) = true;
          } else {
            onx_controls::rotate(entity, direction);
          }
          id(ui_presenter)->notify_user_activity();
          id(refresh_normal_automation_detail_page).execute();

  - id: queue_normal_gesture
    parameters:
      direction: int
    then:
      - lambda: |-
          const int slot=onx_entity_config::gesture_slot_for_ui(id(normal_device_detail_index));
          const int kind=onx_gesture::gesture(direction,id(key_btn).state);
          if(!onx_gesture::routes(slot,kind))return;
          onx_gesture::queue(slot,kind,id(normal_input_applied_value));
          if(id(key_btn).state) {id(key_long_press_handled)=true;id(normal_clear_wifi_allowed)=false;}
          id(ui_presenter)->notify_user_activity();

  - id: dispatch_normal_gesture_queue
    then:
      - lambda: |-
          if(!id(normal_device_detail_active) || !id(normal_ha_api_connected) ||
              !id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active() ||
              id(screen_off_state) || id(sleep_mode_state) || id(sleep_wakeup_pending) || id(standby_wakeup_pending) ||
              id(mode_manager)->is_provisioning_mode_enabled() || onx_notification::current.visible ||
              onx_timer::popup.visible || onx_playlist::browser.open || id(detail_long_press_exit_fired)) {
            onx_gesture::clear_pending();return;
          }
          if(onx_gesture::pending.empty())return;
          const auto request=onx_gesture::pending.front();onx_gesture::pending.pop_front();
          if(request.slot!=onx_entity_config::gesture_slot_for_ui(id(normal_device_detail_index))) {
            onx_gesture::clear_pending();return;
          }
          const auto &config=onx_gesture::configs[request.slot];
          auto &state=onx_gesture::states[request.slot];
          state.requested_ms=millis();state.press_request=false;++state.token;
          const auto *detail=custom_logic_entity_sub::entity_detail(config.entity);
          const std::string value=state.received?state.value:!config.feedback[0] && detail?detail->state:"";
          const std::string unit=state.received?state.unit:!config.feedback[0] && detail?detail->unit:"";
          id(emit_normal_gesture).execute(request.slot,request.kind,request.delta,state.token,
              std::string(config.actions[request.kind]),std::string(config.entity),value,unit,config.responses,config.events);

  - id: emit_normal_gesture
    mode: parallel
    max_runs: 8
    parameters:
      slot: int
      kind: int
      delta: int
      token: int
      action: string
      entity: string
      value: string
      unit: string
      responses: bool
      events: bool
    then:
      - if:
          condition:
            lambda: return events;
          then:
            - homeassistant.event:
                event: esphome.panel_gesture
                data:
                  device: !lambda return App.get_name();
                  entity_id: !lambda return entity;
                  direction: !lambda return std::string(onx_gesture::names[kind]);
                  delta: !lambda return std::to_string(delta);
                  pressed: !lambda return std::string(kind>=2?"true":"false");
                  value: !lambda return value;
                  unit: !lambda return unit;
      - if:
          condition:
            lambda: return action.rfind("automation.",0)==0;
          then:
            - homeassistant.action:
                action: automation.trigger
                data:
                  entity_id: !lambda return action;
                  skip_condition: "false"
                data_template:
                  variables: !lambda |-
                    return custom_logic::build_ha_action_variables(entity,delta,onx_gesture::names[kind],kind>=2,value,unit);
      - if:
          condition:
            lambda: return action.rfind("script.",0)==0 && !responses;
          then:
            - homeassistant.action:
                action: !lambda return action;
                data:
                  panel_entity: !lambda return entity;
                  direction: !lambda return std::string(onx_gesture::names[kind]);
                  delta: !lambda return std::to_string(delta);
                  pressed: !lambda return std::string(kind>=2?"true":"false");
                  value: !lambda return value;
                  unit: !lambda return unit;
      - if:
          condition:
            lambda: return action.rfind("script.",0)==0 && responses;
          then:
            - homeassistant.action:
                action: !lambda return action;
                data:
                  panel_entity: !lambda return entity;
                  direction: !lambda return std::string(onx_gesture::names[kind]);
                  delta: !lambda return std::to_string(delta);
                  pressed: !lambda return std::string(kind>=2?"true":"false");
                  value: !lambda return value;
                  unit: !lambda return unit;
                capture_response: true
                on_success:
                  - lambda: |-
                      onx_panel_ui::request_render();  // Async data: redraw now, not on the 1 s tick.
                      if(slot<0 || slot>=(int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT || entity!=onx_gesture::configs[slot].entity ||
                          onx_gesture::states[slot].token!=static_cast<uint32_t>(token))return;
                      const auto result=response["response"];
                      if(result["value"].isNull())return;
                      std::string text;
                      if(result["value"].is<const char *>())text=result["value"].as<std::string>();
                      else serializeJson(result["value"],text);
                      onx_gesture::feedback(slot,text,result["unit"] | onx_gesture::states[slot].unit,millis(),true);
                on_error:
                  - lambda: |-
                      onx_panel_ui::request_render();  // Async data: redraw now, not on the 1 s tick.
                      if(slot>=0 && slot<(int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT && entity==onx_gesture::configs[slot].entity &&
                          onx_gesture::configs[slot].popup && onx_gesture::states[slot].token==static_cast<uint32_t>(token)) {
                        onx_gesture::states[slot].notice="Action failed";
                        onx_gesture::states[slot].feedback_ms=millis();
                      }

  - id: refresh_normal_gesture_feedback
    then:
      - lambda: |-
          const int slot=onx_entity_config::gesture_slot_for_ui(id(normal_device_detail_index));
          const bool active=slot>=0 && id(normal_device_detail_active) && id(normal_ha_api_connected) &&
              id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
              !id(screen_off_state) && !id(sleep_mode_state) && !onx_notification::current.visible && !onx_timer::popup.visible;
          if(!active || !onx_gesture::states[slot].feedback_ms || millis()-onx_gesture::states[slot].feedback_ms>=1500) {
            lv_obj_add_flag(id(normal_gesture_feedback),LV_OBJ_FLAG_HIDDEN);return;
          }
          const auto &state=onx_gesture::states[slot];
          const auto text=state.notice.empty()?state.value+(state.unit.empty()?"":" "+state.unit):state.notice;
          onx_render::label(id(normal_gesture_feedback_text),text.c_str());
          lv_obj_clear_flag(id(normal_gesture_feedback),LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(normal_gesture_feedback));

  - id: check_normal_idle_media_popup
    then:
      - lambda: |-
          #ifdef USE_ROOM_COMPANION
          if (onx_panel_detail::timers.overlay) return;
          #endif
          if (onx_notification::current.visible) return;
          auto &popup = onx_media::idle_popup;
          const auto now = id(ha_time).now();
          const bool sleep_due = now.is_valid() && id(ui_presenter)->should_enter_sleep_mode(now.hour, now.minute);
          const bool media_idle =
          #ifdef USE_ROOM_COMPANION
              true;
          #else
              onx_display_settings::idle.media;
          #endif
          const bool mode_ok = id(ui_presenter)->is_normal_mode_active() &&
              !id(mode_manager)->is_provisioning_mode_enabled() &&
              !id(screen_off_state) && !id(sleep_mode_state) && !sleep_due && !onx_timer::popup.visible;
          const bool allowed = media_idle && id(normal_ha_api_connected) && mode_ok;
          const auto timeout = id(ui_presenter)->get_standby_timeout_ms();
          auto playing = [&](int index) {
            if (index < 0 || index >= id(normal_device_count)) return false;
            const auto entity = id(ui_presenter)->get_normal_device_entity_id(index);
            const auto *detail = custom_logic_entity_sub::entity_detail(entity);
            return entity.rfind("media_player.", 0) == 0 && detail && detail->received && detail->available && detail->state == "playing";
          };
          static std::vector<std::string> prev_playing;
          static int prev_detail_index = -1;
          static bool prev_detail_playing = false;
          std::vector<std::string> now_playing_entities;
          int newly_playing = -1;
          for (int i = 0; i < id(normal_device_count) && i < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT; ++i) {
            if (!playing(i)) continue;
            const auto ent = id(ui_presenter)->get_normal_device_entity_id(i);
            now_playing_entities.push_back(ent);
            if (newly_playing < 0 && std::find(prev_playing.begin(), prev_playing.end(), ent) == prev_playing.end())
              newly_playing = i;
          }
          const int cur_detail = id(normal_device_detail_index);
          const bool cur_detail_playing = id(normal_device_detail_active) && playing(cur_detail);
          const bool detail_stopped_playing = id(normal_device_detail_active) && cur_detail == prev_detail_index && prev_detail_playing && !cur_detail_playing;
          int candidate = cur_detail_playing ? cur_detail : (newly_playing >= 0 ? newly_playing : (playing(id(normal_device_selected_index)) ? id(normal_device_selected_index) : -1));
          if (candidate < 0)
            for (int i = 0; i < id(normal_device_count) && i < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT; ++i)
              if (playing(i)) { candidate = i; break; }
          prev_playing = std::move(now_playing_entities);
          prev_detail_index = id(normal_device_detail_active) ? cur_detail : -1;
          prev_detail_playing = cur_detail_playing;
          const auto current_entity = (cur_detail >= 0 && cur_detail < id(normal_device_count))
              ? id(ui_presenter)->get_normal_device_entity_id(cur_detail) : std::string();
          const bool media_detail = id(normal_device_detail_active) &&
              id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
              current_entity.rfind("media_player.", 0) == 0;
          onx_media::IdleMediaInput in;
          in.mode_ok = mode_ok;
          in.allowed = allowed;
          in.standby_enabled = onx_display_settings::current.standby_scope != 2
          #ifdef USE_ROOM_COMPANION
              && onx_notification_ui::standby_timeout_enabled
          #endif
              ;
          in.standby_active = id(ui_presenter)->is_standby_active();
          in.user_idle = id(ui_presenter)->user_idle_ms() >= timeout;
          #ifdef USE_ROOM_COMPANION
          in.overlay_blocking = onx_notification_ui::panel_open || onx_notification_ui::detail_id != 0 || onx_assist::overlay_visible();
          #endif
          in.detail_active = id(normal_device_detail_active);
          in.media_detail = media_detail;
          in.cur_detail_playing = cur_detail_playing;
          in.newly_playing_found = newly_playing >= 0;
          in.detail_stopped_playing = detail_stopped_playing;
          in.cur_detail = cur_detail;
          in.selected_index = id(normal_device_selected_index);
          in.candidate = candidate;
          const auto decision = onx_media::decide_idle_media(popup, in);
          switch (decision.action) {
            case onx_media::IdleMediaAction::OPEN_POPUP:
            case onx_media::IdleMediaAction::SWITCH_PLAYER:
              id(normal_device_selected_index) = decision.target_index;
              id(enter_normal_switch_detail).execute();
              break;
            case onx_media::IdleMediaAction::CLOSE_DETAIL:
              onx_playlist::browser.clear();
              id(exit_normal_switch_detail).execute();
              break;
            case onx_media::IdleMediaAction::NONE:
              break;
          }

  - id: check_normal_timer_popup
    then:
      - lambda: |-
          #ifdef USE_ROOM_COMPANION
          // Room Companion shows every timer (local Assist, HA helpers, voice
          // satellite, Google) on the shared timer overlay so it sits on top
          // of whatever view (including media player) is open and swiping to
          // close returns directly to it.
          if (!id(ui_presenter)->is_normal_mode_active() || !id(normal_ha_api_connected) ||
              id(mode_manager)->is_provisioning_mode_enabled() || id(sleep_mode_state) || id(screen_off_state)) {
            return;
          }
          const auto items = onx_panel_detail::all_timers();
          if (onx_panel_detail::timers.overlay && !onx_panel_detail::timers.ringing &&
              std::none_of(items.begin(), items.end(), onx_panel_detail::running)) {
            id(timer_close).execute();
          }
          static std::vector<std::string> prev_active;
          static std::vector<std::string> prev_ringing;
          static bool ha_timer_synced = false;
          std::vector<std::string> now_active;
          std::vector<std::string> now_ringing;
          std::string newly_started, newly_ringing;
          for (const auto &t : items) {
            // Local Assist timers are opened directly by assist.yaml callbacks.
            if (t.key.rfind("local:", 0) == 0) continue;
            if (t.state == "active") {
              now_active.push_back(t.key);
              if (ha_timer_synced && newly_started.empty() &&
                  std::find(prev_active.begin(), prev_active.end(), t.key) == prev_active.end())
                newly_started = t.key;
            } else if (t.state == "ringing") {
              now_ringing.push_back(t.key);
              if (newly_ringing.empty() &&
                  std::find(prev_ringing.begin(), prev_ringing.end(), t.key) == prev_ringing.end())
                newly_ringing = t.key;
            }
          }
          prev_active = std::move(now_active);
          prev_ringing = std::move(now_ringing);
          ha_timer_synced = true;
          if (!newly_ringing.empty()) {
            onx_panel_detail::timers.focus.clear();
            onx_panel_detail::timers.dismissed = false;
            id(timer_show).execute();
          } else if (!newly_started.empty()) {
            onx_panel_detail::timers.focus = newly_started;
            onx_panel_detail::timers.dismissed = false;
            id(timer_show).execute();
          }
          return;
          #endif
          if (onx_timer::popup.visible && !id(normal_ha_api_connected)) {
            onx_timer::popup.visible=false;
            id(normal_device_selected_index)=onx_timer::popup.previous_index;
            id(exit_normal_switch_detail).execute();
          }
          if (!id(ui_presenter)->is_normal_mode_active() || !id(normal_ha_api_connected) ||
              id(mode_manager)->is_provisioning_mode_enabled() || id(sleep_mode_state) || id(screen_off_state)) return;
          int candidate=-1; double soonest=INFINITY;
          const auto now = id(ha_time).now();
          bool popup_still_active=false;
          for (int i=0;i<id(normal_device_count) && i<(int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT;++i) {
            const auto entity=id(ui_presenter)->get_normal_device_entity_id(i);
            auto *d=custom_logic_entity_sub::entity_detail(entity);
            if (!d || !d->received || !d->available || !custom_logic_entity_sub::is_timer_detail(entity)) continue;
            time_t finish=0;
            const bool has_finish=custom_logic_entity_sub::parse_ha_datetime_epoch(d->timer_finishes_at, &finish) ||
                (d->state=="idle" && custom_logic_entity_sub::parse_ha_datetime_epoch(d->timer_last_finish, &finish));
            if (d->state=="idle" && has_finish && now.is_valid() && now.timestamp<finish) d->timer_last_finish.clear();
            const bool completed=d->state=="idle" && has_finish && now.is_valid() && now.timestamp>=finish && now.timestamp-finish<10;
            if (d->state!="active" && d->state!="paused" && d->state!="ringing" && !completed) continue;
            if (onx_timer::popup.entity==entity) popup_still_active=true;
            const double left=(d->state=="ringing" || completed) ? -1 : d->state=="paused" ? 1e12 :
                d->voice_timer ? std::max(0.0, d->voice_remaining-(millis()-d->timer_received_ms)/1000.0) : has_finish && now.is_valid() ? double(finish)-now.timestamp : 1e11;
            if (left<soonest) {soonest=left;candidate=i;}
          }
          if (onx_timer::popup.visible) {
            // A cancelled/finished timer hands the popup to the next running one.
            if (!popup_still_active && candidate>=0) {
              onx_timer::popup.entity=id(ui_presenter)->get_normal_device_entity_id(candidate);
              id(normal_device_selected_index)=candidate;
              id(enter_normal_switch_detail).execute();
            } else if (!popup_still_active) {
              onx_timer::popup.visible=false;
              id(normal_device_selected_index)=onx_timer::popup.previous_index;
              id(exit_normal_switch_detail).execute();
            }
            return;
          }
          if (candidate<0) {onx_timer::popup.dismissed=false;return;}
          #ifdef USE_ROOM_COMPANION
          // Idle timeout off (notification centre): running timers stay in the
          // status chip; only a finished (ringing) timer takes the screen.
          if (!onx_notification_ui::standby_timeout_enabled && soonest>=0) return;
          #endif
          if (!onx_timer::popup_due(id(ui_presenter)->user_idle_ms(), id(normal_device_detail_active), onx_timer::popup.dismissed)) return;
          // Never replace a settings page or an explicitly sleeping screen.
          if (id(normal_device_detail_active) && id(normal_device_detail_kind)!=NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) return;
          if (onx_media::idle_popup.previous_index >= 0) {
            id(normal_device_selected_index) = onx_media::idle_popup.previous_index;
            onx_media::idle_popup.previous_index = -1;
          }
          onx_media::idle_popup.visible = false;
          onx_timer::popup.previous_index=id(normal_device_selected_index);
          onx_timer::popup.entity=id(ui_presenter)->get_normal_device_entity_id(candidate);
          onx_timer::popup.visible=true;
          if (id(ui_presenter)->is_standby_active()) id(exit_standby_mode).execute();
          id(normal_device_selected_index)=candidate;
          id(enter_normal_switch_detail).execute();

  - id: emit_configured_press_action
    parameters:
      detail_index: int
    then:
      - lambda: |-
          const auto entity=id(ui_presenter)->get_normal_device_entity_id(detail_index);
          const auto action=onx_entity_config::action_for_ui(detail_index);
          const int slot=onx_entity_config::gesture_slot_for_ui(detail_index);
          if(!id(normal_ha_api_connected))return;
          bool responses=false;
          uint32_t token=0;
          if(slot>=0 && slot<(int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT) {
            auto &state=onx_gesture::states[slot];
            state.requested_ms=millis();state.press_request=true;token=++state.token;
            state.feedback_ms=0;state.notice.clear();
            responses=onx_gesture::configs[slot].press_responses;
          }
          onx_runtime::record("press_action",entity);
          id(emit_normal_press_action).execute(slot,entity,action,token,responses);

  - id: emit_normal_press_action
    mode: parallel
    max_runs: 4
    parameters:
      slot: int
      entity: string
      action: string
      token: int
      responses: bool
    then:
      - if:
          condition:
            lambda: return action.rfind("automation.",0)==0;
          then:
