          id(normal_input_pending_value) = pending;
          int selected = 2;
          if (pending == 2) {
            selected = 1;
          } else if (pending == 4) {
            selected = 0;
          }
          lv_obj_t *roller = id(normal_settings_input_roller)->obj;

          lv_label_set_text(id(normal_settings_input_title), "Swipe sensitivity");
          onx_render::settings_roller(roller,id(fonts_MiSans_Medium_16)->get_lv_font(),
              id(fonts_MiSans_Medium_18)->get_lv_font());

          lv_roller_set_selected(roller, selected, LV_ANIM_OFF);

