  - id: refresh_normal_media_cover
    then:
      - lambda: |-
          // Notification pictures take priority over cosmetic media fetches.
          if(onx_notification::current.visible)return;
          onx_media::artwork_wait_reason.clear();
          // The redesigned media detail shares the main card's artwork path.
          const bool main_art = (!id(normal_device_detail_active) || onx_panel_detail::active) && !onx_media::main_entity.empty();
          const auto entity = main_art ? onx_media::main_entity : id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          auto *detail = custom_logic_entity_sub::entity_detail(entity);
          const bool cam = entity.rfind("camera.", 0) == 0;
          const bool media = !main_art && id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                             (entity.rfind("media_player.", 0) == 0 || cam) && detail != nullptr;
          std::string origin = custom_logic::build_ha_http_state_url(id(ha_host).state, "media_player.cover");
          const auto path = origin.find("/api/states/");
          if (path != std::string::npos) origin.resize(path);
          const bool playable = (media || main_art) && detail != nullptr && detail->available && id(normal_ha_api_connected) &&
              (main_art || id(normal_device_detail_online)) && !id(screen_off_state) && !id(sleep_mode_state) &&
              !id(ui_presenter)->is_standby_active() && (cam || onx_media::has_playback(detail->state));
          const bool want_stream = playable && cam && id(normal_device_detail_active) && onx_panel_detail::active;
          const std::string stream_url = want_stream ? onx_media::camera_stream_url(origin, detail->picture) : "";
          const bool use_stream = !stream_url.empty();
          const std::string desired = !playable ? ""
              : use_stream ? stream_url
              : cam ? onx_media::camera_snapshot_url(origin, detail->picture, onx_media::camera_refresh_seq)
              : onx_media::artwork_url(origin, detail->picture);
          const uint32_t now = millis();
          if (desired != onx_media::candidate_url) {
            onx_media::candidate_url = desired; onx_media::candidate_ms = now;
          }
          const bool stale_download = onx_media::downloading && !desired.empty() &&
                                      desired != onx_media::requested_url && now - onx_media::candidate_ms >= 300;
          if ((!playable || stale_download) && onx_media::downloading) {
            // Detach the LVGL source before release invalidates the pixel buffer.
            if (onx_media::detach_main_artwork) onx_media::detach_main_artwork();
            lv_image_cache_drop(id(media_cover_image)->get_lv_image_dsc());
            lv_image_header_cache_drop(id(media_cover_image)->get_lv_image_dsc());
            id(media_cover_image)->release();
            onx_media::downloading = false; onx_media::ready_url.clear();
            // Nothing was shown; let the desired URL start as soon as the old worker unwinds.
            onx_media::requested_url.clear();
            if (!playable) onx_media::artwork_retry.clear();
            id(entity_icon_downloader)->set_artwork_busy(false);
            onx_media::last_artwork_end_ms = now;
            onx_media::artwork_wait_reason = stale_download ? "cancelling" : "";
            onx_runtime::record("artwork_cancelled", entity);
          }
          const bool ready = !desired.empty() && desired == onx_media::ready_url;
          if (desired.empty() || ready || onx_media::downloading ||
              !id(normal_ha_api_connected) || (!main_art && !id(normal_device_detail_online)) ||
              id(screen_off_state) || id(ui_presenter)->is_standby_active()) return;
          // Wait briefly for a stable URL and keep concurrent TLS clients off the small
          // internal heap. Cosmetic artwork must not crowd out API/Wi-Fi buffers.
          if (id(media_cover_image)->is_busy()) {
            onx_media::artwork_wait_reason = "cancelling";
            onx_media::retry_at_ms = now + 250; if (onx_media::retry_at_ms == 0) onx_media::retry_at_ms = 1;
            return;
          }
          if (id(key_btn).state || now - onx_media::candidate_ms < 350 ||
              now - onx_media::last_artwork_end_ms < 250) {
            onx_media::retry_at_ms = now + 250; if (onx_media::retry_at_ms == 0) onx_media::retry_at_ms = 1;
            return;
          }
          if (id(entity_icon_downloader)->busy()) {
            id(entity_icon_downloader)->request_artwork_yield();
            onx_media::artwork_wait_reason = "waiting_for_icons";
            onx_media::retry_at_ms = now + 200; if (onx_media::retry_at_ms == 0) onx_media::retry_at_ms = 1;
            return;
          }
          if (!id(media_cover_image)->memory_ready()) {
            onx_media::artwork_wait_reason = "waiting_for_memory";
            onx_media::retry_at_ms = now + 1000; if (onx_media::retry_at_ms == 0) onx_media::retry_at_ms = 1;
            return;
          }
          if (!onx_media::artwork_retry.ready(desired, now)) {
            onx_media::artwork_wait_reason = "retry_wait";
            onx_media::retry_at_ms = onx_media::artwork_retry.wakeup_ms(desired, now);
            return;
          }
          onx_media::retry_at_ms = 0;
          onx_media::artwork_wait_reason.clear();
          id(media_cover_image)->set_cache_entries(4, 512 * 1024);
          // The detail's artwork image still holds the old buffer; detach it.
          if (onx_media::detach_main_artwork) onx_media::detach_main_artwork();
          lv_image_cache_drop(id(media_cover_image)->get_lv_image_dsc());
          lv_image_header_cache_drop(id(media_cover_image)->get_lv_image_dsc());
          onx_media::ready_url.clear();
          onx_media::requested_url = desired;
          onx_media::requested_ms = now;
          onx_media::downloading = true;
          id(media_cover_image)->set_stream_mode(use_stream);
          id(media_cover_image)->set_url(desired);
          onx_runtime::record("artwork_start", entity);
          ++onx_media::stat_attempts;
          id(entity_icon_downloader)->set_artwork_busy(true);
          // The local OnlineImage implementation starts only a worker here.
          id(media_cover_image)->update();

  - id: emit_normal_media_track
    parameters:
      detail_index: int
      previous: bool
    then:
      - if:
          condition:
            lambda: |-
              const auto *detail = custom_logic_entity_sub::entity_detail(id(ui_presenter)->get_normal_device_entity_id(detail_index));
              return detail != nullptr && detail->available && onx_media::can_skip(detail->state, detail->features, previous) &&
                     id(normal_device_detail_active) && id(normal_device_detail_online) &&
                     id(normal_ha_api_connected) && id(normal_device_detail_index) == detail_index &&
                     !id(screen_off_state) && !id(ui_presenter)->is_standby_active() &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     id(ui_presenter)->get_normal_device_entity_id(detail_index).rfind("media_player.", 0) == 0;
          then:
            - if:
                condition:
                  lambda: return previous;
                then:
                  - homeassistant.service:
                      service: media_player.media_previous_track
                      data:
                        entity_id: !lambda return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                else:
                  - homeassistant.service:
                      service: media_player.media_next_track
                      data:
                        entity_id: !lambda return id(ui_presenter)->get_normal_device_entity_id(detail_index);
            - lambda: |-
                onx_media::transport.show(id(ui_presenter)->get_normal_device_entity_id(detail_index), previous, millis());

  - id: emit_normal_playlist_action
    parameters:
      action: string
    then:
      - if:
          condition:
            lambda: return id(normal_ha_api_connected) && onx_playlist::action_valid(action) && action.rfind("automation.", 0) == 0;
          then:
            - homeassistant.service:
                service: automation.trigger
                data:
                  entity_id: !lambda return action;
                  skip_condition: "false"
            - script.execute: show_normal_action_sent
      - if:
          condition:
            lambda: return id(normal_ha_api_connected) && onx_playlist::action_valid(action) && action.rfind("script.", 0) == 0;
          then:
            - homeassistant.service:
                service: script.turn_on
                data:
                  entity_id: !lambda return action;

            - script.execute: show_normal_action_sent
  # Quick-action browser state; the redesigned details draw the list.
  - id: refresh_normal_playlist
    then:
      - lambda: |-
          auto &browser = onx_playlist::browser;
          // Runs every 100 ms; without an open detail there is nothing to track
          // (looking up the quick-action lists cost ~2.5 ms per call).
          if (!id(normal_device_detail_active)) { if (browser.open) browser.clear(); return; }
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          const auto *list = onx_entity_config::playlists_for_ui(id(normal_device_detail_index), entity);
          const int kind = id(normal_device_detail_kind);
          const bool page = id(normal_device_detail_active) &&
              (kind == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION || kind == NORMAL_DEVICE_DETAIL_KIND_SWITCH ||
               kind == NORMAL_DEVICE_DETAIL_KIND_PLUG || kind == NORMAL_DEVICE_DETAIL_KIND_LIGHT ||
               kind == NORMAL_DEVICE_DETAIL_KIND_CURTAIN) &&
              id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
              !id(screen_off_state) && !id(sleep_mode_state);
          const bool active = list != nullptr && page && id(normal_device_detail_online) && id(normal_ha_api_connected);
          if (!active || (browser.open && browser.entity != entity)) browser.clear();

  - id: show_normal_action_sent
    then:
      - lambda: |-
          if (!id(normal_ha_api_connected) || !id(normal_device_detail_active)) return;
          onx_action_feedback::sent(id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index)), millis());
          id(refresh_normal_action_feedback).execute();

  - id: refresh_normal_action_feedback
    then:
      - lambda: |-
          const auto selected = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          const bool active = id(normal_device_detail_active) && !id(screen_off_state) && !id(sleep_mode_state) &&
              id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
              onx_action_feedback::active(selected, millis());
          if (!active) {
            lv_obj_add_flag(id(normal_action_feedback), LV_OBJ_FLAG_HIDDEN);
            if (onx_action_feedback::visible) onx_action_feedback::clear();
            return;
          }
          if (lv_obj_has_flag(id(normal_action_feedback), LV_OBJ_FLAG_HIDDEN)) {
            lv_obj_clear_flag(id(normal_action_feedback), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(normal_action_feedback));
          }
