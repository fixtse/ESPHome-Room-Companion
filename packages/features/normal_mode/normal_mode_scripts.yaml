            lv_obj_set_scroll_dir(menu, LV_DIR_VER);
            lv_obj_set_scrollbar_mode(menu, LV_SCROLLBAR_MODE_AUTO);
            static const char *labels[] = {"Home Assistant", "Wireless network", "Display", "Swipe sensitivity", "Background"};
            for (int i = 0; i < 5; ++i) {
              auto *row = lv_button_create(menu);
              lv_obj_set_size(row, LV_PCT(100), (lv_display_get_vertical_resolution(nullptr) - 108) / 5);
