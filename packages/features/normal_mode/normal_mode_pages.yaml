# Layout is authored for a 240x240 base layout. Rectangular panels
# set ui_scale (and the other geometry substitutions) in their board profile.
substitutions:
  ui_scale: 1

lvgl:
  top_layer:
    widgets:
      - image:
          id: normal_device_wifi_online_widget
          x: ${ (-13 * (ui_scale | float)) | round | int }
          y: ${ (10 * (ui_scale | float)) | round | int }
          width: ${ (20 * (ui_scale | float)) | round | int }
          align: TOP_MID
          src: standby_wifi_online_img
          hidden: true
      - image:
          id: normal_device_wifi_offline_widget
          x: ${ (-13 * (ui_scale | float)) | round | int }
          y: ${ (10 * (ui_scale | float)) | round | int }
          align: TOP_MID
          src: standby_wifi_offline_img
          hidden: true
      - image:
          id: normal_device_homeassistant_online_widget
          x: ${ (13 * (ui_scale | float)) | round | int }
          y: ${ (10 * (ui_scale | float)) | round | int }
          align: TOP_MID
          src: standby_homeassistant_online_img
          hidden: true
      - image:
          id: normal_device_homeassistant_offline_widget
          x: ${ (13 * (ui_scale | float)) | round | int }
          y: ${ (10 * (ui_scale | float)) | round | int }
          align: TOP_MID
          src: standby_homeassistant_offline_img
          hidden: true
      - obj:
          id: normal_action_feedback
          align: bottom_mid
          y: ${ (-28 * (ui_scale | float)) | round | int }
          width: ${ (48 * (ui_scale | float)) | round | int }
          height: ${ (48 * (ui_scale | float)) | round | int }
          radius: ${ (24 * (ui_scale | float)) | round | int }
          bg_color: 0x000000
          bg_opa: 85%
          border_width: 0
          pad_all: 0
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - image:
                id: normal_action_feedback_icon
                align: center
                src: action_sent_img
      - obj:
          id: normal_message_overlay
          x: 0
          y: 0
          width: ${ (240 * (ui_scale | float)) | round | int }
          height: ${ (240 * (ui_scale | float)) | round | int }
          radius: ${ (120 * (ui_scale | float)) | round | int }
          bg_color: 0x1A1A1A
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - arc:
                id: normal_message_countdown_arc
                align: center
                width: ${ (240 * (ui_scale | float)) | round | int }
                height: ${ (240 * (ui_scale | float)) | round | int }
                pad_all: 0
                border_width: 0
                adjustable: false
                clickable: false
                min_value: 0
                max_value: 1000
                value: 1000
                start_angle: 0
                end_angle: 360
                rotation: 270
                arc_width: ${ (4 * (ui_scale | float)) | round | int }
                arc_color: 0x414850
                indicator:
                  arc_width: ${ (4 * (ui_scale | float)) | round | int }
                  arc_color: 0x62B0FF
                hidden: true
            - label:
                align: top_mid
                y: ${ (20 * (ui_scale | float)) | round | int }
                text_font: fonts_MiSans_Bold_12
                text_color: 0x62B0FF
                text: "Notification"
            - label:
                id: normal_message_title
                align: top_mid
                y: ${ (43 * (ui_scale | float)) | round | int }
                width: ${ (184 * (ui_scale | float)) | round | int }
                height: ${ (44 * (ui_scale | float)) | round | int }
                long_mode: WRAP
                text_align: CENTER
                text_font: fonts_MiSans_Medium_18
                text_color: 0xFFFFFF
                text: ""
            - image:
                id: normal_message_image
                align: top_mid
                y: ${ (70 * (ui_scale | float)) | round | int }
                src: notification_image
                hidden: true
            - obj:
                id: normal_message_body
                align: top_mid
                y: ${ (94 * (ui_scale | float)) | round | int }
                width: ${ (168 * (ui_scale | float)) | round | int }
                height: ${ (110 * (ui_scale | float)) | round | int }
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: true
                clickable: false
                widgets:
                  - label:
                      id: normal_message_text
                      x: 0
                      y: 0
                      width: ${ (160 * (ui_scale | float)) | round | int }
                      text_line_space: ${ (2 * (ui_scale | float)) | round | int }
                      long_mode: WRAP
                      text_font: fonts_MiSans_Medium_16
                      text_color: 0xFFFFFF
                      text: ""
            - label:
                align: top_mid
                y: ${ (212 * (ui_scale | float)) | round | int }
                width: ${ (120 * (ui_scale | float)) | round | int }
                height: ${ (16 * (ui_scale | float)) | round | int }
                text_align: CENTER
                text_font: fonts_MiSans_Bold_12
                text_color: 0xB8B8B8
                text: "Press to dismiss"
      - obj:
          id: normal_gesture_feedback
          align: bottom_mid
          y: ${ (-44 * (ui_scale | float)) | round | int }
          width: ${ (168 * (ui_scale | float)) | round | int }
          height: ${ (40 * (ui_scale | float)) | round | int }
          radius: ${ (12 * (ui_scale | float)) | round | int }
          bg_color: 0x000000
          bg_opa: 85%
          border_width: 0
          pad_all: ${ (4 * (ui_scale | float)) | round | int }
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - label:
                id: normal_gesture_feedback_text
                align: center
                width: ${ (158 * (ui_scale | float)) | round | int }
                long_mode: DOT
                text_align: CENTER
                text_font: fonts_MiSans_Medium_18
                text_color: 0xFFFFFF
                text: ""
  pages:
    # Home Assistant is connected but no controls are configured yet. Full-screen
    # column for the rectangular panels; the address is filled in by
    # refresh_normal_device_page (normal_device_empty_url).
    - id: device_empty
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - obj:
            id: normal_device_empty_shell
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 0
            bg_opa: TRANSP
            border_width: 0
            pad_left: ${ (20 * (ui_scale | float)) | round | int }
            pad_right: ${ (20 * (ui_scale | float)) | round | int }
            pad_top: 0
            pad_bottom: ${ (24 * (ui_scale | float)) | round | int }
            scrollable: false
            clickable: false
            layout:
              type: flex
              pad_row: ${ (10 * (ui_scale | float)) | round | int }
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - image:
                  src: homeassistant_img
                  width: ${ (56 * (ui_scale | float)) | round | int }
                  height: ${ (56 * (ui_scale | float)) | round | int }
              - label:
                  width: 100%
                  text_align: CENTER
                  text_font: fonts_MiSans_Bold_24
                  text_color: 0xFFFFFF
                  pad_top: ${ (6 * (ui_scale | float)) | round | int }
                  text: "No controls yet"
              - label:
                  width: 100%
                  text_align: CENTER
                  text_font: fonts_MiSans_Medium_16
                  text_color: 0xD2D2D2
                  text: "Connected to Home Assistant. Choose what this panel controls from a browser:"
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  radius: ${ (12 * (ui_scale | float)) | round | int }
                  bg_color: 0x3A3A3A
                  bg_opa: 60%
                  border_width: 0
                  pad_all: ${ (10 * (ui_scale | float)) | round | int }
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        id: normal_device_empty_url
                        width: 100%
                        align: center
                        text_align: CENTER
                        long_mode: WRAP
                        text_font: fonts_MiSans_Bold_18
                        text_color: 0x62B0FF
                        text: "Open the device's Visit link"
              - label:
                  width: 100%
                  text_align: CENTER
                  text_font: fonts_MiSans_Medium_14
                  text_color: 0x9A9A9A
                  pad_top: ${ (8 * (ui_scale | float)) | round | int }
                  text: "Swipe for panel settings"

    # The rectangular carousel has one native host, without legacy body widgets.
    - id: normal_panel_page
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false

    # Empty backing screen for every detail kind. The redesigned detail
    # screens (onx_panel_detail) are drawn above it on the top layer; the
    # legacy round switch/light/cover/automation pages were removed.
    - id: normal_detail_page
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false

    - id: normal_settings_page
      bg_color: 0x1A1A1A
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - obj:
            id: normal_settings_detail_shell
            x: 0
            y: 0
            width: ${ (240 * (ui_scale | float)) | round | int }
            height: ${ (240 * (ui_scale | float)) | round | int }
            radius: ${ (120 * (ui_scale | float)) | round | int }
            bg_color: 0x1A1A1A
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: normal_settings_header_title
                  x: 0
                  y: ${ (18 * (ui_scale | float)) | round | int }
                  align: top_mid
                  text_font: fonts_MiSans_Medium_18
                  text_color: 0xFFFFFF
                  text: "Settings"
              - roller:
                  id: normal_settings_roller
                  x: 0
                  y: ${ (5 * (ui_scale | float)) | round | int }
                  width: ${ (221 * (ui_scale | float)) | round | int }
                  height: ${ (120 * (ui_scale | float)) | round | int }
                  align: center
                  mode: NORMAL
                  visible_row_count: 3
                  options:
                    - Home Assistant
                    - Wireless network
                    - Display
                    - KNOB
              - image:
                  id: normal_settings_arrow_hint
                  x: ${ (85 * (ui_scale | float)) | round | int }
                  y: ${ (18 * (ui_scale | float)) | round | int }
                  align: center
                  width: ${ (21 * (ui_scale | float)) | round | int }
                  height: ${ (21 * (ui_scale | float)) | round | int }
                  src: normal_settings_arrow_img
    - id: normal_settings_wifi_page
      bg_color: 0x1A1A1A
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - obj:
            id: normal_settings_wifi_shell
            x: 0
            y: 0
            width: ${ (240 * (ui_scale | float)) | round | int }
            height: ${ (240 * (ui_scale | float)) | round | int }
            radius: ${ (120 * (ui_scale | float)) | round | int }
            bg_color: 0x1A1A1A
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  id: normal_settings_wifi_header
                  x: 0
                  y: ${ (30 * (ui_scale | float)) | round | int }
                  width: ${ (240 * (ui_scale | float)) | round | int }
                  height: ${ (40 * (ui_scale | float)) | round | int }
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  align: top_mid
                  scrollable: false
                  widgets:
                    - label:
                        id: normal_settings_wifi_title
                        align: center
                        text_font: fonts_MiSans_Medium_18
                        text_color: 0xFFFFFF
                        text: "Wireless network"
              - obj:
                  id: normal_settings_wifi_card
                  x: 0
                  y: 0
                  width: ${ (210 * (ui_scale | float)) | round | int }
                  height: ${ (64 * (ui_scale | float)) | round | int }
                  radius: ${ (12 * (ui_scale | float)) | round | int }
                  bg_color: 0x000000
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: center
                  widgets:
                    - obj:
                        id: normal_settings_wifi_card_top
                        x: 0
                        y: 0
                        width: 100%
                        height: ${ (32 * (ui_scale | float)) | round | int }
                        radius: 0
                        bg_color: 0x3D3D3D
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - label:
                              id: normal_settings_wifi_ssid
                              x: ${ (15 * (ui_scale | float)) | round | int }
                              y: 0
                              align: left_mid
                              text_font: fonts_MiSans_Medium_14
                              text_color: 0xFFFFFF
                              text: "Not connected"
                          - image:
                              id: normal_settings_wifi_lock_icon
                              x: ${ (-34 * (ui_scale | float)) | round | int }
                              y: 0
                              align: right_mid
                              width: ${ (14 * (ui_scale | float)) | round | int }
                              height: ${ (14 * (ui_scale | float)) | round | int }
                              src: normal_settings_wifi_lock_img
                          - image:
                              id: normal_settings_wifi_wifi_icon
                              x: ${ (-12 * (ui_scale | float)) | round | int }
                              y: 0
                              align: right_mid
                              width: ${ (14 * (ui_scale | float)) | round | int }
                              height: ${ (14 * (ui_scale | float)) | round | int }
                              src: normal_settings_wifi_icon_img
                    - obj:
                        id: normal_settings_wifi_card_btm
                        x: 0
                        y: ${ (32 * (ui_scale | float)) | round | int }
                        width: 100%
                        height: ${ (32 * (ui_scale | float)) | round | int }
                        radius: 0
                        bg_color: 0x2D2D2D
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - label:
                              id: normal_settings_wifi_ip
                              x: ${ (15 * (ui_scale | float)) | round | int }
                              y: 0
                              align: left_mid
                              text_font: fonts_MiSans_Medium_12
                              text_color: 0xAAAAAA
                              text: "IP : --.--.--.--"
              - button:
                  id: normal_settings_wifi_ok_btn
                  x: 0
                  y: ${ (-25 * (ui_scale | float)) | round | int }
                  width: ${ (90 * (ui_scale | float)) | round | int }
                  height: ${ (36 * (ui_scale | float)) | round | int }
                  align: bottom_mid
                  bg_color: 0x0091FF
                  radius: ${ (10 * (ui_scale | float)) | round | int }
                  border_width: ${ (1 * (ui_scale | float)) | round | int }
                  border_color: 0x66BFFF
                  shadow_width: 0
                  widgets:
                    - label:
                        align: center
                        text_font: fonts_MiSans_Medium_14
                        text_color: 0xFFFFFF
                        text: "OK"
    - id: normal_settings_brightness_page
      bg_color: 0x1A1A1A
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - obj:
            id: normal_settings_brightness_shell
            x: 0
            y: 0
            width: ${ (240 * (ui_scale | float)) | round | int }
            height: ${ (240 * (ui_scale | float)) | round | int }
            radius: ${ (120 * (ui_scale | float)) | round | int }
            bg_color: 0x1A1A1A
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  id: normal_settings_brightness_header
                  x: 0
                  y: ${ (30 * (ui_scale | float)) | round | int }
                  width: ${ (240 * (ui_scale | float)) | round | int }
                  height: ${ (40 * (ui_scale | float)) | round | int }
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  align: top_mid
                  scrollable: false
                  widgets:
                    - label:
                        id: normal_settings_brightness_title
                        align: center
                        text_font: fonts_MiSans_Medium_18
                        text_color: 0xFFFFFF
                        text: "Display"
              - slider:
                  id: normal_settings_brightness_slider
                  x: 0
                  y: ${ (-6 * (ui_scale | float)) | round | int }
                  width: ${ (168 * (ui_scale | float)) | round | int }
                  height: ${ (12 * (ui_scale | float)) | round | int }
                  align: center
                  value: 100
                  min_value: 10
                  max_value: 100
                  on_change:
                    then:
                      - lambda: |-
                          int pct = (int) x;
                          if (pct < 10) pct = 10;
                          if (pct > 100) pct = 100;
                          id(normal_brightness_value) = pct;
                          auto call = id(lcd_backlight)->make_call();
                          call.set_brightness((float)pct / 100.0f);
                          call.set_state(true);
                          call.perform();
                          id(screen_off_state) = false;
                          id(ha_display_light_syncing) = true;
                          auto ha_call = id(ha_light)->make_call();
                          ha_call.set_state(true);
                          ha_call.set_brightness((float)pct / 100.0f);
                          ha_call.perform();
                          id(ha_display_light_syncing) = false;
                          char value_text[48];
                          snprintf(value_text, sizeof(value_text), "Brightness: %d%%", pct);
                          lv_label_set_text(id(normal_settings_brightness_value_label), value_text);
                          id(ui_presenter)->notify_user_activity();
              - label:
                  id: normal_settings_brightness_value_label
                  x: 0
                  y: ${ (18 * (ui_scale | float)) | round | int }
                  align: center
                  text_font: fonts_MiSans_Medium_14
                  text_color: 0xFFFFFF
                  text: "Brightness: 100%"
    - id: normal_settings_input_page
      bg_color: 0x1A1A1A
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - obj:
            id: normal_settings_input_shell
            x: 0
            y: 0
            width: ${ (240 * (ui_scale | float)) | round | int }
            height: ${ (240 * (ui_scale | float)) | round | int }
            radius: ${ (120 * (ui_scale | float)) | round | int }
            bg_color: 0x1A1A1A
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  id: normal_settings_input_header
                  x: 0
                  y: ${ (30 * (ui_scale | float)) | round | int }
                  width: ${ (240 * (ui_scale | float)) | round | int }
                  height: ${ (40 * (ui_scale | float)) | round | int }
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  align: top_mid
                  scrollable: false
                  widgets:
                    - label:
                        id: normal_settings_input_title
                        align: center
                        text_font: fonts_MiSans_Medium_18
                        text_color: 0xFFFFFF
                        text: "Swipe sensitivity"
              - roller:
                  id: normal_settings_input_roller
                  x: 0
                  y: ${ (-2 * (ui_scale | float)) | round | int }
                  width: ${ (168 * (ui_scale | float)) | round | int }
                  height: ${ (78 * (ui_scale | float)) | round | int }
                  align: center
                  mode: NORMAL
                  visible_row_count: 3
                  selected_index: 0
                  options:
                    - "Low"
                    - "Medium"
                    - "High"
                  on_change:
                    then:
                      - lambda: |-
                          int selected = lv_roller_get_selected(id(normal_settings_input_roller)->obj);
                          int pending = 4;
                          if (selected == 1) {
                            pending = 2;
                          } else if (selected == 2) {
                            pending = 1;
                          }
                          id(normal_input_pending_value) = pending;
                          id(ui_presenter)->notify_user_activity();
    - id: normal_settings_connection_page
      bg_color: 0x272727
      border_width: 0
      pad_all: 0
      widgets:
        - label:
            y: ${ (20 * (ui_scale | float)) | round | int }
            align: top_mid
            text_font: fonts_MiSans_Medium_18
            text: "Home Assistant"
            text_color: 0xFFFFFF
        - label:
            id: normal_settings_connection_status
            y: ${ (60 * (ui_scale | float)) | round | int }
            align: top_mid
            text_font: fonts_MiSans_Medium_16
            text: "Waiting for connection"
            text_color: 0xFFFFFF
        - label:
            id: normal_settings_connection_url
            y: ${ (94 * (ui_scale | float)) | round | int }
            width: ${ (208 * (ui_scale | float)) | round | int }
            align: top_mid
            text_align: CENTER
            text_font: fonts_MiSans_Medium_16
            text: "Open the device's Visit link"
            text_color: 0xD2D2D2
        - label:
            y: ${ (157 * (ui_scale | float)) | round | int }
            align: top_mid
            text_align: CENTER
            text_font: fonts_MiSans_Medium_14
            text: "Press: retry connection\nHold: return"
            text_color: 0xD2D2D2
    - id: standby_page
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - arc:
            id: standby_seconds_arc
            align: center
            width: ${ (240 * (ui_scale | float)) | round | int }
            height: ${ (240 * (ui_scale | float)) | round | int }
            pad_all: 0
            border_width: 0
            adjustable: false
            clickable: false
            min_value: 0
            max_value: 1000
            value: 0
            start_angle: 0
            end_angle: 360
            rotation: 270
            arc_width: ${ (4 * (ui_scale | float)) | round | int }
            arc_color: 0x414850
            indicator:
              arc_width: ${ (4 * (ui_scale | float)) | round | int }
              arc_color: 0x62B0FF
            hidden: true
        - image:
            id: standby_wifi_online_widget
            x: ${ (-13 * (ui_scale | float)) | round | int }
            y: ${ (10 * (ui_scale | float)) | round | int }
            width: ${ (20 * (ui_scale | float)) | round | int }
            align: TOP_MID
            src: standby_wifi_online_img
            hidden: !lambda |-
              return !id(normal_wifi_connected);
        - image:
            id: standby_wifi_offline_widget
            x: ${ (-13 * (ui_scale | float)) | round | int }
            y: ${ (10 * (ui_scale | float)) | round | int }
            align: TOP_MID
            src: standby_wifi_offline_img
            hidden: !lambda |-
              return id(normal_wifi_connected);
        - image:
            id: standby_homeassistant_online_widget
            x: ${ (13 * (ui_scale | float)) | round | int }
            y: ${ (10 * (ui_scale | float)) | round | int }
            align: TOP_MID
            src: standby_homeassistant_online_img
            hidden: !lambda |-
              return !id(normal_ha_api_connected);
        - image:
            id: standby_homeassistant_offline_widget
            x: ${ (13 * (ui_scale | float)) | round | int }
            y: ${ (10 * (ui_scale | float)) | round | int }
            align: TOP_MID
            src: standby_homeassistant_offline_img
            hidden: !lambda |-
              return id(normal_ha_api_connected);
        - image:
            id: standby_weather_unknown_widget
            x: ${ (70 * (ui_scale | float)) | round | int }
            y: ${ (41 * (ui_scale | float)) | round | int }
            align: top_left
            src: standby_weather_icon_unknown_img
        - image:
            id: standby_weather_clear_night_widget
            x: ${ (70 * (ui_scale | float)) | round | int }
            y: ${ (41 * (ui_scale | float)) | round | int }
            align: top_left
            src: standby_weather_icon_clear_night_img
            hidden: true
        - image:
            id: standby_weather_cloudy_widget
            x: ${ (70 * (ui_scale | float)) | round | int }
            y: ${ (41 * (ui_scale | float)) | round | int }
            align: top_left
            src: standby_weather_icon_cloudy_img
            hidden: true
        - image:
            id: standby_weather_exceptional_widget
            x: ${ (70 * (ui_scale | float)) | round | int }
