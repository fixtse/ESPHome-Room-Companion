            # Below the centred time (no overlap on tall panels).
            y: ${ (62 * (ui_scale | float)) | round | int }
            align: center
            text_font: fonts_MiSans_Medium_20
            text_color: 0xFFFFFF
            text: !lambda |-
              if (!id(ha_time_ready)) {
                return std::string("----");
              }
              auto now = id(ha_time).now();
              if (!now.is_valid()) {
                return std::string("----");
              }
              return now.strftime(onx_display_settings::date_pattern());
        - label:
            id: standby_time_widget
            x: 0
            y: 0
            align: center
            text_font: fonts_MiSans_Bold_64
            text_color: 0xFFFFFF
            text: !lambda |-
