                  scrollable: false
                  widgets:
                    - label:
                        id: normal_settings_input_title
                        align: center
                        text_font: fonts_MiSans_Medium_18
                        text_color: 0xFFFFFF
                        text: "Swipe sensitivity"
              - roller:
                  id: normal_settings_input_roller
                  x: 0
                  y: ${ (-2 * (ui_scale | float)) | round | int }
                  width: ${ (168 * (ui_scale | float)) | round | int }
                  height: ${ (78 * (ui_scale | float)) | round | int }
                  align: center
                  mode: NORMAL
                  visible_row_count: 3
                  selected_index: 0
                  options:
                    - "Low"
                    - "Medium"
                    - "High"
                  on_change:
                    then:
                      - lambda: |-
                          int selected = lv_roller_get_selected(id(normal_settings_input_roller)->obj);
                          int pending = 4;
                          if (selected == 1) {
                            pending = 2;
                          } else if (selected == 2) {
                            pending = 1;
                          }
                          id(normal_input_pending_value) = pending;
                          id(ui_presenter)->notify_user_activity();
