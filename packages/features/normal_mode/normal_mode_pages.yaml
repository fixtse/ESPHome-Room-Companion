                  border_width: 0
                  adjustable: false
                  clickable: false
                  min_value: 0
                  max_value: 1000
                  value: 0
                  start_angle: 0
                  end_angle: 360
                  rotation: 270
                  arc_width: ${ (4 * (ui_scale | float)) | round | int }
                  arc_color: 0x414850
                  arc_rounded: true
