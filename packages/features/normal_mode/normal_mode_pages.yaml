# Layout is authored for a 240x240 base layout. Rectangular panels
# set ui_scale (and the other geometry substitutions) in their board profile.
substitutions:
  ui_scale: 1

lvgl:
  top_layer:
    widgets:
      - image:
          id: normal_device_wifi_online_widget
          x: ${ (-13 * (ui_scale | float)) | round | int }
          y: ${ (10 * (ui_scale | float)) | round | int }
          width: ${ (20 * (ui_scale | float)) | round | int }
          align: TOP_MID
          src: standby_wifi_online_img
          hidden: true
      - image:
          id: normal_device_wifi_offline_widget
          x: ${ (-13 * (ui_scale | float)) | round | int }
          y: ${ (10 * (ui_scale | float)) | round | int }
          align: TOP_MID
          src: standby_wifi_offline_img
          hidden: true
      - image:
          id: normal_device_homeassistant_online_widget
          x: ${ (13 * (ui_scale | float)) | round | int }
          y: ${ (10 * (ui_scale | float)) | round | int }
          align: TOP_MID
          src: standby_homeassistant_online_img
          hidden: true
      - image:
          id: normal_device_homeassistant_offline_widget
          x: ${ (13 * (ui_scale | float)) | round | int }
          y: ${ (10 * (ui_scale | float)) | round | int }
          align: TOP_MID
          src: standby_homeassistant_offline_img
          hidden: true
      - obj:
          id: normal_action_feedback
          align: bottom_mid
          y: ${ (-28 * (ui_scale | float)) | round | int }
          width: ${ (48 * (ui_scale | float)) | round | int }
          height: ${ (48 * (ui_scale | float)) | round | int }
          radius: ${ (24 * (ui_scale | float)) | round | int }
          bg_color: 0x000000
          bg_opa: 85%
          border_width: 0
          pad_all: 0
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - image:
                id: normal_action_feedback_icon
                align: center
                src: action_sent_img
      - obj:
          id: normal_message_overlay
          x: 0
          y: 0
          width: ${ (240 * (ui_scale | float)) | round | int }
          height: ${ (240 * (ui_scale | float)) | round | int }
          radius: ${ (120 * (ui_scale | float)) | round | int }
          bg_color: 0x1A1A1A
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - arc:
                id: normal_message_countdown_arc
                align: center
                width: ${ (240 * (ui_scale | float)) | round | int }
                height: ${ (240 * (ui_scale | float)) | round | int }
                pad_all: 0
                border_width: 0
                adjustable: false
                clickable: false
                min_value: 0
                max_value: 1000
                value: 1000
                start_angle: 0
                end_angle: 360
                rotation: 270
                arc_width: ${ (4 * (ui_scale | float)) | round | int }
                arc_color: 0x414850
                indicator:
                  arc_width: ${ (4 * (ui_scale | float)) | round | int }
                  arc_color: 0x62B0FF
                hidden: true
            - label:
                align: top_mid
                y: ${ (20 * (ui_scale | float)) | round | int }
                text_font: fonts_MiSans_Bold_12
                text_color: 0x62B0FF
                text: "Notification"
            - label:
                id: normal_message_title
                align: top_mid
                y: ${ (43 * (ui_scale | float)) | round | int }
                width: ${ (184 * (ui_scale | float)) | round | int }
                height: ${ (44 * (ui_scale | float)) | round | int }
                long_mode: WRAP
                text_align: CENTER
                text_font: fonts_MiSans_Medium_18
                text_color: 0xFFFFFF
                text: ""
            - image:
                id: normal_message_image
                align: top_mid
                y: ${ (70 * (ui_scale | float)) | round | int }
                src: notification_image
                hidden: true
            - obj:
                id: normal_message_body
                align: top_mid
                y: ${ (94 * (ui_scale | float)) | round | int }
                width: ${ (168 * (ui_scale | float)) | round | int }
                height: ${ (110 * (ui_scale | float)) | round | int }
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: true
                clickable: false
                widgets:
                  - label:
                      id: normal_message_text
                      x: 0
                      y: 0
                      width: ${ (160 * (ui_scale | float)) | round | int }
                      text_line_space: ${ (2 * (ui_scale | float)) | round | int }
                      long_mode: WRAP
                      text_font: fonts_MiSans_Medium_16
                      text_color: 0xFFFFFF
                      text: ""
            - label:
                align: top_mid
                y: ${ (212 * (ui_scale | float)) | round | int }
                width: ${ (120 * (ui_scale | float)) | round | int }
                height: ${ (16 * (ui_scale | float)) | round | int }
                text_align: CENTER
                text_font: fonts_MiSans_Bold_12
                text_color: 0xB8B8B8
                text: "Press to dismiss"
      - obj:
          id: normal_gesture_feedback
          align: bottom_mid
          y: ${ (-44 * (ui_scale | float)) | round | int }
          width: ${ (168 * (ui_scale | float)) | round | int }
          height: ${ (40 * (ui_scale | float)) | round | int }
          radius: ${ (12 * (ui_scale | float)) | round | int }
          bg_color: 0x000000
          bg_opa: 85%
          border_width: 0
          pad_all: ${ (4 * (ui_scale | float)) | round | int }
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - label:
                id: normal_gesture_feedback_text
                align: center
                width: ${ (158 * (ui_scale | float)) | round | int }
                long_mode: DOT
                text_align: CENTER
                text_font: fonts_MiSans_Medium_18
                text_color: 0xFFFFFF
                text: ""
  pages:
    - id: device_empty
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - obj:
            id: normal_device_empty_shell
            x: 0
            y: 0
            width: ${ (240 * (ui_scale | float)) | round | int }
            height: ${ (240 * (ui_scale | float)) | round | int }
            radius: 0
            bg_color: 0x272727
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - image:
                  src: homeassistant_img
                  width: ${ (43 * (ui_scale | float)) | round | int }
                  height: ${ (43 * (ui_scale | float)) | round | int }
                  align: TOP_MID
                  y: ${ (10 * (ui_scale | float)) | round | int }
              - label:
                  x: 0
                  y: ${ (55 * (ui_scale | float)) | round | int }
                  align: top_mid
                  text_font: fonts_MiSans_Bold_16
                  text_color: 0xFFFFFF
                  text: "Add controlled Device"
              - label:
                  x: 0
                  y: ${ (73 * (ui_scale | float)) | round | int }
                  align: top_mid
                  text_font: fonts_MiSans_Bold_16
                  text_color: 0xFFFFFF
                  text: "in Home Assistant"
              - label:
                  y: ${ (100 * (ui_scale | float)) | round | int }
                  align: top_mid
                  text_font: fonts_MiSans_Bold_14
                  text_color: 0x4AC81A
                  text: "Controlled devices not added"
              - label:
                  y: ${ (123 * (ui_scale | float)) | round | int }
                  align: top_mid
                  width: ${ (205 * (ui_scale | float)) | round | int }
                  text_align: CENTER
                  text_font: fonts_MiSans_Medium_16
                  text_color: 0xD2D2D2
                  text: "Open the device's Visit link\nto choose your controls"

    # The rectangular carousel has one native host, without legacy body widgets.
    - id: normal_panel_page
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false

    - id: normal_switch_page
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - obj:
            id: normal_switch_detail_shell
            x: 0
            y: 0
            width: ${ (240 * (ui_scale | float)) | round | int }
            height: ${ (240 * (ui_scale | float)) | round | int }
            radius: ${ (120 * (ui_scale | float)) | round | int }
            bg_color: 0x272727
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - image:
                  id: normal_switch_entity_icon
                  align: top_mid
                  y: ${ (40 * (ui_scale | float)) | round | int }
                  src: fallback_toggle_switch_img
                  scale: 1.0
              - image:
                  id: normal_device_detail_switch_off
                  x: 0
                  y: ${ (40 * (ui_scale | float)) | round | int }
                  align: top_mid
                  src: normal_device_detail_switch_off_img
              - image:
                  id: normal_device_detail_switch_on
                  x: 0
                  y: ${ (40 * (ui_scale | float)) | round | int }
                  align: top_mid
                  src: normal_device_detail_switch_on_img
                  hidden: true
              - image:
                  id: normal_device_detail_plug_off
                  x: 0
                  y: ${ (40 * (ui_scale | float)) | round | int }
                  align: top_mid
                  src: normal_device_detail_plug_off_img
                  hidden: true
              - image:
                  id: normal_device_detail_plug_on
                  x: 0
                  y: ${ (40 * (ui_scale | float)) | round | int }
                  align: top_mid
                  src: normal_device_detail_plug_on_img
                  hidden: true
              - image:
                  id: normal_device_detail_light_off
                  x: 0
                  y: ${ (40 * (ui_scale | float)) | round | int }
                  align: top_mid
                  src: normal_device_detail_light_off_img
                  hidden: true
              - image:
                  id: normal_device_detail_light_on
                  x: 0
                  y: ${ (40 * (ui_scale | float)) | round | int }
                  align: top_mid
                  src: normal_device_detail_light_on_img
                  hidden: true
              - arc:
                  id: normal_dimming_light_detail_arc
                  x: 0
                  y: 0
                  align: center
                  width: ${ (224 * (ui_scale | float)) | round | int }
                  height: ${ (224 * (ui_scale | float)) | round | int }
                  adjustable: false
                  min_value: 0
                  max_value: 100
                  value: 50
                  start_angle: 0
                  end_angle: 270
                  rotation: 135
                  arc_width: ${ (10 * (ui_scale | float)) | round | int }
                  arc_rounded: true
                  arc_color: 0x5A5A5A
                  indicator:
                    arc_color: 0x62B0FF
                  knob:
                    width: ${ (16 * (ui_scale | float)) | round | int }
                    height: ${ (16 * (ui_scale | float)) | round | int }
                    radius: ${ (8 * (ui_scale | float)) | round | int }
                    bg_color: 0xFFFFFF
                    bg_opa: COVER
                    border_width: 0
                    shadow_width: 0
                    pad_all: ${ (2 * (ui_scale | float)) | round | int }
                  hidden: true
              - label:
                  id: normal_switch_detail_state
                  x: 0
                  y: ${ (148 * (ui_scale | float)) | round | int }
                  align: top_mid
                  text_font: fonts_MiSans_Medium_32
                  text_color: 0xFFFFFF
                  text: "OFF"
              - label:
                  id: normal_switch_detail_title
                  x: 0
                  y: ${ (192 * (ui_scale | float)) | round | int }
                  align: top_mid
                  text_font: fonts_MiSans_Medium_18
                  text_color: 0xD2D2D2
                  width: ${ (125 * (ui_scale | float)) | round | int }
                  height: ${ (25 * (ui_scale | float)) | round | int }
                  long_mode: dot
                  text_align: CENTER
                  text: "Switch"
              - obj:
                  id: normal_switch_detail_offline_overlay
                  x: 0
                  y: 0
                  width: ${ (240 * (ui_scale | float)) | round | int }
                  height: ${ (240 * (ui_scale | float)) | round | int }
                  radius: ${ (120 * (ui_scale | float)) | round | int }
                  bg_color: 0x000000
                  bg_opa: 70%
                  border_width: 0
                  pad_all: 0
                  clickable: true
                  scrollable: false
                  hidden: true
                  widgets:
                    - label:
                        id: normal_switch_detail_offline_text
                        align: center
                        text_align: center
                        text_font: fonts_MiSans_Medium_18
                        text_color: 0xFFFFFF
                        text: !lambda |-
                          if (!id(normal_wifi_connected)) {
                            return std::string("WiFi disconnected");
                          }
                          if (!id(normal_ha_api_connected)) {
                            return std::string("Home Assistant\ndisconnected");
                          }
                          return std::string("Device Offline");
        - switch:
            id: hmi_gui_switch
            x: ${ (-1000 * (ui_scale | float)) | round | int }
            y: ${ (-1000 * (ui_scale | float)) | round | int }
            width: ${ (1 * (ui_scale | float)) | round | int }
            height: ${ (1 * (ui_scale | float)) | round | int }
            hidden: true
    - id: normal_automation_page
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - obj:
            id: normal_automation_detail_shell
            x: 0
