interval:
  - interval: 100ms
    then:
      - script.execute: refresh_standby_seconds_ring
      - script.execute: refresh_normal_message_popup
      - script.execute: dispatch_normal_gesture_queue
      - script.execute: refresh_normal_gesture_feedback
      - lambda: |-
          if(!id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active() ||
              id(normal_page_index)!=0 || id(normal_device_detail_active) || id(screen_off_state) || id(sleep_mode_state))
            onx_navigation::hide();
          const bool active = !id(screen_off_state) && !id(sleep_mode_state) &&
                              id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active();
          const auto entity = onx_controls::dispatch_target(active, id(normal_device_detail_active),
              id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index)));
          onx_controls::tick(id(api_server), entity, id(normal_ha_api_connected));
          custom_logic_entity_sub::tick_subscriptions(id(api_server));
          custom_logic_entity_sub::recover_entity_states(id(api_server), id(normal_ha_api_connected));
  - interval: 1s
    then:
      - lambda: |-
          // Warm configured icons in the background after input has settled.
          // RAM caching remains bounded and does not write icons into NVS.
          if (id(ui_presenter)->is_normal_mode_active() && !id(sleep_mode_state) && !id(screen_off_state) &&
              id(ui_presenter)->user_idle_ms() > 2000 && !onx_media::downloading) {
            for (const auto &meta : onx_icon_state::metadata)
              id(entity_icon_downloader)->prefetch(meta.chosen());
          }
      - lambda: |-
          const auto now=id(ha_time).now();
          if(now.is_valid() && id(normal_ha_api_connected)) custom_logic_entity_sub::sample_sensor_history(now.timestamp);
      - script.execute: check_normal_timer_popup
      - script.execute: check_normal_idle_media_popup
      - script.execute: refresh_normal_device_page
      # A Native API client becomes identifiable as HA only after it subscribes
      # to states, which happens after on_client_connected. Keep this derived
      # state authoritative and self-healing.
      - lambda: |-
          custom_logic::process_pending_api_client_refresh();
      - script.execute: refresh_normal_ha_connection_state
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() && !id(normal_backlight_applied_once);
          then:
            - lambda: |-
                int pct = id(normal_brightness_value);
                if (pct < 10) pct = 10;
                if (pct > 100) pct = 100;
                id(normal_brightness_value) = pct;
                auto call = id(lcd_backlight)->make_call();
                call.set_brightness((float) pct / 100.0f);
                call.set_state(true);
                call.set_transition_length(500);
                call.perform();
                id(ha_display_light_syncing) = true;
                auto ha_call = id(ha_light)->make_call();
                ha_call.set_state(true);
                ha_call.set_brightness((float)pct / 100.0f);
                ha_call.perform();
                id(ha_display_light_syncing) = false;
                id(normal_backlight_applied_once) = true;
      - if:
          condition:
            lambda: |-
              return !id(ui_presenter)->is_normal_mode_active() && id(normal_backlight_applied_once);
          then:
            - lambda: |-
                id(normal_backlight_applied_once) = false;
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     id(mode_manager)->is_provisioning_mode_enabled();
          then:
            - lvgl.page.show: normal_provisioning_page
            - script.execute: refresh_normal_provisioning_page
      # Always leave the setup screen once connected, including restored
      # devices with existing entities or an already paired HA connection.
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->is_connected() &&
                     lv_scr_act() == id(normal_provisioning_page)->obj;
          then:
            - lambda: |-
                id(normal_page_index) = 0;
                id(normal_device_detail_active) = false;
                id(ui_presenter)->notify_user_activity();
            - script.execute:
                id: show_normal_device_entry_page
                direction: 0
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     !id(mode_manager)->is_provisioning_mode_enabled() &&
                     id(normal_page_index) == 0 &&
                     !id(normal_device_detail_active) &&
                     !id(normal_ha_added) &&
                     id(normal_device_count) <= 0 &&
                     id(normal_device_selected_index) == 0;
          then:
            - script.execute:
                id: show_normal_device_entry_page
                direction: 0
            - script.execute: refresh_normal_provisioning_page
      - if:
          condition:
            lambda: |-
              auto now = id(ha_time).now();
              return now.is_valid() &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     id(normal_ha_added) &&
                     !id(screen_off_state) &&
                     !id(sleep_mode_state) &&
                     id(ui_presenter)->should_enter_sleep_mode(now.hour, now.minute);
          then:
            - script.execute: enter_sleep_mode
      - if:
          condition:
            lambda: |-
              auto now = id(ha_time).now();
              return now.is_valid() &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     id(sleep_mode_state) &&
                     !id(ui_presenter)->is_sleep_mode_window_active(now.hour, now.minute);
          then:
            - script.execute: exit_sleep_mode
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     !id(sleep_mode_state) &&
                     id(ui_presenter)->is_standby_active();
          then:
            - script.execute: refresh_normal_standby_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT) &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - lvgl.page.show: normal_light_page
            - script.execute: refresh_normal_light_detail_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_CURTAIN &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - lvgl.page.show: normal_curtain_page
            - script.execute: refresh_normal_curtain_detail_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - lvgl.page.show: normal_settings_page
            - script.execute: refresh_normal_settings_detail_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - lvgl.page.show: normal_settings_wifi_page
            - script.execute: refresh_normal_settings_wifi_detail_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - lvgl.page.show: normal_settings_brightness_page
            - script.execute: refresh_normal_settings_brightness_detail_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_INPUT &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - lvgl.page.show: normal_settings_input_page
            - script.execute: refresh_normal_settings_input_detail_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_CONNECTION &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - lvgl.page.show: normal_settings_connection_page
            - script.execute: refresh_normal_settings_connection_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - if:
                condition:
                  lambda: return lv_scr_act() != id(normal_automation_page)->obj;
                then:
                  - lvgl.page.show: normal_automation_page
            - script.execute: refresh_normal_automation_detail_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_device_detail_active) &&
                     (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SWITCH ||
                      id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_PLUG) &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - lvgl.page.show: normal_switch_page
            - script.execute: refresh_normal_switch_detail_page
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     wifi::global_wifi_component != nullptr &&
                     wifi::global_wifi_component->has_sta() &&
                     !wifi::global_wifi_component->get_sta().get_ssid().empty() &&
                     id(normal_ha_added) &&
                     id(normal_page_index) == 0 &&
                     !id(normal_device_detail_active) &&
                     !id(ui_presenter)->is_standby_active();
          then:
            - script.execute:
                id: show_normal_device_entry_page
                direction: 0

  # Animate only the currently visible timer; all other pages keep their cadence.
  - interval: 100ms
    then:
      - script.execute: refresh_normal_timer_detail
      - lambda: |-
          // The worker has its own 15 s network budget plus decode time; only catch hangs.
          if (onx_media::downloading && millis() - onx_media::requested_ms >= 25000) {
            lv_obj_add_flag(id(normal_media_cover), LV_OBJ_FLAG_HIDDEN);
            onx_render::image(id(normal_media_cover), id(fallback_music_note_img)->get_lv_image_dsc());
            lv_image_cache_drop(id(media_cover_image)->get_lv_image_dsc());
            lv_image_header_cache_drop(id(media_cover_image)->get_lv_image_dsc());
            if (onx_media::detach_main_artwork) onx_media::detach_main_artwork();
            id(media_cover_image)->release();
            onx_media::downloading = false; onx_media::ready_url.clear();
            id(entity_icon_downloader)->set_artwork_busy(false);
            onx_media::last_artwork_end_ms = millis();
            // Retry the same URL after ~10 s rather than the 60 s duplicate guard.
            ++onx_media::stat_timeouts; onx_media::stat_last_failure = "watchdog timeout";
            onx_media::requested_ms = millis() - 50000;
            onx_media::artwork_refresh_pending = true;
            onx_runtime::record("artwork_timeout");
          }
          if (onx_media::retry_at_ms != 0 && static_cast<int32_t>(millis() - onx_media::retry_at_ms) >= 0) {
            onx_media::retry_at_ms = 0;
            onx_media::artwork_refresh_pending = true;
          }
          if (onx_media::artwork_refresh_pending) {
            onx_media::artwork_refresh_pending = false;
            id(refresh_normal_automation_detail_page).execute();
          }
      - script.execute: refresh_normal_media_progress
      - script.execute: refresh_normal_media_overlay
      - script.execute: refresh_normal_playlist
      - script.execute: refresh_normal_action_feedback
