# Local external components host the state machine and protocol logic.
# YAML stays focused on wiring and composition.
external_components:
  - source:
      type: local
      path: ../../my_components
    components:
      - online_image
      - ili9xxx
      - onx_app_state
      - onx_storage
      - onx_mode_manager
      - onx_ui
      - onx_config_web
      - onx_icons
      - onx_button

# Shared runtime state for all future modes.
onx_app_state:
  id: app_state

# Storage abstraction; future versions will back this with NVS/eFuse.
onx_storage:
  id: app_storage

# Central mode router. It enters normal mode after runtime state is initialized.
onx_mode_manager:
  id: mode_manager
  app_state_id: app_state
  normal_wifi_ssid: ${wifi_ssid}
  normal_wifi_password: ${wifi_password}
  runtime_log_level: ${logger_level}

# UI presenter/view-model layer. Keep display business logic centralized in C++
# so YAML focuses on layout and bindings.
onx_ui:
  id: ui_presenter
  app_state_id: app_state
  storage_id: app_storage


onx_icons:
  id: entity_icon_downloader

onx_config_web:
  id: entity_config_web
  handler: !lambda |-
    #ifdef USE_ROOM_COMPANION
    const auto pages = onx_panel_pages::rpc(query.op, query.data, query.search, query.offset, query.total);
    if (!pages.empty()) return pages;
    // Room Companion panels: dashboard stream settings (panel_state / panel_save).
    if (esphome::room_companion::global_panel != nullptr) {
      const auto panel = esphome::room_companion::global_panel->handle_web(query.op, query.data);
      if (!panel.empty()) return panel;
    }
    #endif
    if (query.op == "state") return onx_entity_config::state(id(ha_host).state, id(normal_wifi_connected), id(normal_ha_api_connected), id(wifi_rssi).state, id(media_cover_image)->last_error());
    if (query.op == "preview") {
      onx_preview::Context c;
      const auto clock = id(ha_time).now();
      c.now_epoch = clock.is_valid() ? uint32_t(clock.timestamp) : 0; c.clock_valid = clock.is_valid();
      #ifdef USE_ROOM_COMPANION
      c.panel_width = id(lcd_display)->get_width(); c.panel_height = id(lcd_display)->get_height();
      #endif
      c.device_count = id(normal_device_count); c.api_connected = id(normal_ha_api_connected);
      c.ha_host = id(ha_host).state; c.detail_light_mode = int(id(normal_detail_light_mode));
      c.light = [](int ui) { return id(app_storage)->normal_device_slot(ui).light(); };
      c.light_mode = [](int ui) { return id(normal_device_detail_active) && id(normal_device_detail_index) == ui ? int(id(normal_detail_light_mode)) : 0; };
      c.entity_at = [](int ui) { return id(ui_presenter)->get_normal_device_entity_id(ui); };
      c.type_at = [](int ui) { return id(ui_presenter)->get_normal_device_type(ui); };
      return onx_entity_config::build_json([&](JsonObject root) { onx_preview::build(root, query.entity, c); });
    }
    if (query.op == "icon_status") {
      return onx_entity_config::build_json([&](JsonObject root) {
        JsonArray slots = root["slots"].to<JsonArray>();
        for (size_t i = 0; i < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT; ++i) {
          const auto entity = custom_logic::cached_device_entity_id(i);
          if (entity.empty()) continue;
          const auto &meta = onx_icon_state::metadata[i];
          const auto icon = onx_icon_state::selected_icon(entity);
          auto slot = slots.add<JsonObject>();
          slot["slot"] = i + 1;
          slot["configured"] = meta.entity == entity ? meta.configured : "";
          slot["runtime"] = meta.entity == entity ? meta.runtime : "";
          slot["device_class"] = meta.entity == entity ? meta.device_class : "";
          slot["selected"] = icon;
          slot["status"] = id(entity_icon_downloader)->status(icon);
          slot["error"] = id(entity_icon_downloader)->error(icon);
        }
      });
    }
    if (query.op == "icon") {
      if (query.slot < 0 || query.slot >= (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT || query.entity != custom_logic::cached_device_entity_id(query.slot) ||
          (!query.icon.empty() && !onx_icon_state::valid_icon(query.icon)) ||
          (query.icon_override != "0" && query.icon_override != "1"))
        return onx_entity_config::error("Entity changed; reload configuration before syncing icons");
      if (!onx_entity_config::save_icon(query.slot, query.entity, query.icon, query.icon_override == "1"))
        return onx_entity_config::error("Could not save entity icon");
      id(refresh_normal_device_page).execute();
      id(refresh_normal_automation_detail_page).execute();
      return std::string("{\"ok\":true}");
    }
    if (query.op == "ha_host") {
      if ((query.search.rfind("http://", 0) != 0 && query.search.rfind("https://", 0) != 0) ||
          custom_logic::build_ha_http_state_url(query.search, "sensor.placeholder").empty())
        return onx_entity_config::error("Enter a valid Home Assistant address");
      { auto ha_host_call = id(ha_host).make_call(); ha_host_call.set_value(query.search); ha_host_call.perform(); }  // control() persists; publish_state() would not
      return std::string("{\"ok\":true}");
    }
    if (query.op == "retry") {
      static bool retried = false;
      static uint32_t last_retry = 0;
      if (retried && millis() - last_retry < 2000) return onx_entity_config::error("Wait a moment before retrying");
      retried = true; last_retry = millis();
      custom_logic_entity_sub::cancel_controls();
      id(entity_icon_downloader)->retry();
      for (size_t slot = 0; slot < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT; ++slot)
        custom_logic_entity_sub::queue_entity_refresh(custom_logic::cached_device_entity_id(slot), false);
      custom_logic_entity_sub::queue_entity_refresh(custom_logic::cached_standby_weather_entity_id, false);
      custom_logic::disconnect_all_clients_for_refresh(id(api_server));
      return std::string("{\"ok\":true}");
    }
    // ImmichFrame idle screen (room_companion/panel.yaml entities), also editable
    // from Home Assistant. "immich" takes the values as lines in `data`:
    // url, idle screen (0 clock, 1 dashboard, 2 ImmichFrame), fit, pairs,
    // details (comma list), fade, interval and (optional) the clock on photos
    // (0 large, 1 small, 2 photo only).
    if (query.op == "immich_state") {
      return onx_entity_config::build_json([&](JsonObject root) {
        root["url"] = id(panel_immichframe_url).state;
        root["idle"] = std::to_string(id(panel_idle_screen).active_index().value_or(0));
        root["fit"] = std::to_string(id(panel_immichframe_fit).active_index().value_or(0));
        root["split"] = id(panel_immichframe_split).state ? "1" : "0";
        std::string details;
        auto add = [&](bool on, const char *n) { if (on) details += (details.empty() ? "" : ",") + std::string(n); };
        add(id(panel_immichframe_info_date).state, "date");
        add(id(panel_immichframe_info_location).state, "location");
        add(id(panel_immichframe_info_album).state, "album");
        add(id(panel_immichframe_info_people).state, "people");
        add(id(panel_immichframe_info_description).state, "description");
        root["details"] = details;
        root["fade"] = id(panel_slideshow_fade).state ? "1" : "0";
        root["interval"] = std::to_string(static_cast<int>(id(panel_slideshow_seconds).state));
        root["overlay"] = std::to_string(id(panel_photo_overlay).active_index().value_or(0));
      });
    }
    if (query.op == "immich") {
      std::vector<std::string> v;
      size_t start = 0;
      while (start <= query.data.size() && v.size() < 8) {
        const auto end = query.data.find('\n', start);
        v.push_back(query.data.substr(start, end == std::string::npos ? std::string::npos : end - start));
        if (end == std::string::npos) break;
        start = end + 1;
      }
      if (v.size() != 7 && v.size() != 8) return onx_entity_config::error("Incomplete idle screen settings");
      const int overlay = v.size() == 8 ? std::atoi(v[7].c_str()) : -1;
      if (v.size() == 8 && (overlay < 0 || overlay > 2)) return onx_entity_config::error("Invalid clock on photos");
      const auto &url = v[0];
      const int idle = std::atoi(v[1].c_str()), fit = std::atoi(v[2].c_str()), interval = std::atoi(v[6].c_str());
      if (url.size() > 255 || (!url.empty() && onx_panel_ui::immichframe_photo_url(url, 320, 480).empty()))
        return onx_entity_config::error("Enter the ImmichFrame address, for example http://192.168.1.20:8080");
      if (idle < 0 || idle > 2 || fit < 0 || fit > 2 || interval < 5 || interval > 600)
        return onx_entity_config::error("Invalid ImmichFrame settings");
      { auto c = id(panel_immichframe_url).make_call(); c.set_value(url); c.perform(); }
      { auto c = id(panel_idle_screen).make_call(); c.set_index(idle); c.perform(); }
      { auto c = id(panel_immichframe_fit).make_call(); c.set_index(fit); c.perform(); }
      { auto c = id(panel_slideshow_seconds).make_call(); c.set_value(interval); c.perform(); }
      if (overlay >= 0) { auto c = id(panel_photo_overlay).make_call(); c.set_index(overlay); c.perform(); }
      auto set = [](esphome::switch_::Switch *sw, bool on) { if (sw->state != on) { if (on) sw->turn_on(); else sw->turn_off(); } };
      set(id(panel_immichframe_split), v[3] == "1");
      set(id(panel_slideshow_fade), v[5] == "1");
      const auto has = [&](const char *n) { return ("," + v[4] + ",").find("," + std::string(n) + ",") != std::string::npos; };
      set(id(panel_immichframe_info_date), has("date"));
      set(id(panel_immichframe_info_location), has("location"));
      set(id(panel_immichframe_info_album), has("album"));
      set(id(panel_immichframe_info_people), has("people"));
      set(id(panel_immichframe_info_description), has("description"));
      return std::string("{\"ok\":true}");
    }
    if (query.op == "settings_state") {
      return onx_entity_config::build_json([&](JsonObject root) {
        root["brightness"] = std::to_string(std::clamp(id(normal_brightness_value), 10, 100));
        root["standby"] = std::to_string(id(app_storage)->get_standby_timeout_ms() / 1000U);
        root["date_format"] = onx_display_settings::date_format_text(onx_display_settings::datetime.date_format);
        root["show_ampm"] = onx_display_settings::datetime.show_ampm ? "1" : "0";
        root["hour_format"] = onx_display_settings::datetime.hour_format == 1 ? "12" : "24";
        root["media_color"] = onx_display_settings::color_text(onx_display_settings::current.media_color);
        root["orientation"] = std::to_string(onx_display_settings::orientation.turns*90);
        root["media_view"] = onx_display_settings::media_style.material?"material":"classic";
        root["clock_seconds_ring"] = onx_display_settings::behavior.clock_seconds?"1":"0";
        onx_entity_config::load_display_settings();
        root["hold_cue"] = onx_display_settings::hold_cue.show?"1":"0";
        onx_clock_sensors::load();
        root["clock_temperature"] = std::string(onx_clock_sensors::config.temperature);
        root["clock_humidity"] = std::string(onx_clock_sensors::config.humidity);
        root["clock_layout"] = std::to_string(onx_clock_sensors::parts());
        root["notifications_cover_timers"] = onx_display_settings::behavior.cover_timers?"1":"0";
        root["idle_view"] = onx_display_settings::idle.media?"media":"clock";
        root["background_color"] = onx_display_settings::color_text(onx_display_settings::background());
        root["standby_scope"] = onx_display_settings::scope_text(onx_display_settings::current.standby_scope);
        root["sensitivity"] = std::to_string(id(normal_input_applied_value));
        root["sleep_enabled"] = id(ui_presenter)->get_sleep_mode_enabled() ? "1" : "0";
        root["sleep_start"] = id(ui_presenter)->get_sleep_window_start_time().substr(0, 5);
        root["sleep_end"] = id(ui_presenter)->get_sleep_window_end_time().substr(0, 5);
        root["sleep_timeout"] = std::to_string(id(ui_presenter)->get_sleep_timeout_ms() / 1000U);
      });
    }
    if (query.op == "settings") {
      unsigned brightness, standby, sensitivity, sleep_timeout;
      uint32_t media_color, background_color; uint8_t standby_scope, date_format, hour_format, orientation;
      const auto date_text = query.date_format.empty() ? onx_display_settings::date_format_text(onx_display_settings::datetime.date_format) : query.date_format;
      const auto hour_text = query.hour_format.empty() ? (onx_display_settings::datetime.hour_format == 1 ? "12" : "24") : query.hour_format;
      if ((!query.orientation.empty() && !onx_display_settings::parse_orientation(query.orientation,orientation)) ||
          (!query.clock_seconds_ring.empty() && query.clock_seconds_ring!="0" && query.clock_seconds_ring!="1") ||
          (!query.hold_cue.empty() && query.hold_cue!="0" && query.hold_cue!="1") ||
          (query.clock_temperature!="none" && !onx_clock_sensors::valid(query.clock_temperature)) ||
          (query.clock_humidity!="none" && !onx_clock_sensors::valid(query.clock_humidity)) ||
          !onx_clock_sensors::valid_layout(query.clock_layout) ||
          (!query.notifications_cover_timers.empty() && query.notifications_cover_timers!="0" && query.notifications_cover_timers!="1") ||
          (!query.media_view.empty() && query.media_view!="classic" && query.media_view!="material") ||
          (!query.idle_view.empty() && query.idle_view!="clock" && query.idle_view!="media") ||
          (!query.show_ampm.empty() && query.show_ampm!="0" && query.show_ampm!="1") ||
          !onx_display_settings::parse_date_format(date_text, date_format) ||
          !onx_display_settings::parse_hour_format(hour_text, hour_format) ||
          !onx_display_settings::parse_color(query.media_color, media_color) ||
          (!query.background_color.empty() && !onx_display_settings::parse_color(query.background_color, background_color)) ||
          !onx_display_settings::parse_scope(query.standby_scope, standby_scope) ||
          !onx_config::integer_in_range(query.brightness, 10, 100, brightness) ||
          !onx_config::integer_in_range(query.standby, 1, 900, standby) ||
          !onx_config::integer_in_range(query.sensitivity, 1, 4, sensitivity) || sensitivity == 3 ||
          !onx_config::integer_in_range(query.sleep_timeout, 1, 3600, sleep_timeout) ||
          (query.sleep_enabled != "0" && query.sleep_enabled != "1") ||
          !onx_config::valid_time(query.sleep_start) || !onx_config::valid_time(query.sleep_end))
        return onx_entity_config::error("Invalid display or sleep settings; check the limits and times");
      const bool enabled = query.sleep_enabled == "1";
      const std::string start = query.sleep_start + ":00", end = query.sleep_end + ":00";
      const uint16_t start_minutes = (start[0] - '0') * 600 + (start[1] - '0') * 60 + (start[3] - '0') * 10 + start[4] - '0';
      const uint16_t end_minutes = (end[0] - '0') * 600 + (end[1] - '0') * 60 + (end[3] - '0') * 10 + end[4] - '0';
      if (!id(app_storage)->set_standby_timeout_ms(standby * 1000U) ||
          !id(app_storage)->set_sleep_mode_config(enabled, start_minutes, end_minutes, sleep_timeout * 1000U))
        return onx_entity_config::error("Could not persist display settings; retry");
      if (!onx_entity_config::save_display_settings(query.media_color, query.standby_scope, date_text, hour_text, query.show_ampm.empty() ? onx_display_settings::datetime.show_ampm!=0 : query.show_ampm=="1",query.idle_view,query.media_view,query.orientation,query.notifications_cover_timers,query.clock_seconds_ring,query.background_color))
        return onx_entity_config::error("Could not persist appearance settings; retry");
      if (!onx_clock_sensors::save(id(api_server), query.clock_temperature, query.clock_humidity))
        return onx_entity_config::error("Could not save the clock sensors; retry");
      if (!onx_clock_sensors::save_layout(query.clock_layout))
        return onx_entity_config::error("Could not save the clock screen content; retry");
      if (!onx_entity_config::save_hold_cue(query.hold_cue))
        return onx_entity_config::error("Could not persist appearance settings; retry");
      // Panels apply a new orientation at boot (panel.yaml restarts after a change).
      auto standby_call = id(standby_timeout_seconds).make_call();
      standby_call.set_value(standby); standby_call.perform();
      id(ui_presenter)->set_sleep_mode_config(enabled, start, end, sleep_timeout * 1000U);
      id(sleep_mode_enabled).publish_state(enabled);
      id(sleep_mode_start_time).publish_state(start);
      id(sleep_mode_end_time).publish_state(end);
      id(sleep_timeout_seconds).publish_state(sleep_timeout);
      id(normal_input_applied_value) = sensitivity;
      id(normal_input_pending_value) = sensitivity;
      id(normal_brightness_value) = brightness;
      auto light_call = id(lcd_backlight)->make_call();
      light_call.set_state(true); light_call.set_brightness(brightness / 100.0f); light_call.perform();
      id(screen_off_state) = false;
      id(ha_display_light_syncing) = true;
      auto ha_call = id(ha_light)->make_call();
      ha_call.set_state(true); ha_call.set_brightness(brightness / 100.0f); ha_call.perform();
      id(ha_display_light_syncing) = false;
      id(ui_presenter)->notify_user_activity();
      return std::string("{\"ok\":true}");
    }
    if (query.op == "weather") {
      if (!query.entity.empty() && (!onx_config::valid_entity(query.entity) || query.entity.rfind("weather.", 0) != 0)) return onx_entity_config::error("Choose a weather entity");
      if (!custom_logic::save_standby_weather_config_entity_id(query.entity) || !onx_entity_config::save_selected_metadata(query))
        return onx_entity_config::error("Could not save standby weather");
      custom_logic::apply_standby_weather_config_options(id(standby_weather_config));
      custom_logic_entity_sub::subscribe_standby_weather_entity(id(api_server), query.entity, &id(standby_weather_entity_id), &id(standby_weather_state), &id(standby_weather_temperature), &id(standby_weather_temperature_unit), &id(standby_weather_humidity));
      return std::string("{\"ok\":true}");
    }
    if (query.op == "presets") return onx_presets::list_json();
    if (query.op == "preset_save" || query.op == "preset_apply" || query.op == "preset_delete" || query.op == "preset_rename") {
      const auto error = query.op == "preset_save" ? onx_presets::save_current(query.name) :
          query.op == "preset_apply" ? onx_presets::apply(query.name) :
          query.op == "preset_delete" ? onx_presets::remove_preset(query.name) : onx_presets::rename_preset(query.name, query.search);
      if (!error.empty()) return onx_entity_config::error(error.c_str());
      return onx_presets::list_json();
    }
    if (query.op == "preset_get") {
      const auto chunk = onx_presets::export_chunk(query.name, query.offset);
      return chunk.empty() ? onx_entity_config::error("Preset not found") : chunk;
    }
    if (query.op == "preset_put") {
      size_t total = 0;
      for (char ch : query.total) total = (ch >= '0' && ch <= '9' && total <= onx_presets::MAX_BYTES) ? total * 10 + (ch - '0') : SIZE_MAX;
      if (query.total.empty() || total == 0 || total > onx_presets::MAX_BYTES)
        return onx_entity_config::error("Invalid preset upload");
      bool complete = false;
      const auto error = onx_presets::import_chunk(query.name, query.offset, total, query.data, complete);
      if (!error.empty()) return onx_entity_config::error(error.c_str());
      return complete ? onx_presets::list_json() : std::string("{\"received\":") + std::to_string(query.offset + query.data.size()) + "}";
    }
    if (query.op == "preset_done") {
      if (query.ticket != 0) return onx_entity_config::error("Unknown configuration request");
      onx_presets::finish(query.name);
      return std::string("{\"ok\":true}");
    }
    if (query.op != "save" || query.slot < 0 || query.slot >= (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT)
      return onx_entity_config::error("Unknown configuration request");
    if ((!query.entity.empty() && ((!onx_config::valid_entity(query.entity) && !custom_logic::is_local_hmi_gpio_switch_preset_option(query.entity)) ||
          !custom_logic::is_supported_normal_device_entity_id(query.entity.c_str()))) ||
        !onx_config::valid_press_action(query.entity,query.action) || (query.entity.empty() && !query.action.empty()))
      return onx_entity_config::error("Select a supported entity and a valid press action");
    if ((!query.icon.empty() && !onx_icon_state::valid_icon(query.icon)) ||
        (query.icon_override != "" && query.icon_override != "0" && query.icon_override != "1"))
      return onx_entity_config::error("Choose a valid MDI icon");
    const auto domain = custom_logic::ha_domain_from_entity_id(query.entity);
    if (onx_controls::handles(query.entity) && query.entity.rfind("media_player.", 0) != 0 && domain!="climate" && !query.action.empty())
      return onx_entity_config::error("This entity uses native press controls; choose Default");
    if (!query.type.empty()) {
      const bool allowed = (domain == "switch" && (query.type == "Switch" || query.type == "Plug")) ||
          (domain == "light" && (query.type == "Light (On/Off)" || query.type == "Dimmable Light" || query.type == "Color Temperature Light" || query.type == "RGB Light")) ||
          (domain == "cover" && (query.type == "Cover (Preset Off)" || query.type == "Cover (Preset On)"));
      if (!allowed) return onx_entity_config::error("Choose a type supported by this entity");
    }
    if ((!query.secondary.empty() && (!onx_config::valid_entity(query.secondary) || (domain!="sensor" && domain!="switch") || (domain=="switch" && query.secondary.rfind("sensor.",0)!=0))) ||
        (!query.sensor_graph.empty() && query.sensor_graph!="0" && query.sensor_graph!="1") ||
        (query.sensor_graph=="1" && domain!="sensor" && domain!="switch") ||
        (domain=="switch" && query.sensor_graph=="1" && query.secondary.empty()))
      return onx_entity_config::error("Choose a sensor, or a switch with a secondary power/energy sensor");
    if(query.sensor_graph=="1" && domain=="sensor") {
      const auto *d=custom_logic_entity_sub::entity_detail(query.entity);
      if(d && d->received && d->available && !std::isfinite(custom_logic_entity_sub::detail_number(d->state)))
        return onx_entity_config::error("Graphs require a numeric sensor");
    }
    if ((!query.timer_hidden.empty() && query.timer_hidden!="0" && query.timer_hidden!="1") ||
        (query.timer_hidden=="1" && domain!="timer" && domain!="sensor"))
      return onx_entity_config::error("Only timers and timer sensors can be hidden from the carousel");
    onx_gesture::Config gesture_config{};
    if(!onx_entity_config::parse_gestures(query.entity,query.gestures,gesture_config))
      return onx_entity_config::error("Choose valid gesture actions, feedback entity and step (1-100)");
    onx_cover_presets::Config cover_presets;
    if (!onx_cover_presets::parse(query.cover_presets,cover_presets) || (domain != "cover" && cover_presets.count))
      return onx_entity_config::error("Use up to four unique cover positions from 0 to 100, separated by commas");
    if (!query.cover_presets_enabled.empty() && query.cover_presets_enabled != "0" && query.cover_presets_enabled != "1")
      return onx_entity_config::error("Choose whether cover position presets are enabled");
    cover_presets.enabled = query.cover_presets_enabled != "0";
    onx_playlist::Config playlist_config{};
    if (!onx_entity_config::parse_playlists(query.entity,query.playlists,playlist_config))
      return onx_entity_config::error("Add up to eight playlist names (48 UTF-8 bytes) and valid script or automation entity IDs");
    if (!custom_logic::save_device_config_entity_id(query.slot, query.entity))
      return onx_entity_config::error("Could not save the displayed entity; retry");
    if (!onx_entity_config::save_action(query.slot, query.entity, query.action))
      return onx_entity_config::error("Entity saved, but press action could not be saved; retry");
    if (!onx_entity_config::save_sensor_config(query.slot,query.entity,query.secondary,query.secondary_text,query.sensor_graph=="1"))
      return onx_entity_config::error("Could not save sensor display settings; retry");
    if (!onx_entity_config::save_timer_visibility(query.slot,query.entity,query.timer_hidden=="1"))
      return onx_entity_config::error("Could not save timer visibility; retry");
    if(!onx_entity_config::save_gestures(query.slot,gesture_config))
      return onx_entity_config::error("Could not save gesture controls; retry");
    if (!onx_entity_config::save_cover_presets(query.entity,cover_presets))
      return onx_entity_config::error("Could not save cover positions; retry");
    if (!onx_entity_config::save_playlists(query.slot,playlist_config))
      return onx_entity_config::error("Could not save playlist actions; retry");
    if (!onx_entity_config::save_selected_metadata(query)) return onx_entity_config::error("Could not save selected entity details");
    if (!onx_entity_config::save_icon(query.slot, query.entity, query.icon, query.icon_override == "1"))
      return onx_entity_config::error("Could not save selected entity icon");
    auto &config = custom_logic::device_inferred_config(query.slot);
    config.title = query.name.empty() ? query.entity : query.name;
    if (!query.type.empty()) {
      if (!custom_logic::save_device_custom_config(query.slot, custom_logic::custom_type_from_device1_type_option(query.type), custom_logic::custom_light_capability_mask_from_device1_type_option(query.type)))
        return onx_entity_config::error("Could not save entity type");
    }
    custom_logic::apply_device_config_to_normal_ui_storage(query.slot);
    esphome::select::Select *entities[] = {id(device1_config), id(device2_config), id(device3_config),
        id(device4_config), id(device5_config), id(device6_config), id(device7_config),
        id(device8_config), id(device9_config), id(device10_config)};
    esphome::select::Select *types[] = {id(device1_type), id(device2_type), id(device3_type),
        id(device4_type), id(device5_type), id(device6_type), id(device7_type),
        id(device8_type), id(device9_type), id(device10_type)};
    if (query.slot < 10) {
      onx_entity_config::sync_select(query.slot, entities[query.slot]);
      custom_logic::apply_device_type_options(query.slot, types[query.slot]);
    }
    id(normal_device_count) = static_cast<int>(custom_logic::configured_normal_device_count());
    #ifdef USE_ROOM_COMPANION
    onx_panel_pages::dirty = true;  // Pages drop cleared entries and add new ones.
    #endif
    id(normal_device_detail_active) = false;
    id(normal_device_detail_kind) = NORMAL_DEVICE_DETAIL_KIND_NONE;
    id(normal_page_index) = 0;
    id(normal_device_selected_index) = 0;
    // Subscribes the new entity and releases what the slot followed before
    // (an empty entity releases everything). New pairs are announced to the
    // live HA connection, so no reconnect or reboot is needed.
    custom_logic_entity_sub::subscribe_entity(id(api_server), query.slot, query.entity);
    if (query.ticket != 0) onx_presets::mark_custom();
    id(show_normal_device_entry_page).execute(0);
    id(refresh_normal_device_page).execute();
    return std::string("{\"ok\":true}");

interval:
  # Album art and other panel-initiated HTTP use the HA host. While it is still
  # the factory default (homeassistant.local often does not resolve), adopt the
  # Home Assistant found by mDNS when exactly one answers. Addresses set by the
  # user are never replaced. Gives up after ~10 minutes until the next boot.
  - interval: 15s
    then:
      - lambda: |-
          static uint8_t attempts = 0;
          if (attempts >= 40 || id(ha_host).state != "homeassistant.local" || !id(normal_wifi_connected)) return;
          ++attempts;
          const auto url = id(entity_config_web)->auto_ha_url(millis());
          if (url.empty() || custom_logic::build_ha_http_state_url(url, "sensor.placeholder").empty()) return;
          ESP_LOGI("ha_host", "Using discovered Home Assistant at %s", url.c_str());
          { auto ha_host_call = id(ha_host).make_call(); ha_host_call.set_value(url); ha_host_call.perform(); }  // control() persists; publish_state() would not
