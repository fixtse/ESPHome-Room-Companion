# Room Companion for the ONX3248G035: the fixtSE knob application on a
# rectangular touch panel, with Assist and an optional dashboard stream.
substitutions:
  project_name: onx3248g035
  project_friendly_name: ONX3248G035
  # Leave empty to provision Wi-Fi with Improv (USB or Bluetooth) or the setup AP.
  wifi_ssid: ""
  wifi_password: ""
  ap_password: ""
  logger_level: INFO
  uart_baud: "115200"
  encoder_resolution: "4"
  standby_timeout_seconds: "300"
  diagnostics_update_interval: 15s
  display_update_interval: 200ms
  lcd_spi_data_rate: 40MHz
  lcd_backlight_default: 100%
  product_firmware_version: "2026.10.2.72-panel.1"
  product_firmware_manifest_url: "https://raw.githubusercontent.com/fixtse/esp-ota/main/ota/releases/onx3248g035_manifest.yml"
  # Optional first-boot defaults for the dashboard stream (editable on Visit).
  default_dashboard_server: ""
  default_dashboard_url: ""

packages:
  board: !include packages/room_companion/boards/onx3248g035.yaml
  application: !include packages/room_companion/application.yaml
